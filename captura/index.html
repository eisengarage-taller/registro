<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; media-src 'self' blob:; connect-src https://script.google.com https://script.googleusercontent.com https://www.googleapis.com; manifest-src 'self'; worker-src 'self'">
<title>EG Captura</title>
<meta name="theme-color" content="#1F2A30">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --asfalto:#1F2A30; --acero:#5B6B73; --concreto:#EEF1F2; --linea:#D5DBDE; --chapa:#FFFFFF;
  --senal:#E8A317; --senal-osc:#8A5A00; --ok:#2E7D4F; --freno:#B3362B; --radio:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--concreto);color:var(--asfalto);font:16px/1.45 Barlow,system-ui,sans-serif}
:focus-visible{outline:3px solid var(--senal);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--asfalto);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:4px solid var(--senal);display:flex;align-items:center;justify-content:space-between;gap:12px}
header b{font:700 22px/1 'Barlow Condensed',sans-serif;letter-spacing:.02em}
header span{font-size:13px;opacity:.8}
main{max-width:620px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom,0px))}
h2{font:600 18px/1.2 'Barlow Condensed',sans-serif;letter-spacing:.03em;text-transform:uppercase;color:var(--acero);margin:22px 0 8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:92px;background:var(--chapa);border:1px solid var(--linea);border-radius:var(--radio);font:600 15px Barlow,sans-serif;color:var(--asfalto);cursor:pointer;padding:10px}
.tile svg{width:30px;height:30px;stroke:var(--asfalto);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile:active{background:var(--concreto)}
.tile.rec{background:var(--freno);color:#fff;border-color:var(--freno)}
.tile.rec svg{stroke:#fff}
.card{background:var(--chapa);border:1px solid var(--linea);border-radius:var(--radio);padding:14px;margin-top:12px}
label{display:block;font-size:14px;color:var(--acero);margin:10px 0 4px}
input[type=text],input[type=url],textarea{width:100%;font:16px Barlow,sans-serif;border:1px solid var(--linea);border-radius:8px;padding:10px;background:#fff;color:var(--asfalto)}
textarea{min-height:110px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:8px;padding:12px 18px;font:600 16px Barlow,sans-serif;cursor:pointer;background:var(--asfalto);color:#fff;text-decoration:none}
.btn.go{background:var(--senal);color:var(--asfalto)}
.btn.ghost{background:transparent;color:var(--asfalto);border:1px solid var(--linea)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.files{list-style:none;margin:10px 0 0;padding:0}
.files li{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--concreto);padding:6px 0;font-size:15px}
.files li button{border:0;background:none;color:var(--freno);font:600 14px Barlow,sans-serif;cursor:pointer}
.list{display:flex;flex-direction:column;gap:8px}
.it{background:var(--chapa);border:1px solid var(--linea);border-radius:var(--radio);padding:10px 12px;font-size:15px}
.it .s{color:var(--acero);font-size:13px;margin-top:2px}
.bar{height:6px;background:var(--concreto);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--senal);width:0}
.chip{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;margin-left:6px;border:1px solid var(--linea);background:var(--concreto)}
.chip.ok{border-color:#A7D3B5;background:#EAF6EE;color:var(--ok)}
.chip.err{border-color:#E5A3A3;background:#FBEAEA;color:var(--freno)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.seg button{border:1px solid var(--linea);background:#fff;border-radius:999px;padding:7px 12px;font:600 14px Barlow,sans-serif;color:var(--asfalto);cursor:pointer}
.seg button.on{background:var(--asfalto);color:#fff;border-color:var(--asfalto)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select{width:100%;font:16px Barlow,sans-serif;border:1px solid var(--linea);border-radius:8px;padding:10px;background:#fff;color:var(--asfalto)}
.empty{color:var(--acero);background:var(--chapa);border:1px dashed var(--linea);border-radius:var(--radio);padding:16px}
.aviso{background:#FFF6DD;border:1px solid #E9C46A;border-radius:var(--radio);padding:12px 14px;margin-top:12px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;background:var(--asfalto);color:#fff;border-radius:10px;padding:12px 14px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;z-index:30}
.toast.on{opacity:1;transform:none}
.toast.err{background:var(--freno)}
input[type=file]{display:none}
@media (max-width:360px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><b>EG Captura</b><span id="estado">…</span></header>
<main id="main"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="fFoto" accept="image/*" capture="environment">
<input type="file" id="fVideo" accept="video/*" capture="environment">
<input type="file" id="fArchivo" multiple>
<script>
/* EG Captura (1.12) — Eisen Garage SpA.
 * Guarda en terreno notas, fotos, audios, videos, documentos y enlaces. Todo pasa por una cola en el celular (funciona sin señal)
 * y se sube cuando hay conexión: los archivos van directo a la carpeta "Capturas EG" de Drive (subida reanudable) y cada
 * captura queda como fila en CAPTURAS (EG Registro). Usa la misma llave de acceso de la app EG Registro de este celular.
 */
'use strict';
var API_URL = 'https://script.google.com/macros/s/AKfycby8W2UZmUiPr8cy_5X-EqjbRkN46ZTTNZUXzQ0pAnMrijFRZmsA9YHbCyOWdDdYhAgh/exec';
var ACCESO_KEY = 'eg_registro_acceso';
var TROZO = 8 * 1024 * 1024; // múltiplo de 256 KB (exigencia de Drive)
var MAX_BYTES = 300 * 1024 * 1024;
var $ = function (id) { return document.getElementById(id); };
function formNuevo() { return { id: uid(), archivos: [], tipo: 'Nota', origen: 'App', compartidos: [] }; }
var F = null; // formulario en curso (id fijo hasta guardarlo: un doble toque no duplica)
var grabador = null, trozosAudio = [], subiendo = false, guardando = false;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function uid() { return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)); }
F = formNuevo();
function llave_() { try { var v = localStorage.getItem(ACCESO_KEY); return /^[0-9a-f]{64}$/.test(v || '') ? v : null; } catch (e) { return null; } }
/* 1.14 (Q-5): la cola y la lista de clientes quedan ligadas al usuario de la sesión (se comprueba con "yo"). */
function llave() { return llave_(); }
function usuarioGuardado() { try { var u = JSON.parse(localStorage.getItem('eg_captura_usuario') || 'null'); return u && u.llave === (llave() || '').slice(0, 16) ? u : null; } catch (e) { return null; } }
function esAdmin(u) { return !!u && (u.rol === 'Administrador' || u.rol === 'Administracion'); }
function verificarUsuario() {
  if (!navigator.onLine || !llave()) return Promise.resolve(usuarioGuardado());
  var lv = llave();
  return api('yo', {}).then(function (d) {
    // 1.16: si la sesión cambió mientras llegaba la respuesta, no se guarda (sería el usuario anterior).
    if (llave() !== lv) return usuarioGuardado();
    var u = { id: d.usuario.id, nombre: d.usuario.nombre, rol: d.rol, llave: lv.slice(0, 16) };
    try { localStorage.setItem('eg_captura_usuario', JSON.stringify(u)); } catch (e) {}
    return u;
  });
}
/* 1.16 (R-3) / 1.17 (R2-2): lo de antes de 1.14 (sin dueño), en la cola y en el historial, queda a nombre del primer
   administrador verificado que abre la app en este celular. Desde ahí cada uno ve solo lo suyo. */
function adoptarSinDueno(u) {
  if (!esAdmin(u)) return Promise.resolve();
  return Promise.all(['cola', 'hechas'].map(function (st) {
    return cola.todos(st).then(function (l) {
      return Promise.all(l.filter(function (it) { return !it.usuario; }).map(function (it) { it.usuario = u.id; return cola.poner(it, st); }));
    });
  })).catch(function () {});
}
function mismoUsuario(a, b) { return !!a && !!b && a.id === b.id && a.llave === b.llave; }
function mb(b) { return b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
var tt;
function toast(m, err) { var t = $('toast'); t.textContent = m; t.className = 'toast on' + (err ? ' err' : ''); clearTimeout(tt); tt = setTimeout(function () { t.className = 'toast'; }, err ? 6000 : 3000); }
function tipoDe(mime) { return /^image\//.test(mime) ? 'Foto' : /^audio\//.test(mime) ? 'Audio' : /^video\//.test(mime) ? 'Video' : 'Documento'; }
function fechaCorta(iso) { var d = new Date(iso); return d.toLocaleDateString('es-CL', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' }); }

/* ───── cola en el celular (IndexedDB): cada captura con sus archivos, hasta que el servidor la confirma ───── */
var dbp = null;
function db() {
  if (dbp) return dbp;
  dbp = new Promise(function (ok, mal) {
    var r = indexedDB.open('eg-captura', 1);
    r.onupgradeneeded = function () { var d = r.result; d.createObjectStore('cola', { keyPath: 'id' }); d.createObjectStore('hechas', { keyPath: 'id' }); d.createObjectStore('compartido', { keyPath: 'id' }); };
    r.onsuccess = function () { ok(r.result); }; r.onerror = function () { mal(r.error); };
  });
  return dbp;
}
function tx(store, modo, fn) {
  return db().then(function (d) { return new Promise(function (ok, mal) {
    var t = d.transaction(store, modo), s = t.objectStore(store), out;
    var r = fn(s); if (r) r.onsuccess = function () { out = r.result; };
    t.oncomplete = function () { ok(out); }; t.onerror = function () { mal(t.error); }; t.onabort = function () { mal(t.error); };
  }); });
}
var cola = {
  todos: function (st) { return tx(st || 'cola', 'readonly', function (s) { return s.getAll(); }); },
  poner: function (x, st) { return tx(st || 'cola', 'readwrite', function (s) { return s.put(x); }); },
  sacar: function (id, st) { return tx(st || 'cola', 'readwrite', function (s) { return s.delete(id); }); }
};

/* ───── servidor ───── */
function api(accion, payload) {
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: accion, payload: payload, sesion: llave() }), redirect: 'follow' })
    .then(function (r) { return r.json(); })
    .then(function (r) { if (!r.ok) { var e = new Error((r.error && r.error.message) || 'Error'); e.code = r.error && r.error.code; throw e; } return r.data; });
}

/** Sube un archivo a Drive en trozos (subida reanudable). Devuelve el id del archivo en Drive. */
function subirArchivo(item, a, alAvanzar) {
  return api('captura_subida_iniciar', { nombre: a.nombre, mime: a.mime, bytes: a.blob.size }).then(function (s) {
    var total = a.blob.size;
    function trozo(desde) {
      var hasta = Math.min(desde + TROZO, total);
      return new Promise(function (ok, mal) {
        var x = new XMLHttpRequest();
        x.open('PUT', s.upload_url);
        x.setRequestHeader('Content-Range', 'bytes ' + desde + '-' + (hasta - 1) + '/' + total);
        x.upload.onprogress = function (e) { if (e.lengthComputable) alAvanzar((desde + e.loaded) / total); };
        x.onload = function () {
          if (x.status === 200 || x.status === 201) { try { ok({ fin: true, id: JSON.parse(x.responseText).id }); } catch (e) { mal(new Error('Respuesta de Drive no válida.')); } }
          else if (x.status === 308) ok({ fin: false, hasta: hasta });
          else mal(new Error('Drive respondió ' + x.status + '.'));
        };
        x.onerror = function () { mal(new Error('Se cortó la conexión.')); };
        x.send(a.blob.slice(desde, hasta));
      }).then(function (r) { return r.fin ? r.id : trozo(r.hasta); });
    }
    return trozo(0);
  });
}

/** Procesa la cola en orden. Cada paso queda guardado: un reintento no repite lo ya subido ni crea dos filas (op_id fijo). */
function procesar() {
  if (subiendo || !navigator.onLine || !llave()) return Promise.resolve();
  subiendo = true; pintarEstado();
  var yo = null;
  return verificarUsuario().then(function (u) {
    yo = u;
    if (!esAdmin(yo)) { var e = new Error('EG Captura es solo para administración (tu cuenta: ' + ((yo && yo.rol) || 'sin rol') + ').'); e.code = 'NO_AUTORIZADO'; throw e; }
    return adoptarSinDueno(yo).then(function () { return cola.todos(); });
  }).then(function (items) {
    // Lo guardado con otra cuenta en este navegador no se envía con la tuya (lo sin dueño ya se adoptó en adoptarSinDueno).
    items = items.filter(function (it) { return it.usuario === yo.id; });
    items.sort(function (a, b) { return a.creado < b.creado ? -1 : 1; });
    return items.reduce(function (p, item) {
      return p.then(function () { return procesarItem(item); }).catch(function (e) {
        item.error = e.message; item.intentos = (item.intentos || 0) + 1;
        return cola.poner(item).then(function () { if (e.code === 'NO_AUTENTICADO' || e.code === 'NO_AUTORIZADO') throw e; });
      });
    }, Promise.resolve());
  }).catch(function (e) { toast(e.message, true); }).then(function () { subiendo = false; pintar(); });
}

function procesarItem(item) {
  item.error = '';
  var pasos = Promise.resolve();
  // Una captura por archivo (el texto va en la primera). Sin archivos: una sola captura de texto o enlace.
  var partes = item.archivos.length ? item.archivos : [null];
  partes.forEach(function (a, i) {
    pasos = pasos.then(function () {
      if (a && a.hecho) return;
      var subida = (a && !a.drive_id) ? subirArchivo(item, a, function (f) { a.avance = f; pintarAvance(item.id, i, f); }).then(function (id) { a.drive_id = id; return cola.poner(item); }) : Promise.resolve();
      return subida.then(function () {
        var c = { tipo: a ? (i === 0 ? item.tipo : tipoDe(a.mime)) : item.tipo, fecha: item.fecha, origen: item.origen, titulo: item.titulo || (a ? a.nombre : ''), texto: i === 0 ? item.texto : '', url: i === 0 ? item.url : '' };
        if (a && i === 0 && item.tipo === 'Nota') c.tipo = tipoDe(a.mime);
        // Destino para todas las partes; montos solo en la primera (un mismo documento no se cuenta dos veces).
        var ex = item.extra || {};
        Object.keys(ex).forEach(function (k) { if (i === 0 || k === 'destino' || k === 'cliente_id') c[k] = ex[k]; });
        if (i > 0 && ex.destino === 'Personal') c.destino = 'Por definir';
        return api('captura_crear', { captura: c, archivo_id: a ? a.drive_id : '', op_id: item.id + '#' + i });
      }).then(function (r) {
        if (a) { a.hecho = true; a.codigo = r.captura.codigo; a.blob = null; } else item.codigo = r.captura.codigo;
        return cola.poner(item);
      });
    });
  });
  return pasos.then(function () {
    var codigos = item.archivos.length ? item.archivos.map(function (a) { return a.codigo; }) : [item.codigo];
    return cola.poner({ id: item.id, usuario: item.usuario || '', creado: item.creado, tipo: item.tipo, titulo: item.titulo || (item.archivos[0] && item.archivos[0].nombre) || (item.texto || item.url || '').slice(0, 60), codigos: codigos }, 'hechas');
  }).then(function () { return cola.sacar(item.id); }).then(function () { toast('Captura guardada en EG Registro.'); });
}

/* ───── pantalla ───── */
var ICON = {
  nota: '<svg viewBox="0 0 24 24"><path d="M4 4h12l4 4v12H4z"/><path d="M8 12h8M8 16h6M8 8h4"/></svg>',
  foto: '<svg viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="4"/></svg>',
  audio: '<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  video: '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg>',
  archivo: '<svg viewBox="0 0 24 24"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/></svg>',
  enlace: '<svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1"/><path d="M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/></svg>'
};

function pintarEstado() {
  $('estado').textContent = !llave() ? 'sin sesión' : !navigator.onLine ? 'sin señal · se sube después' : subiendo ? 'subiendo…' : 'en línea';
}

function pintar() {
  pintarEstado();
  if (!llave()) {
    $('main').innerHTML = '<div class="aviso"><b>Primero inicia sesión en EG Registro en este celular.</b><br>EG Captura usa la misma sesión. Ábrelo, entra con tu cuenta Google y vuelve aquí.</div>' +
      '<div class="row"><a class="btn go" href="../">Abrir EG Registro</a><button class="btn ghost" data-a="recargar">Ya inicié sesión</button></div>';
    return;
  }
  var uv = usuarioGuardado();
  if (uv && !esAdmin(uv)) {
    $('main').innerHTML = '<div class="aviso"><b>EG Captura es solo para administración.</b><br>Tu cuenta (' + esc(uv.nombre || '') + ') no puede usarla.</div>';
    return;
  }
  var tiene = F.archivos.length || F.texto || F.url;
  var h = '<div class="grid">' +
    '<button class="tile" data-a="nota">' + ICON.nota + 'Nota</button>' +
    '<button class="tile" data-a="foto">' + ICON.foto + 'Foto</button>' +
    '<button class="tile' + (grabador ? ' rec' : '') + '" data-a="audio">' + ICON.audio + (grabador ? 'Detener' : 'Audio') + '</button>' +
    '<button class="tile" data-a="video">' + ICON.video + 'Video</button>' +
    '<button class="tile" data-a="archivo">' + ICON.archivo + 'Archivo</button>' +
    '<button class="tile" data-a="enlace">' + ICON.enlace + 'Enlace</button></div>';
  h += '<div class="card"><label for="cTitulo">Título (opcional: cliente, patente, trabajo)</label><input type="text" id="cTitulo" value="' + esc(F.titulo || '') + '" placeholder="Ej. KFDG29 frenos">' +
    '<label for="cTexto">Nota</label><textarea id="cTexto" placeholder="Lo que quieras dejar anotado">' + esc(F.texto || '') + '</textarea>' +
    (F.mostrarUrl || F.url ? '<label for="cUrl">Enlace</label><input type="url" id="cUrl" value="' + esc(F.url || '') + '" placeholder="https://">' : '') +
    formDestino() +
    (F.archivos.length ? '<ul class="files">' + F.archivos.map(function (a, i) { return '<li><span>' + esc(a.nombre) + ' · ' + mb(a.blob.size) + '</span><button data-a="quitar" data-i="' + i + '">Quitar</button></li>'; }).join('') + '</ul>' : '') +
    '<div class="row"><button class="btn go" data-a="guardar"' + (guardando ? ' disabled' : '') + '>' + (guardando ? 'Guardando…' : 'Guardar captura') + '</button>' + (tiene ? '<button class="btn ghost" data-a="limpiar">Limpiar</button>' : '') + '</div></div>';
  h += '<div id="listas"></div>';
  $('main').innerHTML = h;
  pintarListas();
}

/* 1.13: para qué es (Taller, Cliente, Personal = cuentas con mamá) y montos. Todo opcional. */
var DESTINOS = ['Taller', 'Cliente', 'Personal', 'Por definir'];
function clientesGuardados() {
  var u = usuarioGuardado(); if (!esAdmin(u)) return [];
  try { var x = JSON.parse(localStorage.getItem('eg_captura_clientes') || '{}'); return x && x.usuario === u.id && Array.isArray(x.lista) ? x.lista : []; } catch (e) { return []; }
}
function cargarClientes() {
  if (!navigator.onLine || !llave()) return;
  api('listar', { tabla: 'CLIENTES' }).then(function (l) {
    var c = l.filter(function (x) { return x.estado !== 'Inactivo'; }).map(function (x) { return { id: x.id, nombre: x.nombre, codigo: x.codigo }; }).sort(function (a, b) { return a.nombre < b.nombre ? -1 : 1; });
    var u = usuarioGuardado();
    try { if (u) localStorage.setItem('eg_captura_clientes', JSON.stringify({ usuario: u.id, lista: c })); } catch (e) {}
    if (F.destino === 'Cliente') pintar();
  }).catch(function () {});
}
function montoInput(id, label, v) { return '<div><label for="' + id + '">' + label + '</label><input type="text" inputmode="numeric" id="' + id + '" value="' + esc(v == null ? '' : v) + '" placeholder="$"></div>'; }
function formDestino() {
  var h = '<label>¿Para qué es?</label><div class="seg">' + DESTINOS.map(function (d) { return '<button type="button" data-a="destino" data-v="' + d + '" class="' + (F.destino === d ? 'on' : '') + '">' + (d === 'Personal' ? 'Personal (mamá)' : d) + '</button>'; }).join('') + '</div>';
  if (F.destino === 'Cliente') {
    var cs = clientesGuardados();
    h += '<label for="cCliente">Cliente</label><select id="cCliente"><option value="">Otro / no sé (lo dice la nota)</option>' + cs.map(function (c) { return '<option value="' + esc(c.id) + '"' + (F.cliente_id === c.id ? ' selected' : '') + '>' + esc(c.nombre) + '</option>'; }).join('') + '</select>';
    h += '<div class="dos">' + montoInput('cMonto', 'Monto', F.monto) + '<div><label for="cMontoTipo">Ese monto es</label><select id="cMontoTipo">' + ['', 'A cobrar', 'Costo real', 'Por definir'].map(function (x) { return '<option value="' + x + '"' + (F.monto_tipo === x ? ' selected' : '') + '>' + (x || '—') + '</option>'; }).join('') + '</select></div></div>';
  } else if (F.destino === 'Taller') {
    h += montoInput('cMonto', 'Monto total (gasto del taller)', F.monto);
  } else if (F.destino === 'Personal') {
    h += '<label>¿Quién pagó? <span style="font-size:13px">(desde la cuenta de mamá = Mamá)</span></label><div class="seg">' + ['Yo', 'Mamá'].map(function (x) { return '<button type="button" data-a="pago" data-v="' + x + '" class="' + (F.pago_por === x ? 'on' : '') + '">' + x + '</button>'; }).join('') + '</div>';
    h += '<div class="dos">' + montoInput('cMio', 'Lo mío', F.monto_mio) + montoInput('cMama', 'Lo de mamá', F.monto_mama) + '</div><div class="s" style="font-size:13px">Escribe las dos partes (0 si no tiene).</div>';
  }
  return h;
}
// 1.14 (Q-18): pesos enteros: 15000, 15.000 o $15.000. Cualquier otra cosa (signo, decimales, letras) es un error, no otro monto.
function numero(v) {
  var s = String(v == null ? '' : v).trim().replace(/^\$\s*/, '');
  if (!s) return '';
  if (/^\d+$/.test(s) || /^\d{1,3}(\.\d{3})+$/.test(s)) return Number(s.replace(/\./g, ''));
  return null;
}

function pintarListas() {
  // 1.16 (R-3) / 1.17 (R2-2): solo lo tuyo; si la cuenta cambió mientras se leía el celular, no se pinta (viene otro pintado).
  var u = usuarioGuardado();
  var mio = function (it) { return !!u && esAdmin(u) && it.usuario === u.id; };
  Promise.all([cola.todos(), cola.todos('hechas')]).then(function (r) {
    if (!mismoUsuario(u, usuarioGuardado())) return;
    var pend = r[0].filter(mio).sort(function (a, b) { return a.creado < b.creado ? -1 : 1; });
    var hechas = r[1].filter(mio).sort(function (a, b) { return a.creado < b.creado ? 1 : -1; }).slice(0, 15);
    var h = '<h2>Por subir (' + pend.length + ')</h2>';
    h += pend.length ? '<div class="list">' + pend.map(function (it) {
      return '<div class="it" id="it-' + it.id + '"><b>' + esc(it.titulo || it.tipo) + '</b><span class="chip">' + esc(it.tipo) + '</span>' + (it.error ? '<span class="chip err">reintenta</span>' : '') +
        '<div class="s">' + fechaCorta(it.creado) + (it.archivos.length ? ' · ' + it.archivos.length + ' archivo(s) · ' + mb(it.archivos.reduce(function (s, a) { return s + (a.blob ? a.blob.size : 0); }, 0)) : '') + (it.error ? ' · ' + esc(it.error) : '') + '</div>' +
        it.archivos.map(function (a, i) { return '<div class="bar"><i id="bar-' + it.id + '-' + i + '" style="width:' + Math.round((a.hecho ? 1 : (a.avance || 0)) * 100) + '%"></i></div>'; }).join('') + '</div>';
    }).join('') + '</div>' + '<div class="row"><button class="btn ghost" data-a="subir">Subir ahora</button></div>' : '<div class="empty">Nada pendiente.</div>';
    h += '<h2>Guardadas en este celular</h2>' + (hechas.length ? '<div class="list">' + hechas.map(function (x) {
      return '<div class="it"><b>' + esc(x.titulo || x.tipo) + '</b><span class="chip ok">' + esc((x.codigos || []).join(', ')) + '</span><div class="s">' + fechaCorta(x.creado) + '</div></div>';
    }).join('') + '</div>' : '<div class="empty">Todavía no hay capturas.</div>');
    var l = $('listas'); if (l) l.innerHTML = h;
  });
}
function pintarAvance(id, i, f) { var b = $('bar-' + id + '-' + i); if (b) b.style.width = Math.round(f * 100) + '%'; }

function leerForm() {
  if ($('cTitulo')) F.titulo = $('cTitulo').value.trim(); if ($('cTexto')) F.texto = $('cTexto').value.trim(); if ($('cUrl')) F.url = $('cUrl').value.trim();
  if ($('cCliente')) F.cliente_id = $('cCliente').value; if ($('cMonto')) F.monto = numero($('cMonto').value); if ($('cMontoTipo')) F.monto_tipo = $('cMontoTipo').value;
  if ($('cMio')) F.monto_mio = numero($('cMio').value); if ($('cMama')) F.monto_mama = numero($('cMama').value);
}
function agregarArchivos(lista, origen) {
  Array.prototype.forEach.call(lista || [], function (f) {
    if (f.size > MAX_BYTES) { toast(f.name + ' pesa más de 300 MB: no se puede subir.', true); return; }
    F.archivos.push({ nombre: f.name || ('captura-' + Date.now()), mime: f.type || 'application/octet-stream', blob: f });
  });
  if (origen) F.origen = origen;
  if (F.archivos.length && F.tipo === 'Nota') F.tipo = tipoDe(F.archivos[0].mime);
  pintar();
}

function guardar() {
  if (guardando) return; // 1.14 (Q-4): un doble toque no guarda dos veces
  leerForm();
  if (!F.archivos.length && !F.texto && !F.url) { toast('Escribe una nota, un enlace o adjunta un archivo.', true); return; }
  if ([F.monto, F.monto_mio, F.monto_mama].some(function (x) { return x === null; })) { toast('Monto no válido: usa solo pesos enteros (ej. 15000 o 15.000), sin signo ni decimales.', true); return; }
  if (F.destino === 'Personal' && !F.pago_por && (F.monto_mio !== '' || F.monto_mama !== '')) { toast('Indica quién pagó (Yo o Mamá).', true); return; }
  var tipo = F.archivos.length ? tipoDe(F.archivos[0].mime) : (F.url && !F.texto ? 'Enlace' : 'Nota');
  var u = usuarioGuardado();
  // El id del formulario se mantiene: si se repite, cola.poner reemplaza la misma entrada (y el servidor la reconoce por op_id).
  var item = { id: F.id, creado: new Date().toISOString(), fecha: new Date().toISOString(), tipo: tipo, origen: F.origen || 'App', titulo: F.titulo || '', texto: F.texto || '', url: F.url || '', archivos: F.archivos, extra: extraDestino(), usuario: u ? u.id : '' };
  var compartidos = F.compartidos || [];
  guardando = true; pintar();
  cola.poner(item).then(function () {
    // 1.14 (Q-3): lo compartido desde otra app se borra recién cuando ya quedó en la cola.
    return Promise.all(compartidos.map(function (id) { return cola.sacar(id, 'compartido'); }));
  }).then(function () {
    F = formNuevo();
    toast(navigator.onLine ? 'Guardada. Subiendo…' : 'Guardada en el celular. Se sube cuando haya señal.');
  }).catch(function (e) { toast('No se pudo guardar en el celular: ' + e.message, true); })
    .then(function () { guardando = false; pintar(); procesar(); });
}

/** Campos de destino que van al servidor (solo los que corresponden). */
function extraDestino() {
  var x = {}; if (!F.destino) return x;
  x.destino = F.destino;
  if (F.destino === 'Cliente') { if (F.cliente_id) x.cliente_id = F.cliente_id; if (F.monto !== '' && F.monto != null) x.monto = F.monto; if (F.monto_tipo) x.monto_tipo = F.monto_tipo; }
  if (F.destino === 'Taller' && F.monto !== '' && F.monto != null) x.monto = F.monto;
  if (F.destino === 'Personal') { if (F.pago_por) x.pago_por = F.pago_por; if (F.monto_mio !== '' && F.monto_mio != null) x.monto_mio = F.monto_mio; if (F.monto_mama !== '' && F.monto_mama != null) x.monto_mama = F.monto_mama; }
  return x;
}

function grabar() {
  if (grabador) { grabador.stop(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) { toast('Este navegador no graba audio. Usa la grabadora del celular y compártela a EG Captura.', true); return; }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
    trozosAudio = [];
    var tipo = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : (MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '');
    grabador = tipo ? new MediaRecorder(stream, { mimeType: tipo }) : new MediaRecorder(stream);
    grabador.ondataavailable = function (e) { if (e.data && e.data.size) trozosAudio.push(e.data); };
    grabador.onstop = function () {
      stream.getTracks().forEach(function (t) { t.stop(); });
      var mime = (grabador.mimeType || 'audio/webm').split(';')[0], ext = /mp4/.test(mime) ? 'm4a' : 'webm';
      var blob = new Blob(trozosAudio, { type: mime });
      grabador = null; leerForm();
      agregarArchivos([new File([blob], 'audio-' + new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-') + '.' + ext, { type: mime })]);
    };
    grabador.start(1000); leerForm(); pintar(); toast('Grabando… toca "Detener" para terminar.');
  }).catch(function () { toast('Sin permiso para el micrófono.', true); });
}

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-a]'); if (!el) return;
  var a = el.getAttribute('data-a');
  if (a !== 'quitar') leerForm();
  if (a === 'nota') { var t = $('cTexto'); if (t) t.focus(); }
  else if (a === 'foto') $('fFoto').click();
  else if (a === 'video') $('fVideo').click();
  else if (a === 'archivo') $('fArchivo').click();
  else if (a === 'audio') grabar();
  else if (a === 'enlace') { F.mostrarUrl = true; pintar(); if ($('cUrl')) $('cUrl').focus(); }
  else if (a === 'quitar') { leerForm(); F.archivos.splice(Number(el.getAttribute('data-i')), 1); pintar(); }
  else if (a === 'limpiar') { var cs = F.compartidos || []; F = formNuevo(); cs.forEach(function (id) { cola.sacar(id, 'compartido'); }); pintar(); }
  else if (a === 'guardar') guardar();
  else if (a === 'destino') { var v = el.getAttribute('data-v'); F.destino = F.destino === v ? '' : v; if (F.destino === 'Cliente' && !clientesGuardados().length) cargarClientes(); pintar(); }
  else if (a === 'pago') { F.pago_por = el.getAttribute('data-v'); pintar(); }
  else if (a === 'subir') procesar();
  else if (a === 'recargar') location.reload();
});
['fFoto', 'fVideo', 'fArchivo'].forEach(function (id) { $(id).addEventListener('change', function (e) { leerForm(); agregarArchivos(e.target.files); e.target.value = ''; }); });
window.addEventListener('online', function () { pintarEstado(); procesar(); });
window.addEventListener('offline', pintarEstado);
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') procesar(); });

/** Lo que llega desde "Compartir" de otra app (lo guarda el service worker): se carga al formulario para revisar y guardar. */
function cargarCompartido() {
  if (/compartido=/.test(location.search)) history.replaceState(null, '', location.pathname);
  // 1.14 (Q-3): se carga todo lo compartido que siga en el celular (aunque se haya cerrado la app) y se borra solo al guardar.
  // 1.17 (R2-2): lo compartido queda de la cuenta verificada que lo abre primero; otra cuenta no lo ve.
  var u = usuarioGuardado();
  if (!esAdmin(u)) return Promise.resolve();
  return cola.todos('compartido').then(function (l) {
    if (!mismoUsuario(u, usuarioGuardado())) return [];
    return Promise.all(l.filter(function (c) { return !c.usuario; }).map(function (c) { c.usuario = u.id; return cola.poner(c, 'compartido'); })).then(function () { return l; });
  }).then(function (l) {
    l = l.filter(function (c) { return c.usuario === u.id && F.compartidos.indexOf(c.id) < 0; });
    l.forEach(function (c) {
      F.titulo = F.titulo || c.titulo || ''; F.texto = [F.texto, c.texto].filter(Boolean).join('\n');
      if (c.url) { F.url = c.url; F.mostrarUrl = true; }
      (c.archivos || []).forEach(function (a) { F.archivos.push({ nombre: a.nombre, mime: a.mime, blob: a.blob }); });
      F.origen = 'Compartir';
      F.compartidos.push(c.id);
    });
    // Un enlace compartido llega a veces dentro del texto.
    if (!F.url && /^https?:\/\/\S+$/.test((F.texto || '').trim())) { F.url = F.texto.trim(); F.texto = ''; F.mostrarUrl = true; }
    if (l.length) toast('Revisa y toca "Guardar captura".');
  });
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
// 1.17 (R2-2): primero se sabe quién es (sin señal: el último verificado con esta sesión); después se adopta lo antiguo y se carga lo compartido.
pintar();
verificarUsuario().catch(function () { return usuarioGuardado(); }).then(function (u) { return adoptarSinDueno(u); })
  .then(function () { return cargarCompartido(); }).then(function () { pintar(); procesar(); cargarClientes(); }).catch(function () { pintar(); });
</script>
