        if (prev && row.estado !== prev.estado) fail_('VALOR_INVALIDO', 'El estado del presupuesto cambia con Publicar, Confirmar o Retirar.');
        if (prev && PRESUPUESTO_CERRADOS.indexOf(prev.estado) >= 0) {
          var cambia = Object.keys(colMap_('PRESUPUESTOS')).some(function (k) { return k !== 'notas' && !CONTRACT.technicalColumns.some(function (t) { return t.k === k; }) && String(prev[k]) !== String(row[k]); });
          if (cambia) fail_('PRESUPUESTO_CERRADO', 'El presupuesto ' + prev.codigo + ' está ' + prev.estado + ': solo se pueden cambiar sus notas.');
        }
      }
      var tr = mustGet_(ctx, 'TRABAJOS', row.trabajo_id, 'Trabajo');
      // P-14: el cliente y el vehículo son los del trabajo (no se aceptan vínculos contradictorios por ninguna vía).
      if (!isEmpty_(row.cliente_id) && row.cliente_id !== tr.cliente_id) fail_('VALOR_INVALIDO', 'El cliente del presupuesto debe ser el del trabajo ' + tr.codigo + '.');
      if (!isEmpty_(row.equipo_id) && !isEmpty_(tr.equipo_id) && row.equipo_id !== tr.equipo_id && !(prev && prev.equipo_id === row.equipo_id && ctx._presupuestoAccion === true)) fail_('VALOR_INVALIDO', 'El vehículo del presupuesto debe ser el del trabajo ' + tr.codigo + '.');
      row.cliente_id = tr.cliente_id;
      if (!isEmpty_(tr.equipo_id)) row.equipo_id = tr.equipo_id;
      if (!isEmpty_(row.validez_dias) && !(Number(row.validez_dias) >= 1 && Number(row.validez_dias) <= 365)) fail_('VALOR_INVALIDO', 'La validez debe estar entre 1 y 365 días.');
      row.cobro = cobroCodigos_(ctx, row.cobro);
      if (prev && prev.estado === 'Publicado' && !accion) w.push({ code: 'PUBLICADO', message: 'El cliente sigue viendo lo publicado hasta que vuelvas a publicar.' });
    }
  },

  PRESUPUESTO_ITEMS: {
    before: function (ctx, row, prev, w) {
      var ps = mustGet_(ctx, 'PRESUPUESTOS', row.presupuesto_id, 'Presupuesto');
      if (prev && prev.presupuesto_id !== row.presupuesto_id) fail_('VALOR_INVALIDO', 'Un ítem no se cambia de presupuesto.');
      if (PRESUPUESTO_CERRADOS.indexOf(ps.estado) >= 0 && ctx._presupuestoAccion !== true) fail_('PRESUPUESTO_CERRADO', 'El presupuesto ' + ps.codigo + ' está ' + ps.estado + ': sus ítems ya no se cambian.');
      row.cliente_id = ps.cliente_id;
      if (isEmpty_(row.cantidad)) row.cantidad = 1;
      if (!(Number(row.cantidad) > 0)) fail_('VALOR_INVALIDO', 'La cantidad debe ser mayor que cero.');
      if (!isEmpty_(row.catalogo_id) && isEmpty_(row.costo_unitario)) {
        var u = activeRows_(ctx, 'PRECIOS').filter(function (x) { return x.catalogo_id === row.catalogo_id; }).sort(precioOrden_)[0];
        if (u) {
          row.costo_unitario = u.costo_neto;
          var dias = diasEntre_(u.fecha, today_(ctx));
          w.push({ code: 'COSTO_CATALOGO', message: 'Costo tomado del catálogo: $' + u.costo_neto + ' neto (' + u.fecha + ').' });
          if (dias !== null && dias > vigenciaDias_(ctx)) w.push({ code: 'PRECIO_ANTIGUO', message: 'El precio del catálogo tiene ' + dias + ' días: confírmalo con el proveedor.' });
        }
      }
      if (!isEmpty_(row.margen_pct) && !(Number(row.margen_pct) >= 0 && Number(row.margen_pct) < 100)) fail_('VALOR_INVALIDO', 'El margen debe estar entre 0 y 99 %.');
      // P-11: si cambia el costo o el margen y el precio no se tocó, se recalcula cuando el precio anterior era el calculado.
      // Si el precio anterior se había escrito a mano, se conserva y se avisa.
      if (prev && !isEmpty_(row.precio_unitario) && String(row.precio_unitario) === String(prev.precio_unitario) &&
          (String(row.costo_unitario) !== String(prev.costo_unitario) || String(row.margen_pct) !== String(prev.margen_pct))) {
        var eraCalc = !isEmpty_(prev.costo_unitario) && !isEmpty_(prev.margen_pct) && Number(prev.margen_pct) < 100 &&
          Number(prev.precio_unitario) === precioCliente_(prev.costo_unitario, prev.margen_pct, ivaPct_(ctx)).neto;
        if (eraCalc) row.precio_unitario = '';
        else w.push({ code: 'PRECIO_MANUAL', message: 'Ítem "' + row.descripcion + '": cambió el costo o el margen, pero el precio ($' + row.precio_unitario + ') se había escrito a mano y se mantiene. Para recalcularlo, deja el precio vacío.' });
      }
      if (isEmpty_(row.precio_unitario)) {
        if (isEmpty_(row.costo_unitario) || isEmpty_(row.margen_pct)) fail_('REQUERIDO', 'Ítem "' + row.descripcion + '": indica el precio al cliente, o el costo y el margen.');
        row.precio_unitario = precioCliente_(row.costo_unitario, row.margen_pct, ivaPct_(ctx)).neto;
      }
      if (Number(row.precio_unitario) < 0) fail_('VALOR_INVALIDO', 'El precio no puede ser negativo.');
      if (!isEmpty_(row.costo_unitario) && Number(row.precio_unitario) < Number(row.costo_unitario)) w.push({ code: 'BAJO_COSTO', message: 'Ítem "' + row.descripcion + '": el precio ($' + row.precio_unitario + ') es menor que el costo ($' + row.costo_unitario + ').' });
      row.total = Math.round(Number(row.cantidad) * Number(row.precio_unitario));
    },
    anular: function (ctx, row) {
      var ps = getRow_(ctx, 'PRESUPUESTOS', row.presupuesto_id);
      if (ps && PRESUPUESTO_CERRADOS.indexOf(ps.estado) >= 0 && ctx._presupuestoAccion !== true) fail_('PRESUPUESTO_CERRADO', 'El presupuesto ' + ps.codigo + ' está ' + ps.estado + ': sus ítems ya no se cambian.');
    }
  },

  LISTAS: {
    before: function (ctx, row) {
      if (activeRows_(ctx, 'LISTAS').some(function (l) { return l.id !== row.id && l.lista === row.lista && l.valor === row.valor; })) fail_('DUPLICADO', 'Ese valor ya existe en la lista ' + row.lista + '.');
    }
  }
};

/** ¿El artículo tiene movimientos vigentes o recepciones confirmadas (vía pedidos)? */
function articuloConHistoria_(ctx, itemId) {
  if (activeRows_(ctx, 'MOV_INVENTARIO').some(function (m) { return m.item_id === itemId; })) return true;
  var pedidos = {};
  activeRows_(ctx, 'PEDIDOS').forEach(function (p) { if (p.item_id === itemId) pedidos[p.id] = true; });
  return activeRows_(ctx, 'RECEPCIONES').some(function (r) { return pedidos[r.pedido_id] && r.estado === 'Confirmada'; });
}

/** Un movimiento ligado a una recepción tiene que calzar con ella. Devuelve el problema o null. */
function movRecepcionError_(ctx, mov) {
  var rc = getRow_(ctx, 'RECEPCIONES', mov.recepcion_id);
  if (!rc) return 'la recepción ligada no existe';
  if (rc.anulado === true) return 'la recepción ' + rc.codigo + ' está anulada';
  if (rc.estado !== 'Confirmada') return 'la recepción ' + rc.codigo + ' no está confirmada';
  if (mov.tipo !== 'Entrada') return 'un movimiento de recepción debe ser Entrada';
  if (Number(mov.cantidad) !== Number(rc.cantidad)) return 'la cantidad (' + mov.cantidad + ') no calza con la recepción ' + rc.codigo + ' (' + rc.cantidad + ')';
  if (mov.unidad !== rc.unidad) return 'la unidad (' + mov.unidad + ') no calza con la recepción ' + rc.codigo + ' (' + rc.unidad + ')';
  var ped = getRow_(ctx, 'PEDIDOS', rc.pedido_id);
  if (ped && !isEmpty_(ped.item_id) && ped.item_id !== mov.item_id) return 'el artículo no es el del pedido de la recepción ' + rc.codigo;
  return null;
}

/* ───────────────────────── sesiones de tiempo ───────────────────────── */

function openSessionOf_(ctx, usuarioId) {
  return activeRows_(ctx, 'SESIONES').filter(function (s) { return s.usuario_id === usuarioId && s.estado === 'Abierta'; })[0] || null;
}

function sesionIniciar_(ctx, p) {
  var dup = findByOp_(ctx, 'SESIONES', p.op_id);
  if (dup) { checkSameOp_(ctx, dup, p.op_id); return { data: project_(ctx, 'SESIONES', dup), warnings: [], duplicate: true }; }
  var uid = ctx.user.id;
  if (!isEmpty_(p.usuario_id) && p.usuario_id !== ctx.user.id) {
    requireAdmin_(ctx);
    uid = p.usuario_id;
  }
  var trabajo = mustGet_(ctx, 'TRABAJOS', p.trabajo_id, 'Trabajo');
  if (trabajo.anulado === true || trabajo.estado_comercial === 'Anulado') fail_('ANULADO', 'El trabajo está anulado.');
  if (trabajo.estado_ejecucion === 'Ejecutado') fail_('TRABAJO_CERRADO', 'El trabajo ya está ejecutado. Para seguir, crea un trabajo nuevo o reábrelo.');
  if (isTecnico_(ctx) && !assigned_(ctx).trabajos[trabajo.id]) fail_('NO_PERMITIDO', 'Este trabajo no está asignado a ti.');
  var warnings = [];
  var abierta = openSessionOf_(ctx, uid);
  if (abierta) {
    if (abierta.trabajo_id === trabajo.id && !p.cerrar_abierta) fail_('SESION_ABIERTA', 'Ya tienes una sesión abierta en este trabajo.', { sesion: project_(ctx, 'SESIONES', abierta) });
    if (!p.cerrar_abierta) fail_('SESION_ABIERTA', 'Tienes una sesión abierta en otro trabajo. Páusala para cambiar.', { sesion: project_(ctx, 'SESIONES', abierta) });
    var cerrada = cerrarSesionInterna_(ctx, abierta, p.motivo_cambio || 'Otro trabajo', null);
    warnings = warnings.concat(cerrada.warnings);
  }
  var at = now_(ctx);
  var res = insertRow_(ctx, 'SESIONES', {
    cliente_id: trabajo.cliente_id, trabajo_id: trabajo.id, usuario_id: uid, registrado_por: ctx.user.id,
    actividad: p.actividad || '', modalidad: 'En vivo', dispositivo: p.dispositivo || '', fecha: localDate_(at),
    inicio: at, estado: 'Abierta', precision: 'Exacta'
  }, { system: true, opId: p.op_id });
  if (trabajo.estado_ejecucion === 'Pendiente') {
    var ch = { estado_ejecucion: 'En curso' };
    if (isEmpty_(trabajo.fecha_inicio)) ch.fecha_inicio = at;
    sysUpdate_(ctx, 'TRABAJOS', trabajo.id, ch, 'Inicio de sesión');
  }
  return { data: project_(ctx, 'SESIONES', res.row), warnings: warnings.concat(res.warnings) };
}

function cerrarSesionInterna_(ctx, s, motivo, opId, extra) {
  var ch = { estado: 'Cerrada', fin: now_(ctx) };
  if (!isEmpty_(motivo)) ch.motivo_pausa = motivo;
  Object.keys(extra || {}).forEach(function (k) { if (!isEmpty_(extra[k])) ch[k] = extra[k]; });
  return updateRow_(ctx, 'SESIONES', s.id, null, ch, { system: true, skipVersion: true, opId: opId, allowCalc: true, noRect: true });
}

function sesionCerrar_(ctx, p, conMotivo) {
  var s = mustGet_(ctx, 'SESIONES', p.sesion_id, 'Sesión');
  if (s.usuario_id !== ctx.user.id) requireAdmin_(ctx);
  if (p.op_id && s.ultima_op === p.op_id) { checkSameOp_(ctx, s, p.op_id); return { data: project_(ctx, 'SESIONES', s), warnings: [], duplicate: true }; }
  if (s.estado !== 'Abierta') fail_('YA_CERRADA', 'La sesión ' + s.codigo + ' ya estaba cerrada.');
  if (conMotivo && isEmpty_(p.motivo_pausa)) fail_('REQUERIDO', 'Indica el motivo de la pausa.');
  if (!isEmpty_(p.motivo_pausa)) normalizeValue_(ctx, 'SESIONES', colMap_('SESIONES').motivo_pausa, p.motivo_pausa, undefined);
  var res = cerrarSesionInterna_(ctx, s, p.motivo_pausa, p.op_id, { notas: p.notas, actividad: p.actividad });
  return { data: project_(ctx, 'SESIONES', res.row), warnings: res.warnings };
}

/** Sesión cargada después (solo administración en esta versión). */
function sesionPosterior_(ctx, p) {
  requireAdmin_(ctx);
  var trabajo = mustGet_(ctx, 'TRABAJOS', p.trabajo_id, 'Trabajo');
  var d = {
    cliente_id: trabajo.cliente_id, trabajo_id: trabajo.id, usuario_id: p.usuario_id || ctx.user.id,
    registrado_por: ctx.user.id === 'sistema' ? (p.usuario_id || '') : ctx.user.id,
    actividad: p.actividad || '', modalidad: 'Posterior', dispositivo: p.dispositivo || '',
    inicio: p.inicio || '', fin: p.fin || '', duracion_min: isEmpty_(p.inicio) ? p.duracion_min : '',
    fecha: p.fecha || '', precision: p.precision || 'Informada', estado: 'Cerrada', notas: p.notas || ''
  };
  var res = insertRow_(ctx, 'SESIONES', d, { system: true, opId: p.op_id });
  return { data: res.row, warnings: res.warnings };
}

/** Crea el cobro de mano de obra a partir de sesiones cerradas, sin cobrar dos veces. */
function conceptoDesdeSesiones_(ctx, p) {
  requireAdmin_(ctx);
  var trabajo = mustGet_(ctx, 'TRABAJOS', p.trabajo_id, 'Trabajo');
  var ids = p.sesion_ids || [];
  if (!ids.length) fail_('REQUERIDO', 'Elige las sesiones a cobrar.');
  var vistas = {};
  ids.forEach(function (id) { if (vistas[id]) fail_('DUPLICADO', 'Una sesión está repetida en la selección: cada sesión se cobra una sola vez.'); vistas[id] = true; });
  var existente = findByOp_(ctx, 'CONCEPTOS', p.op_id);
  if (existente) checkSameOp_(ctx, existente, p.op_id);
  var sesiones = ids.map(function (id) { return mustGet_(ctx, 'SESIONES', id, 'Sesión'); });
  var warnings = [];
  sesiones.forEach(function (s) {
    if (s.trabajo_id !== trabajo.id) fail_('VALOR_INVALIDO', s.codigo + ' es de otro trabajo.');
    if (s.estado !== 'Cerrada' || s.anulado === true) fail_('VALOR_INVALIDO', s.codigo + ' no está cerrada.');
    if (!isEmpty_(s.concepto_id) && !(existente && s.concepto_id === existente.id)) fail_('DOBLE_COBRO', s.codigo + ' ya respalda otro cobro.');
    if (isEmpty_(s.min_facturables) && !p.usar_trabajados) fail_('REQUERIDO', s.codigo + ' no tiene minutos facturables. Defínelos o usa los trabajados.');
    if (isEmpty_(s.tarifa_valor)) fail_('SIN_TARIFA', s.codigo + ' no tiene tarifa vigente.');
  });
  if (!existente) {
    var manual = activeRows_(ctx, 'CONCEPTOS').filter(function (c) {
      return c.trabajo_id === trabajo.id && c.tipo === 'Mano de obra' && !activeRows_(ctx, 'SESIONES').some(function (s) { return s.concepto_id === c.id; });
    });
    if (manual.length) warnings.push({ code: 'POSIBLE_DOBLE_COBRO', message: 'El trabajo ya tiene mano de obra registrada a mano (' + manual.map(function (c) { return c.codigo; }).join(', ') + '). Revisa que no se cobre dos veces.' });
  }
  var total = 0;
  sesiones.forEach(function (s) {
    var min = isEmpty_(s.min_facturables) ? Number(s.duracion_min) || 0 : Number(s.min_facturables);
    total += min * Number(s.tarifa_valor) / 60;
  });
  var con = existente || insertRow_(ctx, 'CONCEPTOS', {
    cliente_id: trabajo.cliente_id, trabajo_id: trabajo.id, equipo_id: trabajo.equipo_id, tipo: 'Mano de obra',
    descripcion: p.descripcion || ('Mano de obra ' + trabajo.codigo), monto_cliente: Math.round(total),
    aportante: 'Taller', etapa: 'Cotizado', fuente: 'Sesiones ' + sesiones.map(function (s) { return s.codigo; }).join(', ')
  }, { system: true, opId: p.op_id }).row;
  sesiones.forEach(function (s) {
    if (s.concepto_id === con.id) return;
    var ch = { concepto_id: con.id };
    if (isEmpty_(s.min_facturables)) ch.min_facturables = s.duracion_min;
    sysUpdate_(ctx, 'SESIONES', s.id, ch, 'Ligada a cobro ' + con.codigo);
  });
  return { data: con, warnings: warnings };
}

function aporteRevisar_(ctx, p) {
  requireAdmin_(ctx);
  if (['DETALLE', 'PENDIENTES'].indexOf(p.tabla) < 0) fail_('VALOR_INVALIDO', 'Solo se revisan aportes de DETALLE o PENDIENTES.');
  if (['Aprobado', 'Rechazado'].indexOf(p.decision) < 0) fail_('VALOR_INVALIDO', 'Decisión: Aprobado o Rechazado.');
  var r = mustGet_(ctx, p.tabla, p.id);
  if (r.estado_aporte !== 'Borrador') fail_('VALOR_INVALIDO', 'El aporte ya fue revisado.');
  var res = updateRow_(ctx, p.tabla, p.id, p.version, { estado_aporte: p.decision, revisado_por: ctx.user.id === 'sistema' ? '' : ctx.user.id }, { opId: p.op_id, motivo: p.motivo || '', noRect: true });
  return { data: res.row, warnings: res.warnings };
}

/**
 * Revisar en lote (1.9.1): aprueba o rechaza varios aportes en una sola solicitud.
 * items: [{ tabla, id, version }]. Lo que ya fue revisado (por otra persona) o cambió de versión se salta y se informa.
 */
function aporteRevisarLote_(ctx, p) {
  requireAdmin_(ctx);
  if (['Aprobado', 'Rechazado'].indexOf(p.decision) < 0) fail_('VALOR_INVALIDO', 'Decisión: Aprobado o Rechazado.');
  var items = Array.isArray(p.items) ? p.items : [];
  if (!items.length) fail_('REQUERIDO', 'Selecciona al menos un aporte.');
  if (items.length > 200) fail_('VALOR_INVALIDO', 'Máximo 200 aportes por vez.');
  var hechos = [], saltados = [], warnings = [];
  items.forEach(function (it) {
    if (!it || ['DETALLE', 'PENDIENTES'].indexOf(it.tabla) < 0) fail_('VALOR_INVALIDO', 'Solo se revisan aportes de DETALLE o PENDIENTES.');
    var r = mustGet_(ctx, it.tabla, it.id);
    if (r.ultima_op === p.op_id) { hechos.push(r.codigo); return; }  // reintento de la misma solicitud
    if (r.anulado === true) { saltados.push({ codigo: r.codigo, motivo: 'anulado' }); return; }
    if (r.estado_aporte !== 'Borrador') { saltados.push({ codigo: r.codigo, motivo: 'ya revisado (' + r.estado_aporte + ')' }); return; }
    if (Number(it.version) !== Number(r.version)) { saltados.push({ codigo: r.codigo, motivo: 'cambió mientras lo revisabas' }); return; }
    var res = updateRow_(ctx, it.tabla, it.id, it.version, { estado_aporte: p.decision, revisado_por: ctx.user.id === 'sistema' ? '' : ctx.user.id }, { opId: p.op_id, motivo: p.motivo || '', noRect: true });
    hechos.push(r.codigo); warnings = warnings.concat(res.warnings || []);
  });
  if (saltados.length) warnings.push({ code: 'SALTADOS', message: saltados.length + ' aporte(s) no se cambiaron: ' + saltados.map(function (s) { return s.codigo + ' ' + s.motivo; }).join('; ') + '.' });
  return { data: { decision: p.decision, hechos: hechos, saltados: saltados }, warnings: warnings };
}

/** Aportes en borrador con su contexto (cliente, vehículo y trabajo) para la pestaña Revisar. */
function vistaAportesPorRevisar_(ctx, p) {
  requireAdmin_(ctx);
  var items = [];
  var nom = function (tabla, id) { return id ? getRow_(ctx, tabla, id) : null; };
  ['DETALLE', 'PENDIENTES'].forEach(function (tabla) {
    activeRows_(ctx, tabla).filter(function (r) { return r.estado_aporte === 'Borrador'; }).forEach(function (r) {
      var tr = nom('TRABAJOS', tabla === 'DETALLE' ? r.trabajo_id : r.trabajo_origen_id);
      var eq = nom('EQUIPOS', r.equipo_id || (tr && tr.equipo_id));
      var cl = nom('CLIENTES', r.cliente_id || (tr && tr.cliente_id) || (eq && eq.cliente_id));
      var cant = isEmpty_(r.cantidad) ? '' : r.cantidad + (r.unidad ? ' ' + r.unidad : '');
      items.push({
        tabla: tabla, id: r.id, version: r.version, codigo: r.codigo, creado_por: r.creado_por, creado_en: r.creado_en,
        texto: tabla === 'DETALLE' ? r.tipo + (r.componente ? ' · ' + r.componente : '') + ': ' + r.descripcion + (r.especificacion ? ' · ' + r.especificacion : '') + (cant ? ' · ' + cant : '') + (r.resultado ? ' · resultado: ' + r.resultado : '')
          : 'Pendiente: ' + r.descripcion + (r.objetivo ? ' (' + r.objetivo + ')' : ''),
        trabajo: tr ? tr.codigo + ' · ' + tr.descripcion : '', patente: eq ? eq.patente || '' : '', equipo: eq ? eq.nombre_corto : '', cliente: cl ? cl.nombre : ''
      });
    });
  });
  items.sort(function (a, b) { return String(a.creado_en) < String(b.creado_en) ? -1 : 1; });
  return { data: items, warnings: [] };
}

/* ───────────────────────── vistas calculadas ───────────────────────── */

function ultimaEjecucion_(trabajos) {
  var ej = trabajos.filter(function (t) { return t.estado_ejecucion === 'Ejecutado' && t.estado_comercial !== 'Anulado'; });
  ej.sort(function (a, b) {
    var fa = a.fecha_fin || a.fecha_inicio || '', fb = b.fecha_fin || b.fecha_inicio || '';
    return fa < fb ? 1 : fa > fb ? -1 : 0;
  });
  return ej[0] || null;
}

function pendienteVigente_(p) {
  return ESTADOS_PENDIENTE_CERRADOS.indexOf(p.estado) < 0 && p.estado_aporte !== 'Rechazado';
}

/** RESUMEN: primero el equipo con la ejecución más reciente; datos tomados de ese mismo trabajo. */
function vistaResumen_(ctx, p) {
  var equipos = rows_(ctx, 'EQUIPOS').filter(function (e) { return e.anulado !== true && rowVisible_(ctx, 'EQUIPOS', e) && (!p.cliente_id || e.cliente_id === p.cliente_id); });
  var trabajos = activeRows_(ctx, 'TRABAJOS').filter(function (t) { return rowVisible_(ctx, 'TRABAJOS', t); });
  var pendientes = activeRows_(ctx, 'PENDIENTES').filter(function (x) { return rowVisible_(ctx, 'PENDIENTES', x); });
  var clientes = {};
  if (!isTecnico_(ctx)) rows_(ctx, 'CLIENTES').forEach(function (c) { clientes[c.id] = c.nombre; });
  var out = equipos.map(function (e) {
    var te = trabajos.filter(function (t) { return t.equipo_id === e.id; });
    var u = ultimaEjecucion_(te);
    var enCurso = te.filter(function (t) { return t.estado_ejecucion === 'En curso'; }).length;
    var item = {
      equipo_id: e.id, codigo: e.codigo, nombre_corto: e.nombre_corto, marca: e.marca, modelo: e.modelo, patente: e.patente, unidad_uso: e.unidad_uso,
      ultimo_trabajo: u ? u.codigo : '', ultimo_trabajo_id: u ? u.id : '', ultima_fecha: u ? (u.fecha_fin || u.fecha_inicio) : '',
      ultima_descripcion: u ? String(u.descripcion || '').slice(0, 280) : '',
      km: u ? u.km : '', horas_equipo: u ? u.horas_equipo : '', proxima_km: u ? u.proxima_km : '', proxima_horas: u ? u.proxima_horas : '', proxima_fecha: u ? u.proxima_fecha : '',
      trabajos: te.length, en_curso: enCurso, pendientes_vigentes: pendientes.filter(function (x) { return x.equipo_id === e.id && pendienteVigente_(x); }).length
    };
    if (!isTecnico_(ctx)) { item.cliente_id = e.cliente_id; item.cliente = clientes[e.cliente_id] || ''; }
    return item;
  });
  out.sort(function (a, b) {
    if (a.ultima_fecha && !b.ultima_fecha) return -1;
    if (!a.ultima_fecha && b.ultima_fecha) return 1;
    if (a.ultima_fecha !== b.ultima_fecha) return a.ultima_fecha < b.ultima_fecha ? 1 : -1;
    return String(a.nombre_corto).localeCompare(String(b.nombre_corto));
  });
  return { data: out, warnings: [] };
}

/**
 * CLIENTES (solo administración): cada cliente con sus vehículos.
 * Intervención = trabajo En curso o Ejecutado (no anulado). Orden: primero lo que está en curso,
 * luego la intervención más reciente; dentro de cada cliente, sus vehículos con el mismo criterio.
 */
function vistaClientes_(ctx, p) {
  requireAdmin_(ctx);
  var trabajos = activeRows_(ctx, 'TRABAJOS').filter(function (t) { return t.estado_comercial !== 'Anulado'; });
  var pendientes = activeRows_(ctx, 'PENDIENTES');
  var equipos = rows_(ctx, 'EQUIPOS').filter(function (e) { return e.anulado !== true; });
  var contactos = activeRows_(ctx, 'CONTACTOS');
  function clave(x) { return x.en_curso ? '9999' : (x.ultima_fecha || ''); }
  function ordenar(a, b) {
    var ka = clave(a), kb = clave(b);
    if (ka !== kb) return ka < kb ? 1 : -1;
    return String(a.nombre || a.nombre_corto).localeCompare(String(b.nombre || b.nombre_corto));
  }
  var out = activeRows_(ctx, 'CLIENTES').map(function (c) {
    var vs = equipos.filter(function (e) { return e.cliente_id === c.id; }).map(function (e) {
      var te = trabajos.filter(function (t) { return t.equipo_id === e.id; });
      var curso = te.filter(function (t) { return t.estado_ejecucion === 'En curso'; });
      var ej = te.filter(function (t) { return t.estado_ejecucion === 'Ejecutado'; });
      var ult = null, uf = '';
      ej.concat(curso).forEach(function (t) {
        var f = t.estado_ejecucion === 'Ejecutado' ? (t.fecha_fin || t.fecha_inicio || '') : (t.fecha_inicio || '');
        if (!ult || f > uf) { ult = t; uf = f; }
      });
      return {
        equipo_id: e.id, codigo: e.codigo, nombre_corto: e.nombre_corto, patente: e.patente, activo: e.activo !== false,
        ultima_fecha: uf, ultima_descripcion: ult ? String(ult.descripcion || '').slice(0, 160) : '', ultimo_trabajo: ult ? ult.codigo : '',
        km: ult ? ult.km : '', en_curso: curso.length, trabajos: te.length,
        pendientes_vigentes: pendientes.filter(function (x) { return x.equipo_id === e.id && pendienteVigente_(x); }).length
      };
    }).sort(ordenar);
    var top = vs[0] || null;
    return {
      cliente_id: c.id, codigo: c.codigo, nombre: c.nombre, tipo: c.tipo, estado: c.estado,
      ultima_fecha: top ? top.ultima_fecha : '', en_curso: vs.reduce(function (s, v) { return s + v.en_curso; }, 0),
      pendientes_vigentes: vs.reduce(function (s, v) { return s + v.pendientes_vigentes; }, 0),
      contactos: contactos.filter(function (k) { return k.cliente_id === c.id; }).map(function (k) { return { nombre: k.nombre, tipo: k.tipo, telefono: k.telefono, correo: k.correo }; }),
      equipos: vs
    };
  });
  out.sort(ordenar);
  return { data: out, warnings: [] };
}

function horasDe_(sesiones) {
  var t = 0, f = 0;
  sesiones.forEach(function (s) { if (s.estado !== 'Anulada') { t += Number(s.duracion_min) || 0; f += Number(s.min_facturables) || 0; } });
  return { trabajados_min: t, facturables_min: f };
}

/** El técnico ve sus minutos trabajados, no los facturables (dato comercial). */
function horasVisibles_(ctx, h) {
  if (isTecnico_(ctx)) delete h.facturables_min;
  return h;
}

/** Ficha del vehículo: datos, referencias, trabajos con detalle y horas, pendientes vigentes e históricos. */
function vistaFicha_(ctx, p) {

/** Control económico por cliente: revisa cada pago, cada cobro y cada vínculo. */
function vistaControlEconomico_(ctx, p) {

  var conceptos = activeRows_(ctx, 'CONCEPTOS').filter(function (c) { return c.cliente_id === cid; });
  var pagos = activeRows_(ctx, 'PAGOS').filter(function (x) { return x.cliente_id === cid; });
  var imps = activeRows_(ctx, 'IMPUTACIONES').filter(function (x) { return x.cliente_id === cid; });

  var cById = {}, pById = {};
  conceptos.forEach(function (c) { cById[c.id] = c; });
  pagos.forEach(function (x) { pById[x.id] = x; });

  imps.forEach(function (i) {
    var c = getRow_(ctx, 'CONCEPTOS', i.concepto_id), pg = getRow_(ctx, 'PAGOS', i.pago_id);
    if (!c) errores.push(i.codigo + ': imputa a un cobro inexistente');

    else if (c.aportante !== 'Taller') errores.push(i.codigo + ': imputa a material del cliente (' + c.codigo + ')');
    else if (c.cliente_id !== cid) errores.push(i.codigo + ': el cobro es de otro cliente');
    if (!pg) errores.push(i.codigo + ': el pago no existe');
    else if (pg.anulado === true) errores.push(i.codigo + ': el pago está anulado (' + pg.codigo + ')');
    else if (pg.cliente_id !== cid) errores.push(i.codigo + ': el pago es de otro cliente');

    if (esVenta && monto === null) alertas.push(c.codigo + ': cobro confirmado sin monto');

  });
  var detPagos = pagos.map(function (x) {
    var imputado = sumBy_(imps.filter(function (i) { return i.pago_id === x.id; }), 'monto');
    if (imputado > Number(x.monto)) errores.push(x.codigo + ': imputado $' + imputado + ' supera el pago $' + x.monto);
    if (x.confirmado !== true) alertas.push(x.codigo + ': pago sin confirmar');
    return { pago_id: x.id, codigo: x.codigo, fecha: x.fecha, monto: Number(x.monto), confirmado: x.confirmado === true, imputado: imputado, sin_asignar: Number(x.monto) - imputado };
  });

  var pagado = sumBy_(detPagos.filter(function (x) { return x.confirmado; }), 'monto');

  }).filter(function (x) { return !x.confirmado || x.sin_asignar > 0; }).sort(function (a, b) { return a.fecha < b.fecha ? 1 : -1; });

  // 4. Pedidos sin recibir: "Pedido" con entrega esperada vencida o pedido hace más de N días; "Por pedir" con más de N días.
  var recs = activeRows_(ctx, 'RECEPCIONES').filter(function (r) { return r.estado === 'Confirmada'; });
  var pedidos = [];
  activeRows_(ctx, 'PEDIDOS').forEach(function (x) {
    if (x.estado === 'Cancelado') return;
    var recibido = sumBy_(recs.filter(function (r) { return r.pedido_id === x.id; }), 'cantidad');
    var hayRecepcion = recs.some(function (r) { return r.pedido_id === x.id; });
    if (isEmpty_(x.cantidad) ? hayRecepcion : recibido >= Number(x.cantidad)) return;
    var base = x.estado === 'Pedido' ? (x.fecha_pedido || localDate_(x.creado_en)) : localDate_(x.creado_en);
    var antig = diasEntre_(base, hoy);
    var vencido = x.estado === 'Pedido' && !isEmpty_(x.entrega_esperada) && diasEntre_(x.entrega_esperada, hoy) > 0;
    if (!vencido && !(antig !== null && antig > dias)) return;
    pedidos.push({ pedido_id: x.id, codigo: x.codigo, cliente_id: x.cliente_id, cliente: nombreCli(x.cliente_id), articulo: x.articulo, estado: x.estado, proveedor: x.proveedor || '', desde: base || '', dias: antig, entrega_esperada: x.entrega_esperada || '', vencido: vencido, recibido: recibido, cantidad: isEmpty_(x.cantidad) ? null : Number(x.cantidad) });
  });
  pedidos.sort(function (a, b) { return (b.dias || 0) - (a.dias || 0); });

  // 4b (1.8). Repuestos por devolver al proveedor, y repuestos ya usados sin confirmar si sirvieron.
  var porDevolver = [], sinConfirmar = [];
  activeRows_(ctx, 'PEDIDOS').forEach(function (x) {
    var eqId = pedidoEquipo_(ctx, x), e = equipos[eqId] || {};
    var item = { pedido_id: x.id, codigo: x.codigo, cliente_id: x.cliente_id, cliente: nombreCli(x.cliente_id), equipo_id: eqId, equipo: e.nombre_corto || '', patente: e.patente || '', articulo: x.articulo, proveedor: x.proveedor || '', resultado: x.resultado || 'Por confirmar' };
    if (x.devolucion === 'Por devolver') {
      var desde = localDate_(x.editado_en || x.creado_en);
      porDevolver.push(Object.assign(item, { desde: desde, dias: diasEntre_(desde, hoy) }));
      return;
    }
    if (x.estado !== 'Pedido' || !(isEmpty_(x.resultado) || x.resultado === 'Por confirmar')) return;
    var pedidoEl = x.fecha_pedido || localDate_(x.creado_en);
    var recibido = recs.some(function (r) { return r.pedido_id === x.id; });
    var usado = trabajos.some(function (t) { return t.equipo_id === eqId && eqId && t.estado_ejecucion === 'Ejecutado' && localDate_(t.fecha_fin || t.fecha_inicio || '') >= pedidoEl; });
    if (recibido || usado) sinConfirmar.push(Object.assign(item, { desde: pedidoEl, motivo: usado ? 'Trabajo del vehículo ejecutado' : 'Recibido' }));
  });
  porDevolver.sort(function (a, b) { return (b.dias || 0) - (a.dias || 0); });

  // 5. Saldos por cliente con el mismo cálculo del control económico (sin duplicar reglas).
  var saldos = [], total = 0, desconocido = false;
  activeRows_(ctx, 'CLIENTES').forEach(function (c) {
    var ce = vistaControlEconomico_(ctx, { cliente_id: c.id }).data, T = ce.totales;
    if (T.saldo_por_cobrar === null) desconocido = true; else total += T.saldo_por_cobrar;
    if (ce.estado !== 'OK' || (T.saldo_por_cobrar || 0) !== 0 || T.pago_sin_imputar > 0) {
      saldos.push({ cliente_id: c.id, cliente: c.nombre, estado: ce.estado, saldo_por_cobrar: T.saldo_por_cobrar, pago_sin_imputar: T.pago_sin_imputar, errores: ce.errores.length });
    }

  return { data: {
    hoy: hoy, dias: dias,
    trabajos_sin_cobro: sinCobro, sesiones_sin_cobro: sesiones, pagos_pendientes: pagos, pedidos_atrasados: pedidos, saldos: saldos,
    repuestos_por_devolver: porDevolver, repuestos_sin_confirmar: sinConfirmar,
    total_por_cobrar: desconocido ? null : total,
    total_acciones: sinCobro.length + sesiones.length + pagos.length + pedidos.length + porDevolver.length + sinConfirmar.length
  }, warnings: [] };
}

/* ───────── Historial para el cliente por enlace (A1, 1.6) ─────────
 * Lo publicado se arma con una lista CERRADA de campos (nunca la ficha completa): datos del vehículo y, por cada trabajo
 * ejecutado y marcado publicable, la fecha, el km, el tipo y el resumen para el cliente que Víctor revisó.
 * Sin nombre ni teléfono del cliente, sin montos, sin notas internas, sin trabajadores, sin fotos.
 * Se escribe en la planilla PUBLICO (otra cuenta, otro script); la BASE nunca queda al alcance de la página pública.
 * El código del enlace vive en la BASE (para reenviarlo); en PUBLICO solo su huella SHA-256.

function historialPublico_(ctx) {
  if (!ctx.publico) fail_('CONFIG', 'Falta la planilla PUBLICO (CONFIG.publico_planilla_id). Se configura al instalar los enlaces para clientes.');
  return ctx.publico;
}
function historialUrl_(ctx, codigo) {
  var base = String((ctx.config && ctx.config.publico_url_base) || '').trim();
  if (!base || !codigo) return '';
  return base.replace(/#.*$/, '') + '#k=' + codigo;
}

function historialContenido_(ctx, e) {
  var trabajos = activeRows_(ctx, 'TRABAJOS').filter(function (t) {
    return t.equipo_id === e.id && t.estado_comercial !== 'Anulado' && t.estado_ejecucion === 'Ejecutado' && t.publicable === true && !isEmpty_(t.resumen_cliente);
  }).map(function (t) {
    var o = { fecha: localDate_(t.fecha_fin || t.fecha_inicio || ''), km: isEmpty_(t.km) ? null : Number(t.km), horas: isEmpty_(t.horas_equipo) ? null : Number(t.horas_equipo), tipo: t.tipo_trabajo || '', resumen: String(t.resumen_cliente) };

  }).sort(function (a, b) { return a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : 0; });

    formato: HISTORIAL_FORMATO,

    taller: { nombre: 'Eisen Garage SpA', direccion: 'Gulutren 022, Peumo' },

}

function historialEquipo_(ctx, p) {
  requireAdmin_(ctx);
  return mustGet_(ctx, 'EQUIPOS', p.equipo_id, 'Equipo');
}

/** Vista previa: exactamente lo que verá el cliente, y el estado del enlace. No escribe nada. */
function historialVistaPrevia_(ctx, p) {

  var c = historialContenido_(ctx, e);

    autorizado: e.historial_publicable === true, autoriza: e.historial_autoriza || '', autoriza_fecha: e.historial_autoriza_fecha || '',

}

/** Publica (o actualiza) el historial y devuelve el enlace. Repetirlo con el mismo contenido no crea otra revisión. */
function historialPublicar_(ctx, p) {
  var e = historialEquipo_(ctx, p);
  if (e.historial_publicable !== true || isEmpty_(e.historial_autoriza) || isEmpty_(e.historial_autoriza_fecha)) {

  var codigo = e.historial_codigo;

  pub.enlacesActivos(e.id, HISTORIAL_TIPO).forEach(function (x) { if (x.huella !== huella) pub.enlaceRevocar(x.huella, ahora); });

  if (nueva) pub.publicacionAgregar({ recurso_id: e.id, tipo: HISTORIAL_TIPO, revision: revision, contenido: texto, huella_contenido: hc, publicado_en: ahora, publicado_por: ctx.user.correo });

/* ── Medios de cobro ── */

/** Lo que el cliente aceptaría (sin fechas ni estado): sirve para saber si la BASE cambió después de publicar. */
function presupuestoHuellaCliente_(c) {

}
/** Último contenido publicado del presupuesto (o null). */
function presupuestoPublicado_(ctx, ps) {

function presupuestoUno_(ctx, id) { requireAdmin_(ctx); return mustGet_(ctx, 'PRESUPUESTOS', id, 'Presupuesto'); }

/**
 * Sección "Pagos y saldo a favor" (1.9.1): cada pago con su código MV, a qué cobros se imputó y cuánto queda sin imputar,
 * más los cobros con saldo por cubrir. Así la IA imputa abonos futuros sin pedir el código. Sin datos bancarios
 * (cuenta, comprobante, remitente) ni costos.
 */
function contextoPagos_(ctx, c, L, celda, miles) {
  var pesos = function (n) { return '$' + miles(Math.round(Number(n) || 0)); };
  var pagos = activeRows_(ctx, 'PAGOS').filter(function (x) { return x.cliente_id === c.id && x.anulado !== true; })
    .sort(function (a, b) { return String(a.fecha) < String(b.fecha) ? 1 : String(a.fecha) > String(b.fecha) ? -1 : 0; });
  var imps = activeRows_(ctx, 'IMPUTACIONES').filter(function (x) { return x.cliente_id === c.id; });
  var cons = activeRows_(ctx, 'CONCEPTOS').filter(function (x) { return x.cliente_id === c.id && x.aportante === 'Taller' && x.etapa !== 'Anulado' && x.anulado !== true; });
  var conCod = {}; activeRows_(ctx, 'CONCEPTOS').forEach(function (x) { if (x.cliente_id === c.id) conCod[x.id] = x; });
  var trab = function (con) { var t = con && !isEmpty_(con.trabajo_id) ? getRow_(ctx, 'TRABAJOS', con.trabajo_id) : null; return t ? t.codigo : ''; };
  L.push(''); L.push('## Pagos y saldo a favor');
  if (!pagos.length) L.push('(sin pagos registrados)');
  else {
    L.push('| Código | Fecha | Monto | Medio | Confirmado | Imputado | Sin imputar | Imputado a |');
    L.push('|---|---|---|---|---|---|---|---|');
    pagos.forEach(function (x) {
      var mis = imps.filter(function (i) { return i.pago_id === x.id; });
      var imp = sumBy_(mis, 'monto');
      var a = mis.map(function (i) { var con = conCod[i.concepto_id]; return (con ? con.codigo + (trab(con) ? ' (' + trab(con) + ')' : '') : '?') + ' ' + pesos(i.monto); }).join('; ');
      L.push('| ' + x.codigo + ' | ' + (/^\d{4}-\d{2}-\d{2}$/.test(String(x.fecha)) ? String(x.fecha) : localDate_(x.fecha)) + ' | ' + pesos(x.monto) + ' | ' + celda(x.medio) + ' | ' + (x.confirmado === true ? 'sí' : 'NO') + ' | ' + pesos(imp) + ' | ' + pesos(Number(x.monto) - imp) + ' | ' + celda(a) + ' |');
    });
    var aFavor = sumBy_(pagos.filter(function (x) { return x.confirmado === true; }), 'monto') - sumBy_(imps, 'monto');
    var sinConf = pagos.filter(function (x) { return x.confirmado !== true; });
    L.push('');
    L.push('- Saldo a favor del cliente (pagos confirmados sin imputar): ' + pesos(aFavor));
    if (sinConf.length) L.push('- Pagos sin confirmar (no se pueden imputar hasta confirmarlos): ' + sinConf.map(function (x) { return x.codigo; }).join(', '));
  }
  var porCubrir = cons.map(function (con) {
    var imp = sumBy_(imps.filter(function (i) { return i.concepto_id === con.id; }), 'monto');
    return { con: con, imp: imp, falta: isEmpty_(con.monto_cliente) ? null : Number(con.monto_cliente) - imp };
  }).filter(function (x) { return x.falta === null || x.falta > 0; });
  L.push(''); L.push('### Cobros con saldo por cubrir');
  if (!porCubrir.length) L.push('(ninguno)');
  else porCubrir.forEach(function (x) {
    L.push('- ' + x.con.codigo + (trab(x.con) ? ' (' + trab(x.con) + ')' : '') + ' · ' + celda(x.con.descripcion, 100) + ' · ' + x.con.etapa + ' · ' +
      (x.falta === null ? 'SIN MONTO (no se puede imputar)' : 'monto ' + pesos(x.con.monto_cliente) + ' · imputado ' + pesos(x.imp) + ' · falta ' + pesos(x.falta)));
  });
  L.push('- Para imputar un saldo a favor, sin crear otro PAGO: { "ref": "mv", "tabla": "PAGOS", "buscar": { "codigo": "MV-…" } }, { "ref": "co", "tabla": "CONCEPTOS", "buscar": { "codigo": "CO-…" } } y { "tabla": "IMPUTACIONES", "datos": { "cliente_id": "@…", "pago_id": "@mv", "concepto_id": "@co", "monto": … } }. Monto ≤ sin imputar del pago y ≤ lo que falta del cobro.');
}

/**

/** Stock calculado: conteo inicial confirmado + entradas − salidas ± ajustes. Sin conteo confirmado = desconocido. */

    var neto = 0;
    m.forEach(function (x) {

/** Horas trabajadas y facturables por persona, actividad y trabajo. El técnico solo ve las suyas. */
function vistaHoras_(ctx, p) {
  var ses = activeRows_(ctx, 'SESIONES').filter(function (s) {
    if (s.estado === 'Anulada') return false;
    if (isTecnico_(ctx) && s.usuario_id !== ctx.user.id) return false;
    if (!isEmpty_(p.usuario_id) && s.usuario_id !== p.usuario_id) return false;
    if (!isEmpty_(p.desde) && s.fecha < p.desde) return false;
    if (!isEmpty_(p.hasta) && s.fecha > p.hasta) return false;
    return true;
  });
  var usuarios = {};
  rows_(ctx, 'USUARIOS').forEach(function (u) { usuarios[u.id] = u.nombre; });
  function agrupar(keyFn, labelFn) {
    var g = {};
    ses.forEach(function (s) {
      var k = keyFn(s);
      if (!g[k]) g[k] = { clave: k, nombre: labelFn(s), trabajados_min: 0, facturables_min: 0, sesiones: 0, abiertas: 0, sin_horario: 0 };
      if (s.estado === 'Abierta') g[k].abiertas++;
      g[k].trabajados_min += Number(s.duracion_min) || 0;
      g[k].facturables_min += Number(s.min_facturables) || 0;
      g[k].sesiones++;
      if (s.sin_horario === true) g[k].sin_horario++;
    });
    return Object.keys(g).map(function (k) { return horasVisibles_(ctx, g[k]); });
  }
  var data = {
    por_persona: agrupar(function (s) { return s.usuario_id; }, function (s) { return usuarios[s.usuario_id] || s.usuario_id; }),
    por_actividad: agrupar(function (s) { return s.usuario_id + '|' + (s.actividad || ''); }, function (s) { return (usuarios[s.usuario_id] || '') + ' · ' + (s.actividad || 'Sin actividad'); }),
    por_trabajo: agrupar(function (s) { return s.trabajo_id; }, function (s) { var t = getRow_(ctx, 'TRABAJOS', s.trabajo_id); return t ? t.codigo : s.trabajo_id; })
  };
  return { data: data, warnings: [] };
}

/** Pago a trabajadores: horas efectivas por persona y actividad × valor vigente en la fecha de ejecución. Solo quien ve PAGO. */
function vistaPagoTrabajadores_(ctx, p) {
  if (!canSeeTable_(ctx, 'VALORES_TRABAJADOR')) fail_('NO_PERMITIDO', 'Solo Víctor ve el pago a trabajadores.');
  var valores = activeRows_(ctx, 'VALORES_TRABAJADOR');
  var usuarios = {};
  rows_(ctx, 'USUARIOS').forEach(function (u) { usuarios[u.id] = u.nombre; });
  var out = {};
  activeRows_(ctx, 'SESIONES').forEach(function (s) {
    if (s.estado !== 'Cerrada') return;
    if (!isEmpty_(p.usuario_id) && s.usuario_id !== p.usuario_id) return;

    var val = (exact.length ? exact : c.filter(function (v) { return isEmpty_(v.actividad); })).sort(function (a, b) { return a.desde < b.desde ? 1 : -1; })[0];

/* ───────────────────────── revisión de integridad ───────────────────────── */

function revisarIntegridad_(ctx) {
