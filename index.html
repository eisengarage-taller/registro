      trabajos: te.length, en_curso: enCurso, pendientes_vigentes: pendientes.filter(function (x) { return x.equipo_id === e.id && pendienteVigente_(x); }).length
    };
    if (!isTecnico_(ctx)) { item.cliente_id = e.cliente_id; item.cliente = clientes[e.cliente_id] || ''; }
    return item;
  });
  out.sort(function (a, b) {
    if (a.ultima_fecha && !b.ultima_fecha) return -1;
    if (!a.ultima_fecha && b.ultima_fecha) return 1;
    if (a.ultima_fecha !== b.ultima_fecha) return a.ultima_fecha < b.ultima_fecha ? 1 : -1;
    return String(a.nombre_corto).localeCompare(String(b.nombre_corto));
  });
  return { data: out, warnings: [] };
}

/**
 * CLIENTES (solo administración): cada cliente con sus vehículos.
 * Intervención = trabajo En curso o Ejecutado (no anulado). Orden: primero lo que está en curso,
 * luego la intervención más reciente; dentro de cada cliente, sus vehículos con el mismo criterio.
 */
function vistaClientes_(ctx, p) {
  requireAdmin_(ctx);
  var trabajos = activeRows_(ctx, 'TRABAJOS').filter(function (t) { return t.estado_comercial !== 'Anulado'; });
  var pendientes = activeRows_(ctx, 'PENDIENTES');
  var equipos = rows_(ctx, 'EQUIPOS').filter(function (e) { return e.anulado !== true; });
  var contactos = activeRows_(ctx, 'CONTACTOS');
  function clave(x) { return x.en_curso ? '9999' : (x.ultima_fecha || ''); }
  function ordenar(a, b) {
    var ka = clave(a), kb = clave(b);
    if (ka !== kb) return ka < kb ? 1 : -1;
    return String(a.nombre || a.nombre_corto).localeCompare(String(b.nombre || b.nombre_corto));
  }
  var out = activeRows_(ctx, 'CLIENTES').map(function (c) {
    var vs = equipos.filter(function (e) { return e.cliente_id === c.id; }).map(function (e) {
      var te = trabajos.filter(function (t) { return t.equipo_id === e.id; });
      var curso = te.filter(function (t) { return t.estado_ejecucion === 'En curso'; });
      var ej = te.filter(function (t) { return t.estado_ejecucion === 'Ejecutado'; });
      var ult = null, uf = '';
      ej.concat(curso).forEach(function (t) {
        var f = t.estado_ejecucion === 'Ejecutado' ? (t.fecha_fin || t.fecha_inicio || '') : (t.fecha_inicio || '');
        if (!ult || f > uf) { ult = t; uf = f; }
      });
      return {
        equipo_id: e.id, codigo: e.codigo, nombre_corto: e.nombre_corto, patente: e.patente, activo: e.activo !== false,
        ultima_fecha: uf, ultima_descripcion: ult ? String(ult.descripcion || '').slice(0, 160) : '', ultimo_trabajo: ult ? ult.codigo : '',
        km: ult ? ult.km : '', en_curso: curso.length, trabajos: te.length,
        pendientes_vigentes: pendientes.filter(function (x) { return x.equipo_id === e.id && pendienteVigente_(x); }).length
      };
    }).sort(ordenar);
    var top = vs[0] || null;
    return {
      cliente_id: c.id, codigo: c.codigo, nombre: c.nombre, tipo: c.tipo, estado: c.estado,
      ultima_fecha: top ? top.ultima_fecha : '', en_curso: vs.reduce(function (s, v) { return s + v.en_curso; }, 0),
      pendientes_vigentes: vs.reduce(function (s, v) { return s + v.pendientes_vigentes; }, 0),
      contactos: contactos.filter(function (k) { return k.cliente_id === c.id; }).map(function (k) { return { nombre: k.nombre, tipo: k.tipo, telefono: k.telefono, correo: k.correo }; }),
      equipos: vs
    };
  });
  out.sort(ordenar);
  return { data: out, warnings: [] };
}

function horasDe_(sesiones) {
  var t = 0, f = 0;
  sesiones.forEach(function (s) { if (s.estado !== 'Anulada') { t += Number(s.duracion_min) || 0; f += Number(s.min_facturables) || 0; } });
  return { trabajados_min: t, facturables_min: f };
}

/** El técnico ve sus minutos trabajados, no los facturables (dato comercial). */
function horasVisibles_(ctx, h) {
  if (isTecnico_(ctx)) delete h.facturables_min;
  return h;
}

/** Ficha del vehículo: datos, referencias, trabajos con detalle y horas, pendientes vigentes e históricos. */
function vistaFicha_(ctx, p) {
  var e = mustGet_(ctx, 'EQUIPOS', p.equipo_id, 'Equipo');
  if (!rowVisible_(ctx, 'EQUIPOS', e)) fail_('NO_PERMITIDO', 'No tienes acceso a este equipo.');
  var trabajos = activeRows_(ctx, 'TRABAJOS').filter(function (t) { return t.equipo_id === e.id && rowVisible_(ctx, 'TRABAJOS', t); });
  trabajos.sort(function (a, b) {
    var fa = a.fecha_fin || a.fecha_inicio || a.prog_desde || a.creado_en, fb = b.fecha_fin || b.fecha_inicio || b.prog_desde || b.creado_en;
    return fa < fb ? 1 : -1;
  });
  var detalle = activeRows_(ctx, 'DETALLE');
  var sesiones = activeRows_(ctx, 'SESIONES');
  var pend = activeRows_(ctx, 'PENDIENTES').filter(function (x) { return x.equipo_id === e.id && rowVisible_(ctx, 'PENDIENTES', x); });
  var data = {
    equipo: project_(ctx, 'EQUIPOS', e),
    referencias: activeRows_(ctx, 'REFERENCIAS').filter(function (r) { return r.equipo_id === e.id && rowVisible_(ctx, 'REFERENCIAS', r); }).map(function (r) { return project_(ctx, 'REFERENCIAS', r); }),
    trabajos: trabajos.map(function (t) {
      var ses = sesiones.filter(function (s) { return s.trabajo_id === t.id && (!isTecnico_(ctx) || s.usuario_id === ctx.user.id); });
      return {
        trabajo: project_(ctx, 'TRABAJOS', t),
        detalle: detalle.filter(function (d) { return d.trabajo_id === t.id && rowVisible_(ctx, 'DETALLE', d); }).map(function (d) { return project_(ctx, 'DETALLE', d); }),
        horas: horasVisibles_(ctx, horasDe_(ses))
      };
    }),
    pendientes_vigentes: pend.filter(pendienteVigente_).map(function (x) { return project_(ctx, 'PENDIENTES', x); }),
    pendientes_historicos: pend.filter(function (x) { return !pendienteVigente_(x); }).map(function (x) { return project_(ctx, 'PENDIENTES', x); })
  };
  // Administración: cliente y contactos, para crear trabajos y armar el mensaje al cliente desde la ficha.
  if (isAdmin_(ctx)) {
    var cli = getRow_(ctx, 'CLIENTES', e.cliente_id);
    data.cliente = cli ? { id: cli.id, codigo: cli.codigo, nombre: cli.nombre } : null;
    data.contactos = activeRows_(ctx, 'CONTACTOS').filter(function (k) { return k.cliente_id === e.cliente_id; }).map(function (k) {
      return { id: k.id, nombre: k.nombre, telefono: k.telefono, correo: k.correo, rol_solicitante: k.rol_solicitante === true, rol_propietario: k.rol_propietario === true, rol_pagador: k.rol_pagador === true };
    });
  }
  return { data: data, warnings: [] };
}

/** Control económico por cliente: revisa cada pago, cada cobro y cada vínculo. */
function vistaControlEconomico_(ctx, p) {
  requireAdmin_(ctx);
  if (isEmpty_(p.cliente_id)) fail_('REQUERIDO', 'Indica el cliente.');
  var cid = p.cliente_id;
  var conceptos = activeRows_(ctx, 'CONCEPTOS').filter(function (c) { return c.cliente_id === cid; });
  var pagos = activeRows_(ctx, 'PAGOS').filter(function (x) { return x.cliente_id === cid; });
  var imps = activeRows_(ctx, 'IMPUTACIONES').filter(function (x) { return x.cliente_id === cid; });
  var docs = activeRows_(ctx, 'DOC_CONCEPTOS').filter(function (x) { return x.cliente_id === cid; });
  var errores = [], alertas = [];
  var cById = {}, pById = {};
  conceptos.forEach(function (c) { cById[c.id] = c; });
  pagos.forEach(function (x) { pById[x.id] = x; });

  imps.forEach(function (i) {
    var c = getRow_(ctx, 'CONCEPTOS', i.concepto_id), pg = getRow_(ctx, 'PAGOS', i.pago_id);
    if (!c) errores.push(i.codigo + ': imputa a un cobro inexistente');
    else if (c.anulado === true || c.etapa === 'Anulado') errores.push(i.codigo + ': imputa a un cobro anulado (' + c.codigo + ')');
    else if (c.aportante !== 'Taller') errores.push(i.codigo + ': imputa a material del cliente (' + c.codigo + ')');
    else if (c.cliente_id !== cid) errores.push(i.codigo + ': el cobro es de otro cliente');
    if (!pg) errores.push(i.codigo + ': el pago no existe');
    else if (pg.anulado === true) errores.push(i.codigo + ': el pago está anulado (' + pg.codigo + ')');
    else if (pg.cliente_id !== cid) errores.push(i.codigo + ': el pago es de otro cliente');
    else if (pg.confirmado !== true) errores.push(i.codigo + ': imputa un pago sin confirmar (' + pg.codigo + ')');
  });

  var detConceptos = conceptos.map(function (c) {
    var imputado = sumBy_(imps.filter(function (i) { return i.concepto_id === c.id; }), 'monto');
    var documentado = sumBy_(docs.filter(function (d) { return d.concepto_id === c.id; }), 'monto');
    var esVenta = c.aportante === 'Taller' && c.etapa === 'Confirmado';
    var monto = isEmpty_(c.monto_cliente) ? null : Number(c.monto_cliente);
    if (imputado > (monto || 0) && c.aportante === 'Taller') errores.push(c.codigo + ': imputado $' + imputado + ' supera el monto $' + (monto || 0));
    if (esVenta && monto === null) alertas.push(c.codigo + ': cobro confirmado sin monto');
    if (documentado > (esVenta ? monto || 0 : 0)) alertas.push(c.codigo + ': documentado $' + documentado + ' sobre el importe confirmado $' + (esVenta ? monto || 0 : 0));
    return { concepto_id: c.id, codigo: c.codigo, descripcion: c.descripcion, tipo: c.tipo, etapa: c.etapa, aportante: c.aportante, monto: monto, cuenta_como_venta: esVenta, imputado: imputado, por_cubrir: esVenta ? (monto || 0) - imputado : null, documentado: documentado };
  });
  var detPagos = pagos.map(function (x) {
    var imputado = sumBy_(imps.filter(function (i) { return i.pago_id === x.id; }), 'monto');
    if (imputado > Number(x.monto)) errores.push(x.codigo + ': imputado $' + imputado + ' supera el pago $' + x.monto);
    if (x.confirmado !== true) alertas.push(x.codigo + ': pago sin confirmar');
    return { pago_id: x.id, codigo: x.codigo, fecha: x.fecha, monto: Number(x.monto), confirmado: x.confirmado === true, imputado: imputado, sin_asignar: Number(x.monto) - imputado };
  });
  var cobrado = sumBy_(detConceptos.filter(function (c) { return c.cuenta_como_venta; }), 'monto');
  var pagado = sumBy_(detPagos.filter(function (x) { return x.confirmado; }), 'monto');
  var imputadoVentas = sumBy_(detConceptos.filter(function (c) { return c.cuenta_como_venta; }), 'imputado');
  var imputadoTotal = sumBy_(imps, 'monto');
  var totales = {
    cobrado_confirmado: cobrado, pagado_confirmado: pagado, imputado: imputadoTotal,
    saldo_por_cobrar: cobrado - imputadoVentas, abonos_anticipados: imputadoTotal - imputadoVentas, pago_sin_imputar: pagado - imputadoTotal
  };
  if (totales.pago_sin_imputar < 0) errores.push('Se imputó más de lo pagado confirmado');
  // Un cobro confirmado sin monto deja el total desconocido: no se publica un saldo que parezca exacto.
  var desconocidos = detConceptos.filter(function (c) { return c.cuenta_como_venta && c.monto === null; }).map(function (c) { return c.codigo; });
  totales.montos_desconocidos = desconocidos;
  if (desconocidos.length) { totales.cobrado_confirmado = null; totales.saldo_por_cobrar = null; }
  var estado = errores.length ? 'REVISAR' : desconocidos.length ? 'INCOMPLETO' : 'OK';
  return { data: { estado: estado, totales: totales, errores: errores, alertas: alertas, conceptos: detConceptos, pagos: detPagos }, warnings: [] };
}

/** Stock calculado: conteo inicial confirmado + entradas − salidas ± ajustes. Sin conteo confirmado = desconocido. */
function vistaStock_(ctx, p) {
  requireAdmin_(ctx);
  var movs = activeRows_(ctx, 'MOV_INVENTARIO');
  var items = activeRows_(ctx, 'INVENTARIO').filter(function (i) { return !p.cliente_id || i.cliente_id === p.cliente_id; });
  var errores = [];
  var clientes = {};
  rows_(ctx, 'CLIENTES').forEach(function (c) { clientes[c.id] = c.nombre; });
  var out = items.map(function (it) {
    var m = movs.filter(function (x) { return x.item_id === it.id; });
    var neto = 0;
    m.forEach(function (x) {
      if (x.unidad !== it.unidad) { errores.push(x.codigo + ': unidad ' + x.unidad + ' distinta de ' + it.unidad + ' (no se cuenta)'); return; }
      if (!isEmpty_(x.recepcion_id)) {
        var er = movRecepcionError_(ctx, x);
        if (er) { errores.push(x.codigo + ': ' + er + ' (no se cuenta)'); return; }
      }
      if (it.propietario === 'Cliente' && !isEmpty_(x.cliente_id) && x.cliente_id !== it.cliente_id) { errores.push(x.codigo + ': movimiento de otro cliente sobre material de ' + it.codigo + ' (no se cuenta)'); return; }
      var q = Number(x.cantidad) || 0;
      neto += (x.tipo === 'Entrada' || x.tipo === 'Ajuste positivo') ? q : -q;
    });
    var conocido = it.conteo_confirmado === true && !isEmpty_(it.conteo_inicial);
    return {
      item_id: it.id, codigo: it.codigo, articulo: it.articulo, unidad: it.unidad, propietario: it.propietario, cliente_id: it.cliente_id, cliente_nombre: it.cliente_id ? (clientes[it.cliente_id] || '') : '', ubicacion: it.ubicacion,
      conocido: conocido, conteo_inicial: conocido ? Number(it.conteo_inicial) : null, movimientos_neto: neto, stock: conocido ? Number(it.conteo_inicial) + neto : null
    };
  });
  return { data: { items: out, errores: errores }, warnings: [] };
}

/** Horas trabajadas y facturables por persona, actividad y trabajo. El técnico solo ve las suyas. */
function vistaHoras_(ctx, p) {
  var ses = activeRows_(ctx, 'SESIONES').filter(function (s) {
    if (s.estado === 'Anulada') return false;
    if (isTecnico_(ctx) && s.usuario_id !== ctx.user.id) return false;
    if (!isEmpty_(p.usuario_id) && s.usuario_id !== p.usuario_id) return false;
    if (!isEmpty_(p.desde) && s.fecha < p.desde) return false;
    if (!isEmpty_(p.hasta) && s.fecha > p.hasta) return false;
    return true;
  });
  var usuarios = {};
  rows_(ctx, 'USUARIOS').forEach(function (u) { usuarios[u.id] = u.nombre; });
  function agrupar(keyFn, labelFn) {
    var g = {};
    ses.forEach(function (s) {
      var k = keyFn(s);
      if (!g[k]) g[k] = { clave: k, nombre: labelFn(s), trabajados_min: 0, facturables_min: 0, sesiones: 0, abiertas: 0, sin_horario: 0 };
      if (s.estado === 'Abierta') g[k].abiertas++;
      g[k].trabajados_min += Number(s.duracion_min) || 0;
      g[k].facturables_min += Number(s.min_facturables) || 0;
      g[k].sesiones++;
      if (s.sin_horario === true) g[k].sin_horario++;
    });
    return Object.keys(g).map(function (k) { return horasVisibles_(ctx, g[k]); });
  }
  var data = {
    por_persona: agrupar(function (s) { return s.usuario_id; }, function (s) { return usuarios[s.usuario_id] || s.usuario_id; }),
    por_actividad: agrupar(function (s) { return s.usuario_id + '|' + (s.actividad || ''); }, function (s) { return (usuarios[s.usuario_id] || '') + ' · ' + (s.actividad || 'Sin actividad'); }),
    por_trabajo: agrupar(function (s) { return s.trabajo_id; }, function (s) { var t = getRow_(ctx, 'TRABAJOS', s.trabajo_id); return t ? t.codigo : s.trabajo_id; })
  };
  return { data: data, warnings: [] };
}

/** Trabajos para la pantalla principal: técnico = asignados abiertos; administración = abiertos de todos. */
function vistaMisTrabajos_(ctx, p) {
  var equipos = {};
  rows_(ctx, 'EQUIPOS').forEach(function (e) { equipos[e.id] = e; });
  var asign = {};
  activeRows_(ctx, 'ASIGNACIONES').forEach(function (a) { (asign[a.trabajo_id] = asign[a.trabajo_id] || []).push(a.usuario_id); });
  var usuarios = {};
  rows_(ctx, 'USUARIOS').forEach(function (u) { usuarios[u.id] = u.nombre; });
  var lista = activeRows_(ctx, 'TRABAJOS').filter(function (t) {
    if (!rowVisible_(ctx, 'TRABAJOS', t)) return false;
    if (p.incluir_cerrados) return true;
    return t.estado_ejecucion !== 'Ejecutado' && t.estado_comercial !== 'Anulado';
  });
  return {
    data: lista.map(function (t) {
      var e = equipos[t.equipo_id] || {};
      return {
        trabajo: project_(ctx, 'TRABAJOS', t),
        equipo: { id: e.id, codigo: e.codigo, nombre_corto: e.nombre_corto, marca: e.marca, modelo: e.modelo, patente: e.patente },
        asignados: (asign[t.id] || []).map(function (u) { return usuarios[u] || u; })
      };
    }), warnings: []
  };
}

function listasActivas_(ctx) {
  var out = {};
  activeRows_(ctx, 'LISTAS').filter(function (l) { return l.activo === true; })
    .sort(function (a, b) { return (Number(a.orden) || 0) - (Number(b.orden) || 0); })
    .forEach(function (l) { (out[l.lista] = out[l.lista] || []).push(l.valor); });
  return out;
}

/** Pago a trabajadores: horas efectivas por persona y actividad × valor vigente en la fecha de ejecución. Solo quien ve PAGO. */
function vistaPagoTrabajadores_(ctx, p) {
  if (!canSeeTable_(ctx, 'VALORES_TRABAJADOR')) fail_('NO_PERMITIDO', 'Solo Víctor ve el pago a trabajadores.');
  var valores = activeRows_(ctx, 'VALORES_TRABAJADOR');
  var usuarios = {};
  rows_(ctx, 'USUARIOS').forEach(function (u) { usuarios[u.id] = u.nombre; });
  var out = {};
  activeRows_(ctx, 'SESIONES').forEach(function (s) {
    if (s.estado !== 'Cerrada') return;
    if (!isEmpty_(p.usuario_id) && s.usuario_id !== p.usuario_id) return;
    if (!isEmpty_(p.desde) && s.fecha < p.desde) return;
    if (!isEmpty_(p.hasta) && s.fecha > p.hasta) return;
    var c = valores.filter(function (v) { return v.usuario_id === s.usuario_id && v.desde <= s.fecha && (isEmpty_(v.hasta) || v.hasta >= s.fecha); });
    var exact = c.filter(function (v) { return !isEmpty_(s.actividad) && v.actividad === s.actividad; });
    var val = (exact.length ? exact : c.filter(function (v) { return isEmpty_(v.actividad); })).sort(function (a, b) { return a.desde < b.desde ? 1 : -1; })[0];
    var k = s.usuario_id + '|' + (s.actividad || '');
    if (!out[k]) out[k] = { usuario_id: s.usuario_id, nombre: usuarios[s.usuario_id] || s.usuario_id, actividad: s.actividad || 'Sin actividad', minutos: 0, monto: 0, sesiones_sin_valor: 0 };
    var min = Number(s.duracion_min) || 0;
    out[k].minutos += min;
    if (val) out[k].monto += min * Number(val.valor_hora) / 60; else out[k].sesiones_sin_valor++;
  });
  var filas = Object.keys(out).map(function (k) { out[k].monto = Math.round(out[k].monto); return out[k]; });
  return { data: filas, warnings: filas.some(function (f) { return f.sesiones_sin_valor; }) ? [{ code: 'SIN_VALOR', message: 'Hay sesiones sin valor vigente para su persona y actividad.' }] : [] };
}

/** Parte del contrato que necesita una operación (para la pantalla o una IA), filtrada por lo que el usuario puede ver. */
function vistaContrato_(ctx, p) {
  var tablas = p.tablas || (p.tabla ? [p.tabla] : Object.keys(CONTRACT.tables));
  var out = { version: CONTRACT.version, tablas: {} };
  tablas.forEach(function (t) {
    if (!canSeeTable_(ctx, t)) return;
    var cols = CONTRACT.tables[t].columns.filter(function (c) { return !isTecnico_(ctx) || c.tec; });
    out.tablas[t] = { descripcion: CONTRACT.tables[t].d, prefijo: CONTRACT.tables[t].prefix, columnas: cols.map(function (c) {
      var o = { k: c.k, t: c.t };
      if (c.req) o.req = true; if (c.calc) o.calc = true; if (c.d) o.d = c.d;
      if (c.t === 'enum') o.valores = CONTRACT.enums[c.e];
      if (c.t === 'lista') o.lista = c.l;
      if (c.t === 'ref') o.ref = c.ref;
      if (isTecnico_(ctx)) o.escribe = c.tec === 'w';
      return o;
    }) };
  });
  return { data: out, warnings: [] };
}

/* ───────────────────────── revisión de integridad ───────────────────────── */
/** Revisa todas las tablas: referencias que existen, listas fijas válidas, obligatorios y claves repetidas. */
function revisarIntegridad_(ctx) {
  var problemas = [];
  Object.keys(CONTRACT.tables).forEach(function (table) {
    if (!canSeeTable_(ctx, table)) return;
    var ids = {}, codigos = {};
    rows_(ctx, table).forEach(function (r) {
      var etiqueta = table + ' ' + (r.codigo || r.id);
      if (ids[r.id]) problemas.push(etiqueta + ': id repetido');
      ids[r.id] = true;
      if (r.codigo && codigos[r.codigo]) problemas.push(etiqueta + ': código repetido');
      codigos[r.codigo] = true;
      if (r.anulado === true) return;
      CONTRACT.tables[table].columns.forEach(function (c) {
        var val = r[c.k];
        if (c.req && !c.calc && isEmpty_(val)) problemas.push(etiqueta + ': falta ' + c.k);
        if (isEmpty_(val)) return;
        if (c.t === 'enum' && CONTRACT.enums[c.e].indexOf(val) < 0) problemas.push(etiqueta + ': ' + c.k + ' "' + val + '" no es válido');
        if (c.t === 'ref') {
          var t = getRow_(ctx, c.ref, val);
          if (!t) problemas.push(etiqueta + ': ' + c.k + ' apunta a un registro inexistente');
          else if (t.anulado === true) problemas.push(etiqueta + ': ' + c.k + ' apunta a un registro anulado');
        }
        if (c.t === 'lista' && !activeRows_(ctx, 'LISTAS').some(function (l) { return l.lista === c.l && l.valor === val; })) problemas.push(etiqueta + ': ' + c.k + ' "' + val + '" no está en LISTAS');
      });
    });
  });
  return problemas;
}

/* ───────────────────────── paquete IA ───────────────────────── */
/*
 * Una IA (Claude o GPT) convierte un dictado o informe en un paquete de operaciones (formato EG-PAQUETE-1).
 * La IA no escribe en la base: la persona pega el paquete en la app, ve la vista previa (paquete_validar)
 * y lo confirma (paquete_aplicar). Todo pasa por las mismas reglas que la pantalla y se guarda junto o nada.
 *
 * { formato: 'EG-PAQUETE-1', fuente, autor_ia, texto_original, dudas: [..], operaciones: [
 *     { ref: 'cliente', tabla: 'CLIENTES', buscar: { nombre: '…' }, datos: { … } },
 *     { ref: 'equipo',  tabla: 'EQUIPOS',  buscar: { patente: 'KFDG29' }, datos: { cliente_id: '@cliente', … } },
 *     { tabla: 'SESIONES', accion: 'sesion_posterior', datos: { trabajo_id: '@trabajo', usuario_id: '@yo', … } } ] }
 *
 * Valores especiales en datos y buscar: '@ref' (id de una operación anterior), '@yo' (quien aplica),
 * '@usuario:correo o nombre' (un usuario activo).
 * buscar: si hay exactamente un registro vigente que calza, se reutiliza (no se crea ni se modifica);
 * si no hay, se crea; si hay varios, se detiene (AMBIGUO). Las ediciones de registros existentes se hacen en la app.
 */

var PAQUETE_FORMATO = 'EG-PAQUETE-1';
var PAQUETE_MAX_OPS = 200;
var PAQUETE_MAX_TEXTO = 40000;
var PAQUETE_TABLAS_PROHIBIDAS = ['USUARIOS', 'TARIFAS', 'VALORES_TRABAJADOR', 'RECTIFICACIONES', 'PAQUETES'];
var PAQUETE_ACCIONES = ['crear', 'sesion_posterior'];

/** Revisa la forma del paquete antes de tocar datos. */
function paqueteForma_(pq) {
  if (!pq || typeof pq !== 'object' || Array.isArray(pq)) fail_('PAQUETE', 'El paquete no es un objeto JSON.');
  if (pq.formato !== PAQUETE_FORMATO) fail_('PAQUETE', 'Formato desconocido: se espera "' + PAQUETE_FORMATO + '".');
  if (isEmpty_(pq.fuente)) fail_('PAQUETE', 'Falta "fuente": de dónde viene la información.');
  var ops = pq.operaciones;
  if (!Array.isArray(ops) || !ops.length) fail_('PAQUETE', 'El paquete no trae operaciones.');
  if (ops.length > PAQUETE_MAX_OPS) fail_('PAQUETE', 'Demasiadas operaciones (' + ops.length + '). Máximo ' + PAQUETE_MAX_OPS + ': divide el paquete.');
  var refs = {};
  ops.forEach(function (o, i) {
    var n = 'Operación ' + (i + 1);
    if (!o || typeof o !== 'object') fail_('PAQUETE', n + ': no es un objeto.');
    Object.keys(o).forEach(function (k) { if (['ref', 'tabla', 'accion', 'buscar', 'datos', 'nota'].indexOf(k) < 0) fail_('PAQUETE', n + ': clave desconocida "' + k + '".'); });
    if (!CONTRACT.tables[o.tabla]) fail_('PAQUETE', n + ': tabla desconocida "' + o.tabla + '".');
    if (PAQUETE_TABLAS_PROHIBIDAS.indexOf(o.tabla) >= 0) fail_('PAQUETE', n + ': ' + o.tabla + ' no se carga desde un paquete. Se hace en la app.');
    var acc = o.accion || 'crear';
    if (PAQUETE_ACCIONES.indexOf(acc) < 0) fail_('PAQUETE', n + ': acción "' + acc + '" no permitida (crear o sesion_posterior).');
    if (acc === 'sesion_posterior' && o.tabla !== 'SESIONES') fail_('PAQUETE', n + ': sesion_posterior es solo para SESIONES.');
    if (acc === 'crear' && o.tabla === 'SESIONES') fail_('PAQUETE', n + ': las sesiones se cargan con accion "sesion_posterior".');
    if (acc === 'sesion_posterior' && o.buscar) fail_('PAQUETE', n + ': una sesión no lleva "buscar".');
    if (o.buscar !== undefined && (typeof o.buscar !== 'object' || Array.isArray(o.buscar) || !Object.keys(o.buscar).length)) fail_('PAQUETE', n + ': "buscar" debe ser un objeto con al menos un campo.');
    if (o.datos !== undefined && (typeof o.datos !== 'object' || Array.isArray(o.datos))) fail_('PAQUETE', n + ': "datos" debe ser un objeto.');
    if (!o.buscar && !o.datos) fail_('PAQUETE', n + ': falta "datos".');
    if (!isEmpty_(o.ref)) {
      if (!/^[A-Za-z][A-Za-z0-9_]{0,40}$/.test(String(o.ref))) fail_('PAQUETE', n + ': ref "' + o.ref + '" no válida (letras, números y _).');
      if (refs[o.ref]) fail_('PAQUETE', n + ': ref "' + o.ref + '" repetida.');
      refs[o.ref] = true;
    }
  });
}

/** Reemplaza '@ref', '@yo' y '@usuario:…' por ids reales. */
function paqueteValor_(ctx, v, ids, n) {
  if (typeof v !== 'string' || v.charAt(0) !== '@') return v;
  if (v === '@yo') return ctx.user.id;
  if (v.indexOf('@usuario:') === 0) {
    var q = normTxt_(v.slice(9));
    var us = activeRows_(ctx, 'USUARIOS').filter(function (u) { return u.activo === true && (normTxt_(u.correo) === q || normTxt_(u.nombre) === q); });
    if (us.length !== 1) fail_('PAQUETE', n + ': ' + (us.length ? 'hay varios usuarios' : 'no hay un usuario activo') + ' que calce con "' + v.slice(9) + '".');
    return us[0].id;
  }
  var ref = v.slice(1);
  if (!ids[ref]) fail_('PAQUETE', n + ': "' + v + '" no corresponde a una operación anterior del paquete.');
  return ids[ref];
}

function paqueteResolver_(ctx, obj, ids, n) {
  var out = {};
  Object.keys(obj || {}).forEach(function (k) { out[k] = paqueteValor_(ctx, obj[k], ids, n); });
  return out;
}

/** Registros vigentes que calzan con buscar. Patente y VIN se comparan normalizados; textos sin tildes ni mayúsculas. */
function paqueteBuscar_(ctx, tabla, buscar, n) {
  var cols = colMap_(tabla);
  Object.keys(buscar).forEach(function (k) { if (!cols[k] && k !== 'codigo') fail_('PAQUETE', n + ': ' + tabla + ' no tiene la columna "' + k + '" para buscar.'); });
  return activeRows_(ctx, tabla).filter(function (r) {
    return Object.keys(buscar).every(function (k) {
      var want = buscar[k], have = r[k];
      if (isEmpty_(want)) return isEmpty_(have);
      if (tabla === 'EQUIPOS' && (k === 'patente' || k === 'vin')) return normPlate_(have) === normPlate_(want) && normPlate_(want) !== '';
      if (k === 'codigo') return String(have).replace(/^EG-/, '') === String(want).replace(/^EG-/, '');
      var c = cols[k];
      if (c && (c.t === 'ref' || c.t === 'enum' || c.t === 'bool' || c.t === 'int' || c.t === 'num' || c.t === 'money')) return String(have) === String(want);
      return normTxt_(have) === normTxt_(want);
    });
  });
}

/** Etiqueta corta para la vista previa. */
function paqueteEtiqueta_(tabla, r) {
  var k = ['nombre_corto', 'nombre', 'descripcion', 'titulo', 'articulo', 'componente', 'valor'].filter(function (c) { return !isEmpty_(r[c]); })[0];
  var t = k ? String(r[k]) : '';
  if (tabla === 'SESIONES') t = (r.actividad || 'Sesión') + ' · ' + (r.duracion_min || '') + ' min · ' + r.fecha;
  if (tabla === 'CONCEPTOS' || tabla === 'PAGOS' || tabla === 'IMPUTACIONES') t = (t ? t + ' · ' : '') + '$' + String(r.monto_cliente !== undefined && r.monto_cliente !== '' ? r.monto_cliente : r.monto).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return t.length > 90 ? t.slice(0, 87) + '…' : t;
}

/**
 * Ejecuta las operaciones sobre ctx.store (una TxStore: nada se guarda hasta el commit).
 * Devuelve { resultados: [{ n, tabla, accion, resultado: 'Nuevo'|'Existente', codigo, id, etiqueta, avisos }], avisos }.
 */
function paqueteEjecutar_(ctx, pq, baseOp, parcial) {
  var ids = {}, resultados = parcial || [], avisosGlobales = [];
  pq.operaciones.forEach(function (o, i) {
    var n = 'Operación ' + (i + 1) + ' (' + o.tabla + (o.ref ? ' ' + o.ref : '') + ')';
    var acc = o.accion || 'crear';
    var opId = baseOp ? baseOp + '#' + (i + 1) : '';
    var res;
    try {
      var datos = paqueteResolver_(ctx, o.datos, ids, n);
      var previo = opId ? findByOp_(ctx, o.tabla, opId) : null;
      if (previo) {
        res = { tabla: o.tabla, accion: acc, resultado: 'Ya aplicado', row: previo, avisos: [] };
      } else if (o.buscar) {
        var buscar = paqueteResolver_(ctx, o.buscar, ids, n);
        var hall = paqueteBuscar_(ctx, o.tabla, buscar, n);
        if (hall.length > 1) fail_('AMBIGUO', n + ': hay ' + hall.length + ' registros que calzan (' + hall.map(function (r) { return r.codigo; }).join(', ') + '). Precisa la búsqueda o usa el código.');
        if (hall.length === 1) {
          var ex = hall[0], dif = [];
          Object.keys(datos).forEach(function (k) {
            if (isEmpty_(datos[k]) || isEmpty_(ex[k])) return;
            var a = String(ex[k]), b = String(datos[k]);
            if (a !== b && normTxt_(a) !== normTxt_(b) && !(o.tabla === 'EQUIPOS' && (k === 'patente' || k === 'vin') && normPlate_(a) === normPlate_(b))) dif.push(k + ': en la base "' + a + '", en el paquete "' + b + '"');
          });
          res = { tabla: o.tabla, accion: 'reutilizar', resultado: 'Existente', row: ex, avisos: dif.length ? [{ code: 'DIFERENCIA', message: 'Ya existía ' + ex.codigo + '. No se modificó. Diferencias: ' + dif.join('; ') + '. Si corresponde, corrígelo en la app.' }] : [] };
        }
        if (!res) Object.keys(buscar).forEach(function (k) { if (k !== 'codigo' && isEmpty_(datos[k])) datos[k] = buscar[k]; });
      }
      if (!res && acc === 'crear') {
        var c = insertRow_(ctx, o.tabla, datos, { opId: opId });
        res = { tabla: o.tabla, accion: acc, resultado: 'Nuevo', row: c.row, avisos: c.warnings };
      }
      if (!res && acc === 'sesion_posterior') {
        var sp = sesionPosterior_(ctx, Object.assign({}, datos, { op_id: opId }));
        res = { tabla: o.tabla, accion: acc, resultado: 'Nuevo', row: sp.data, avisos: sp.warnings };
      }
    } catch (e) {
      if (e && e.name === 'AppError') {
        var msg = e.message.indexOf('Operación ') === 0 ? e.message : n + ': ' + e.message;
        fail_(e.code, msg, Object.assign({ operacion: i + 1, tabla: o.tabla, ref: o.ref || '' }, e.details || {}));
      }
      throw e;
    }
    if (!isEmpty_(o.ref)) ids[o.ref] = res.row.id;
    resultados.push({ n: i + 1, ref: o.ref || '', tabla: o.tabla, accion: res.accion, resultado: res.resultado, id: res.row.id, codigo: res.row.codigo, etiqueta: paqueteEtiqueta_(o.tabla, res.row), avisos: res.avisos || [] });
  });
  return { resultados: resultados, avisos: avisosGlobales };
}

function paqueteTexto_(pq) {
  var t = isEmpty_(pq.texto_original) ? '' : String(pq.texto_original);
  return t.length > PAQUETE_MAX_TEXTO ? { texto: t.slice(0, PAQUETE_MAX_TEXTO), cortado: true } : { texto: t, cortado: false };
}

/** Huella del contenido del paquete (SHA-256 en Apps Script; en el modo demo del navegador, huella no criptográfica). */
function paqueteHuella_(pq) {
  var t = stableJson_(pq);
  try { return 'sha256:' + sha256hex_(t); } catch (e) { return 'h:' + hashTxt_(t); }
}

/** Vista previa: corre todo en una transacción que se descarta. No escribe nada. */
function paqueteValidar_(ctx, p) {
  requireAdmin_(ctx);
  var pq = p.paquete;
  paqueteForma_(pq);
  var tx = new TxStore(ctx.store);
  var c = {};
  Object.keys(ctx).forEach(function (k) { if (k !== '_assigned') c[k] = ctx[k]; });
  c.store = tx; c._tx = tx;
  var out = { valido: true, fuente: pq.fuente, autor_ia: pq.autor_ia || '', dudas: [].concat(pq.dudas || []), resultados: [], error: null, huella: paqueteHuella_(pq) };
  try {
    paqueteEjecutar_(c, pq, '', out.resultados);
  } catch (e) {
    if (!(e && e.name === 'AppError')) throw e;
    out.valido = false;
    out.error = { code: e.code, message: e.message, details: e.details };
  }
  var tt = paqueteTexto_(pq);
  var avisos = [];
  if (tt.cortado) avisos.push({ code: 'TEXTO_LARGO', message: 'El texto original supera ' + PAQUETE_MAX_TEXTO + ' caracteres: se guardará cortado.' });
  if (isEmpty_(pq.texto_original)) avisos.push({ code: 'SIN_TEXTO', message: 'El paquete no trae el texto original: quedará solo la fuente.' });
  return { data: out, warnings: avisos };
}

/** Aplica el paquete: todo junto o nada (la transacción la abre handle_). */
function paqueteAplicar_(ctx, p) {
  requireAdmin_(ctx);
  var pq = p.paquete;
  paqueteForma_(pq);
  // Lo que se aplica es exactamente lo que se revisó: la vista previa entrega la huella y aquí se exige igual.
  var huella = paqueteHuella_(pq);
  if (!isEmpty_(p.archivo_id) && isEmpty_(p.huella)) fail_('REQUERIDO', 'Falta la huella de la vista previa: revisa el paquete antes de aplicarlo.');
  if (!isEmpty_(p.huella) && String(p.huella) !== huella) fail_('PAQUETE_CAMBIO', 'El paquete cambió después de la vista previa. Revísalo de nuevo antes de aplicar.');
  var opPq = p.op_id + '#paquete';
  // Un archivo (o un mismo contenido) se aplica una sola vez, aunque no se haya podido marcar en Drive. Un reintento con el mismo op_id sí pasa.
  var previo = activeRows_(ctx, 'PAQUETES').filter(function (x) {
    return x.op_id !== opPq && ((!isEmpty_(p.archivo_id) && x.archivo_id === String(p.archivo_id)) || x.huella === huella);
  })[0];
  if (previo) fail_('YA_PROCESADO', (previo.archivo_id && previo.archivo_id === String(p.archivo_id) ? 'Este archivo' : 'Este mismo paquete') + ' ya se aplicó como ' + previo.codigo + '.', { codigo: previo.codigo, archivo_id: previo.archivo_id || '' });
  var r = paqueteEjecutar_(ctx, pq, p.op_id);
  var nuevos = r.resultados.filter(function (x) { return x.resultado === 'Nuevo'; }).length;
  var resumen = r.resultados.map(function (x) { return x.n + '. ' + x.tabla + ' ' + x.codigo + ' ' + x.resultado + (x.etiqueta ? ' · ' + x.etiqueta : ''); }).join('\n');
  var tt = paqueteTexto_(pq);
  var reg = findByOp_(ctx, 'PAQUETES', opPq) || insertSystem_(ctx, 'PAQUETES', {
    archivo_id: isEmpty_(p.archivo_id) ? '' : String(p.archivo_id), huella: huella,
    fuente: String(pq.fuente).slice(0, 500), autor_ia: String(pq.autor_ia || '').slice(0, 100), operaciones: pq.operaciones.length,
    resumen: resumen, dudas: [].concat(pq.dudas || []).join('\n'), texto_original: tt.texto,
    notas: 'Aplicado por ' + ctx.user.correo + '. ' + nuevos + ' registro(s) nuevo(s).' + (tt.cortado ? ' Texto original cortado.' : '') + (p.archivo_id ? ' Archivo de la Bandeja EG: ' + p.archivo_id + '.' : '')
  }, { opId: opPq });
  var avisos = [];
  r.resultados.forEach(function (x) { (x.avisos || []).forEach(function (w) { avisos.push({ code: w.code, message: 'Op. ' + x.n + ' ' + x.tabla + ': ' + w.message }); }); });
  return { data: { id: reg.id, codigo: reg.codigo, resultados: r.resultados, nuevos: nuevos }, warnings: avisos };
}

/* ───────────────────────── punto de entrada ───────────────────────── */

var ACCIONES_ESCRITURA = ['crear', 'editar', 'anular', 'sesion_iniciar', 'sesion_pausar', 'sesion_terminar', 'sesion_posterior', 'concepto_desde_sesiones', 'aporte_revisar', 'recepcion_confirmar', 'paquete_aplicar'];

var TABLA_DE_ACCION = {
  sesion_iniciar: 'SESIONES', sesion_pausar: 'SESIONES', sesion_terminar: 'SESIONES', sesion_posterior: 'SESIONES',
  concepto_desde_sesiones: 'CONCEPTOS', recepcion_confirmar: 'RECEPCIONES'
};

/**
 * Transacción de una solicitud: las escrituras se acumulan en memoria y se aplican al almacenamiento
 * solo si toda la operación terminó sin error. Si algo falla a mitad de camino, no queda nada a medias.
 * Varias escrituras a la misma fila se aplican como una sola (la versión final).
 */
function TxStore(base) { this.base = base; this.t = {}; this.log = []; }
TxStore.prototype.t_ = function (table) { return this.t[table] || (this.t[table] = this.base.list(table).slice()); };
TxStore.prototype.list = function (table) { return this.t_(table); };
TxStore.prototype.get = function (table, id) {
  var rs = this.t_(table);
  for (var i = 0; i < rs.length; i++) if (rs[i].id === id) return rs[i];
  return null;
};
TxStore.prototype.insert = function (table, row) {
  this.t_(table).push(clone_(row));
  this.log.push({ op: 'insert', table: table, id: row.id });
  return row;
};
TxStore.prototype.update = function (table, id, row) {
  var rs = this.t_(table);
  for (var i = 0; i < rs.length; i++) if (rs[i].id === id) { rs[i] = clone_(row); this.log.push({ op: 'update', table: table, id: id }); return row; }
  fail_('NO_EXISTE', 'No se encontró el registro ' + id + ' en ' + table);
};
/**
 * Aplica los cambios al almacenamiento real. Devuelve lo escrito: [{ tabla, id, version }].
 * meta = { op_id, huella, usuario, accion }: si el almacenamiento tiene DIARIO, primero se anota la operación
 * completa (una sola fila) y recién después se escribe en las hojas. Si el guardado se corta a mitad de camino,
 * la próxima escritura la termina desde el diario (recuperarDiario_). Sin meta (importaciones) no se usa diario.
 */
TxStore.prototype.commit = function (meta) {
  var orden = [], vistos = {}, nuevos = {};
  this.log.forEach(function (e) {
    var k = e.table + '|' + e.id;
    if (e.op === 'insert') nuevos[k] = true;
    if (!vistos[k]) { vistos[k] = true; orden.push(e); }
  });
  var self = this;
  var cambios = orden.map(function (e) { return { tabla: e.table, id: e.id, nuevo: !!nuevos[e.table + '|' + e.id], fila: self.get(e.table, e.id) }; });
  this.log = [];
  if (!cambios.length) return [];
  var asiento = (meta && this.base.journalBegin) ? this.base.journalBegin({ op_id: meta.op_id, huella: meta.huella, usuario: meta.usuario, accion: meta.accion, cambios: cambios }) : null;
  try {
    aplicarCambios_(this.base, cambios, false);
    if (asiento) this.base.journalEnd(asiento);
  } catch (err) {
    if (!asiento) throw err;
    fail_('GUARDADO_INTERRUMPIDO', 'El guardado se cortó a mitad de camino. Quedó anotado y se completa automáticamente en la próxima solicitud (la pantalla recarga sola). Revisa antes de repetir.', { causa: String(err && err.message || err) });
  }
  return cambios.map(function (c) { return { tabla: c.tabla, id: c.id, version: c.fila.version }; });
};

/**
 * Escribe una lista de cambios. Filas nuevas primero (en bloque por hoja), luego las ediciones.
 * reanudar = true (recuperación desde el diario): solo escribe lo que falta o quedó en una versión anterior.
 */
function aplicarCambios_(base, cambios, reanudar) {
  var lotes = {}, tablasLote = [], ediciones = [];
  cambios.forEach(function (c) {
    var actual = reanudar ? base.get(c.tabla, c.id) : null;
    if (reanudar && actual && Number(actual.version) >= Number(c.fila.version)) return; // ya estaba escrito
    if (c.nuevo && !actual) {
      if (base.insertMany) { if (!lotes[c.tabla]) { lotes[c.tabla] = []; tablasLote.push(c.tabla); } lotes[c.tabla].push(c.fila); }
      else base.insert(c.tabla, c.fila);
    } else if (actual || !reanudar) ediciones.push(c);
  });
  tablasLote.forEach(function (t) { base.insertMany(t, lotes[t]); });
  ediciones.forEach(function (c) { base.update(c.tabla, c.id, c.fila); });
}

/** Termina las operaciones que quedaron a medias (guardado interrumpido). Se llama antes de cada escritura. */
function recuperarDiario_(base) {
  if (!base.journalPending) return 0;
  var pendientes = base.journalPending();
  pendientes.forEach(function (a) {
    aplicarCambios_(base, a.cambios, true);
    base.journalEnd(a);
  });
  return pendientes.length;
}

/**
 * Usuario vigente según el almacenamiento (después de recuperar el diario): rol y estado actuales.
 * Si ya no está activo, se rechaza. El usuario 'sistema' no se relee.
 */
function usuarioVigente_(ctx) {
  if (isSystem_(ctx) || !ctx.user || !ctx.user.id) return ctx.user;
  var u = ctx.store.get('USUARIOS', ctx.user.id);
  if (!u || u.anulado === true || u.activo !== true || String(u.correo).toLowerCase() !== String(ctx.user.correo).toLowerCase()) {
    fail_('NO_AUTORIZADO', 'La cuenta ' + ctx.user.correo + ' ya no está habilitada en el registro.');
  }
  return u;
}

function handle_(ctx, action, p) {
  p = p || {};
  if (ctx._tx) return handleInner_(ctx, action, p);
  var escritura = ACCIONES_ESCRITURA.indexOf(action) >= 0;
  if (escritura && isEmpty_(p.op_id)) fail_('REQUERIDO', 'Falta op_id: cada escritura necesita un identificador de operación.');
  // 1. Si una operación anterior quedó a medias, se termina antes de leer o escribir.
  //    En Apps Script lo hace la API bajo bloqueo (recuperacionEnApi); aquí, en escrituras (que van bajo bloqueo) y en memoria.
  if (escritura || !ctx.recuperacionEnApi) recuperarDiario_(ctx.store);
  // 2. Permisos con el usuario vigente: un cambio de rol o una desactivación recuperados rigen desde ya.
  var vigente = usuarioVigente_(ctx);
  if (vigente !== ctx.user) {
    var c0 = {};
    Object.keys(ctx).forEach(function (k) { if (k !== '_assigned') c0[k] = ctx[k]; });
    c0.user = vigente;
    ctx = c0;
  }
  if (!escritura) return handleInner_(ctx, action, p);
  var contenido = {};
  Object.keys(p).forEach(function (k) { if (k !== 'op_id') contenido[k] = p[k]; });
  var huella = hashTxt_(stableJson_({ accion: action, usuario: ctx.user && ctx.user.correo, contenido: contenido }));
  // 2. Un op_id ya usado solo puede repetirse con el mismo contenido (en cualquier tabla, aunque la fila se haya editado después).
  var previo = ctx.store.journalFind ? ctx.store.journalFind(p.op_id) : null;
  if (previo && previo.huella && previo.huella !== huella) {
    fail_('REINTENTO_DISTINTO', 'La operación ' + p.op_id + ' ya se aplicó con otro contenido. Si es un registro nuevo, la pantalla debe usar otro identificador.');
  }
  var tx = new TxStore(ctx.store);
  var c = {};
  Object.keys(ctx).forEach(function (k) { if (k !== '_assigned') c[k] = ctx[k]; });
  c.store = tx;
  c._tx = tx;
  c._opHash = huella;
  var res = handleInner_(c, action, p);
  // Se devuelve la fila tal como queda guardada (versión final), y solo si quien pregunta puede verla.
  var tabla = TABLA_DE_ACCION[action] || p.tabla;
  if (res && res.data && res.data.id && tabla && CONTRACT.tables[tabla]) {
    var fin = tx.get(tabla, res.data.id);
    if (fin) res.data = rowVisible_(c, tabla, fin) ? project_(c, tabla, fin) : { id: fin.id };
  }
  res.escritos = tx.commit({ op_id: p.op_id, huella: huella, usuario: ctx.user && ctx.user.correo, accion: action });
  return res;
}

function handleInner_(ctx, action, p) {
  switch (action) {
    case 'yo':
      return { data: { usuario: project_(ctx, 'USUARIOS', ctx.user), rol: rol_(ctx), ve_pago_trabajadores: canSeeTable_(ctx, 'VALORES_TRABAJADOR') }, warnings: [] };
    case 'inicio':
      var abierta = openSessionOf_(ctx, ctx.user.id);
      return {
        data: {
          usuario: project_(ctx, 'USUARIOS', ctx.user), rol: rol_(ctx), version: CONTRACT.version,
          listas: listasActivas_(ctx), enums: CONTRACT.enums,
          sesion_abierta: abierta ? project_(ctx, 'SESIONES', abierta) : null,
          trabajos: vistaMisTrabajos_(ctx, {}).data,
          resumen: vistaResumen_(ctx, {}).data
        }, warnings: []
      };
    case 'listas': return { data: listasActivas_(ctx), warnings: [] };
    case 'listar':
      if (!canSeeTable_(ctx, p.tabla)) fail_('NO_PERMITIDO', 'No tienes acceso a ' + p.tabla + '.');
      var rs = visibleRows_(ctx, p.tabla, p.incluir_anulados === true && isAdmin_(ctx));
      if (p.filtro) rs = rs.filter(function (r) { return Object.keys(p.filtro).every(function (k) { return String(r[k]) === String(p.filtro[k]); }); });
      return { data: rs, warnings: [] };
    case 'obtener':
      var r = mustGet_(ctx, p.tabla, p.id);
      if (!rowVisible_(ctx, p.tabla, r)) fail_('NO_EXISTE', p.tabla + ' no existe: ' + p.id);
      return { data: project_(ctx, p.tabla, r), warnings: [] };
    case 'crear':
      var c = insertRow_(ctx, p.tabla, p.datos, { opId: p.op_id });
      return { data: project_(ctx, p.tabla, c.row), warnings: c.warnings, duplicate: c.duplicate };
    case 'editar':
      var u = updateRow_(ctx, p.tabla, p.id, p.version, p.cambios, { opId: p.op_id, motivo: p.motivo, fuente: p.fuente });
      return { data: project_(ctx, p.tabla, u.row), warnings: u.warnings, duplicate: u.duplicate };
    case 'anular':
      var a = anularRow_(ctx, p.tabla, p.id, p.version, p.motivo, p.op_id, p.fuente);
      return { data: project_(ctx, p.tabla, a.row), warnings: a.warnings, duplicate: a.duplicate };
    case 'sesion_iniciar': return sesionIniciar_(ctx, p);
    case 'sesion_pausar': return sesionCerrar_(ctx, p, true);
    case 'sesion_terminar': return sesionCerrar_(ctx, p, false);
    case 'sesion_posterior': return sesionPosterior_(ctx, p);
    case 'concepto_desde_sesiones': return conceptoDesdeSesiones_(ctx, p);
    case 'aporte_revisar': return aporteRevisar_(ctx, p);
    case 'recepcion_confirmar':
      requireAdmin_(ctx);
      var cambiosRc = { estado: 'Confirmada' };
      if (!isEmpty_(p.evidencia)) cambiosRc.evidencia = p.evidencia;
      var rc = updateRow_(ctx, 'RECEPCIONES', p.recepcion_id, p.version, cambiosRc, { opId: p.op_id, noRect: true });
      return { data: getRow_(ctx, 'RECEPCIONES', p.recepcion_id), warnings: rc.warnings, duplicate: rc.duplicate };
    case 'resumen': return vistaResumen_(ctx, p);
    case 'ficha': return vistaFicha_(ctx, p);
    case 'mis_trabajos': return vistaMisTrabajos_(ctx, p);
    case 'control_economico': return vistaControlEconomico_(ctx, p);
    case 'clientes': return vistaClientes_(ctx, p);
    case 'stock': return vistaStock_(ctx, p);
    case 'horas': return vistaHoras_(ctx, p);
    case 'integridad': requireAdmin_(ctx); return { data: revisarIntegridad_(ctx), warnings: [] };
    case 'pago_trabajadores': return vistaPagoTrabajadores_(ctx, p);
    case 'contrato': return vistaContrato_(ctx, p);
    case 'paquete_validar': return paqueteValidar_(ctx, p);
    case 'paquete_aplicar': return paqueteAplicar_(ctx, p);
  }
  fail_('ACCION', 'Acción desconocida: ' + action);
}

// Almacenamiento en memoria con la misma interfaz que SheetStore. Se usa en pruebas y en el modo demo.
function MemoryStore(seed) {
  this.tables = {};
  if (seed) for (var k in seed) this.tables[k] = seed[k].map(function (r) { return JSON.parse(JSON.stringify(r)); });
}
MemoryStore.prototype.t_ = function (table) { return this.tables[table] || (this.tables[table] = []); };
MemoryStore.prototype.list = function (table) { return this.t_(table); };
MemoryStore.prototype.get = function (table, id) {
  var rs = this.t_(table);
  for (var i = 0; i < rs.length; i++) if (rs[i].id === id) return rs[i];
  return null;
};
MemoryStore.prototype.insert = function (table, row) { this.t_(table).push(JSON.parse(JSON.stringify(row))); return row; };
MemoryStore.prototype.update = function (table, id, row) {
  var rs = this.t_(table);
  for (var i = 0; i < rs.length; i++) if (rs[i].id === id) { rs[i] = JSON.parse(JSON.stringify(row)); return row; }
  throw new Error('No existe ' + id + ' en ' + table);
};
MemoryStore.prototype.verify = function (table, id, version) { var r = this.get(table, id); return !!r && Number(r.version) === Number(version); };
MemoryStore.prototype.dump = function () { return JSON.parse(JSON.stringify(this.tables)); };
// Diario de operaciones (ver TxStore.commit): una entrada por escritura confirmada; Pendiente mientras se aplica.
MemoryStore.prototype.diario_ = function () { return this.diario || (this.diario = []); };
MemoryStore.prototype.journalBegin = function (a) {
  var e = { op_id: a.op_id, huella: a.huella, usuario: a.usuario, accion: a.accion, fecha: new Date().toISOString(), estado: 'Pendiente', cambios: JSON.parse(JSON.stringify(a.cambios)) };
  this.diario_().push(e);
  return e;
};
MemoryStore.prototype.journalEnd = function (e) { e.estado = 'Completa'; e.cambios = null; };
MemoryStore.prototype.journalPending = function () { return this.diario_().filter(function (e) { return e.estado === 'Pendiente'; }); };
MemoryStore.prototype.journalFind = function (opId) {
  var d = this.diario_();
  for (var i = d.length - 1; i >= 0; i--) if (d[i].op_id === opId) return d[i];
  return null;
};

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var DEMO = !APP_CONFIG.API_URL || /[?&]demo=1/.test(location.search);
var S = { token:null, acceso:null, inicio:null, tab:'trabajos', tickTimer:null, demoUser:null };
/* Llave de acceso de este equipo (1.5.3): se entra con Google una vez y la llave dura 30 días sin uso. */
var ACCESO_KEY = 'eg_registro_acceso';
function leerAcceso(){ try { var v = localStorage.getItem(ACCESO_KEY); return /^[0-9a-f]{64}$/.test(v || '') ? v : null; } catch (e) { return null; } }
function guardarAcceso(v){ S.acceso = v; try { localStorage.setItem(ACCESO_KEY, v); } catch (e) {} }
function borrarAcceso(){ S.acceso = null; try { localStorage.removeItem(ACCESO_KEY); } catch (e) {} }
function nombreEquipo(){ var u = navigator.userAgent || ''; return /iPhone|iPad/.test(u) ? 'iPhone/iPad' : /Android/.test(u) ? 'Android' : /Windows/.test(u) ? 'Windows' : /Mac/.test(u) ? 'Mac' : 'Navegador'; }
if (!DEMO) S.acceso = leerAcceso();

/* ───── utilidades de pantalla ───── */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function opId(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2); }
var toastTimer;
function toast(msg, kind){
  var t = $('toast'); t.textContent = msg; t.className = 'toast on' + (kind ? ' ' + kind : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.className = 'toast'; }, kind === 'err' ? 6000 : 3500);
}
function showWarnings(ws){ if (ws && ws.length) toast(ws.map(function(w){ return w.message; }).join(' · '), 'warn'); }
function plate(p, big){
  var txt = String(p || '').toUpperCase().replace(/\s+/g,'').replace(/-/g,'·');
  if (!txt) return '<span class="plate' + (big ? ' big' : '') + '"><small>SIN PATENTE</small><b>—</b></span>';
  return '<span class="plate' + (big ? ' big' : '') + '"><small>CHILE</small><b>' + esc(txt) + '</b></span>';
}
function fmtFecha(iso){
  if (!iso) return '';
  var d = /^\d{4}-\d{2}-\d{2}$/.test(iso) ? new Date(iso + 'T12:00:00') : new Date(iso);
  return d.toLocaleDateString('es-CL', { day:'2-digit', month:'short', year:'numeric' });
}
function fmtMin(m){ m = Number(m) || 0; var h = Math.floor(m / 60), r = m % 60; return h ? h + ' h ' + (r < 10 ? '0' : '') + r + ' min' : r + ' min'; }
function fmtHM(m){ m = Number(m) || 0; var h = Math.floor(m / 60), r = m % 60; return h + ':' + (r < 10 ? '0' : '') + r; }
function fmtKm(n){ return (n === '' || n == null) ? '' : Number(n).toLocaleString('es-CL') + ' km'; }
function dispositivo(){ var w = Math.min(screen.width, screen.height); return w < 600 ? 'Celular' : (w < 1000 ? 'Tablet' : 'PC'); }
function isAdmin(){ return S.inicio && S.inicio.rol !== 'Tecnico'; }
function options(list, sel, empty){
  var h = empty ? '<option value="">' + esc(empty) + '</option>' : '';
  (list || []).forEach(function(v){ h += '<option' + (v === sel ? ' selected' : '') + '>' + esc(v) + '</option>'; });
  return h;
}

/* ───── API (producción) o lógica local (demo) ───── */
function api(action, payload){
  payload = payload || {};
  if (DEMO) return Promise.resolve(DemoApi.call(action, payload));
  // Con llave de acceso no se manda el token de Google (salvo para sacar la llave).
  var usarLlave = S.acceso && action !== 'acceso_abrir';
  var body = JSON.stringify({ action: action, payload: payload, id_token: usarLlave ? null : S.token, sesion: usarLlave ? S.acceso : null });
  function intento(n){
    return fetch(APP_CONFIG.API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: body, redirect:'follow' })
      .then(function(r){ return r.json(); })
      .catch(function(e){
        // Reintento con el mismo op_id: el servidor no lo aplica dos veces.
        if (n < 2) return new Promise(function(res){ setTimeout(res, 1200); }).then(function(){ return intento(n + 1); });
        return { ok:false, error:{ code:'RED', message:'Sin conexión con el servidor. Revisa la señal y reintenta.' } };
      });
  }
  return intento(1);
}
function call(action, payload){
  return api(action, payload).then(function(r){
    if (!r.ok){
      var e = r.error || {};
      if (e.code === 'NO_AUTENTICADO') { S.token = null; borrarAcceso(); S.inicio = null; cerrarHoja(); renderLogin(); }
      toast(e.message || 'Error', 'err');
      // Guardado cortado o no verificado: se recarga para no repetir sobre datos viejos.
      if (e.code === 'GUARDADO_INTERRUMPIDO' || e.code === 'NO_VERIFICADO') { cerrarHoja(); setTimeout(function(){ cargar(); }, 1500); }
      var err = new Error(e.message); err.code = e.code; err.details = e.details; throw err;
    }
    showWarnings(r.warnings);
    return r;
  });
}

/* Google entrega un token de 1 hora: se cambia por la llave de acceso de este equipo y se carga. */
function entrarConGoogle(resp){
  S.token = resp.credential;
  $('main').innerHTML = '<div class="empty">Entrando…</div>';
  api('acceso_abrir', { equipo: nombreEquipo() }).then(function(r){
    if (r.ok && r.data && r.data.sesion) { guardarAcceso(r.data.sesion); S.token = null; }
  }).then(function(){ return cargar(); }).catch(function(){});
}
function arrancar(){
  if (DEMO || !S.acceso) return renderLogin();
  $('main').innerHTML = '<div class="empty">Cargando…</div>';
  cargar().catch(function(e){
    if (e && e.code === 'NO_AUTENTICADO') return; // ya volvió a la pantalla de inicio de sesión
    $('main').innerHTML = '<div class="login"><h2>No se pudo cargar</h2><p>' + esc(e && e.message || 'Error') + '</p><button class="btn big" type="button" data-act="reintentar">Reintentar</button></div>';

/* Foto comprimida a 900 px, JPEG 72 % (idea de Taller Pro v10). */
var fotoActual = null;
function comprimirFoto(e){
  var file = e.target.files[0]; if (!file) return;
  var rd = new FileReader();
  rd.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      var MAX = 900, w = img.width, h = img.height;
      if (w > MAX){ h = Math.round(h * MAX / w); w = MAX; } if (h > MAX){ w = Math.round(w * MAX / h); h = MAX; }
      var c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
      fotoActual = c.toDataURL('image/jpeg', 0.72);
      $('dPrev').src = fotoActual; $('dPrev').style.display = 'block';
    };
    img.src = ev.target.result;
  };
  rd.readAsDataURL(file);
}

/** Km escrito a mano: '' si viene vacío, número si es 12345 o 12.345 (puntos de miles), null si no es válido. */
function leerKm(txt){
  var v = String(txt || '').trim().replace(/\s/g, '');
  if (!v) return '';
  if (/^\d+$/.test(v) || /^\d{1,3}(\.\d{3})+$/.test(v)) return Number(v.replace(/\./g, ''));
  return null;
}

  if (prog) datos.prog_desde = new Date(prog).toISOString();

}

function isoALocal(iso){ if (!iso) return ''; var d = new Date(iso); var z = function(n){ return (n < 10 ? '0' : '') + n; }; return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + 'T' + z(d.getHours()) + ':' + z(d.getMinutes()); }

function guardarFormulario(btn){

  cols.forEach(function(c){ var v = leerCampo(c); if (v === undefined) return; if (!fila) { if (v !== '' && v !== false) datos[c.k] = v; } else if (String(v) !== String(fila[c.k] === undefined ? '' : fila[c.k])) datos[c.k] = v; });
  if (fila && !Object.keys(datos).length) return toast('No hay cambios.');
  btn.disabled = true;
  var req = fila ? call('editar', { tabla: t, id: fila.id, version: fila.version, cambios: datos, motivo: $('fxMotivo').value.trim(), fuente: $('fxFuente').value.trim(), op_id: opId() }) : call('crear', { tabla: t, datos: datos, op_id: opId() });
  req.then(function(){ toast(fila ? 'Cambios guardados.' : 'Registro creado.'); cerrarHoja(); D.refs = {}; cargarDatos(); return cargar(); })
    .catch(function(e){
      if (e.code === 'CONFLICTO') { toast('Otra persona modificó el registro. Se recargó la versión actual.', 'err'); cerrarHoja(); cargarDatos(); }
      else if (e.code === 'MOTIVO_REQUERIDO') { var m = $('fxMotivo').value.trim() ? $('fxFuente') : $('fxMotivo'); if (m) m.focus(); }
    })
    .then(function(){ btn.disabled = false; });
}

var PQ = { texto:'', paquete:null, op:null, archivo:null };
function abrirPaquete(){
  var h = '<div class="block"><h3>Bandeja EG</h3><div id="pqBandeja" class="s" style="color:var(--acero)">Buscando paquetes…</div></div>' +
    '<p style="margin-top:0;color:var(--acero)">O pega aquí el paquete que armó Claude o GPT en el chat. Primero se revisa sin guardar nada; después confirmas.</p>' +

    if (!r.data.length) { el.textContent = 'No hay paquetes por revisar.'; return; }

  });

function contarBandeja(){
  if (DEMO || !isAdmin()) return;

/** Acepta el JSON solo o rodeado de texto o de ``` (lo que suele copiarse desde un chat). */
function leerPaquete(txt){
  var a = txt.indexOf('{'), b = txt.lastIndexOf('}');
  if (a < 0 || b < a) throw new Error('No encuentro un paquete: debe empezar con { y terminar con }.');
  try { return JSON.parse(txt.slice(a, b + 1)); }
  catch (e) { throw new Error('El paquete está incompleto o mal copiado. Cópialo de nuevo completo desde el chat.'); }
}
function validarPaquete(btn, archivo){
  var payload;
  if (archivo) {
    if (!PQ.archivo || PQ.archivo.id !== archivo.id || !PQ.op) { PQ.op = opId(); PQ.huella = null; }
    PQ.archivo = archivo; PQ.paquete = null;
    payload = { archivo_id: archivo.id };
  } else {
    var txt = $('pqTexto').value;
    var pq;
    try { pq = leerPaquete(txt); } catch (e) { return toast(e.message, 'err'); }
    // Mismo texto = misma operación: un doble toque en Aplicar no carga dos veces.
    if (txt !== PQ.texto || !PQ.op || PQ.archivo) { PQ.op = opId(); PQ.huella = null; }
    PQ.texto = txt; PQ.paquete = pq; PQ.archivo = null;
    payload = { paquete: pq };
  }
  btn.disabled = true;
  call('paquete_validar', payload).then(function(r){
    var d = r.data;
    // Si el contenido cambió desde la revisión anterior, es otra operación (y se aplica lo que se ve ahora).
    if (PQ.huella && PQ.huella !== d.huella) PQ.op = opId();
    PQ.huella = d.huella;
    var total = PQ.paquete ? PQ.paquete.operaciones.length : null;
    var h = '<div class="block"><h3>' + esc(d.fuente) + '</h3><p class="s" style="margin:0;color:var(--acero)">' + (PQ.archivo ? 'Bandeja: ' + esc(PQ.archivo.nombre) + ' · ' : '') + (d.autor_ia ? 'Armado por ' + esc(d.autor_ia) + ' · ' : '') + d.resultados.length + (total ? ' de ' + total : '') + ' operaciones revisadas</p></div>';
    if (!d.valido) h += '<div class="block" style="border-color:var(--freno)"><h3 style="color:var(--freno)">No se puede aplicar</h3><p style="margin:0">' + esc(d.error.message) + '</p><p class="s" style="margin:8px 0 0;color:var(--acero)">Pídele a la IA que corrija esa operación y vuelve a pegar el paquete.</p></div>';
    if (d.dudas && d.dudas.length) h += '<div class="block" style="border-color:#E9C46A;background:#FFF6DD"><h3>Dudas que dejó la IA</h3><ul style="margin:0;padding-left:18px">' + d.dudas.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
    var nuevos = d.resultados.filter(function(x){ return x.resultado === 'Nuevo'; }).length;
    if (d.resultados.length) h += '<div class="list">' + d.resultados.map(function(x){
      var chip = x.resultado === 'Nuevo' ? '<span class="chip ok">Nuevo</span>' : '<span class="chip">Ya existe · ' + esc(x.codigo) + '</span>';
      var av = (x.avisos || []).map(function(w){ return '<div class="s" style="color:var(--senal-osc);margin-top:4px">' + esc(w.message) + '</div>'; }).join('');
      return '<div class="item" style="cursor:default"><div class="body"><div class="t">' + x.n + '. ' + esc(NOMBRES[x.tabla] || x.tabla) + '</div><div class="s">' + esc(x.etiqueta) + '</div><div class="chips">' + chip + '</div>' + av + '</div></div>';
    }).join('') + '</div>';
    h += '<div class="inline" style="flex-wrap:wrap;margin-top:12px">' + (d.valido ? '<button class="btn go" data-act="pq-aplicar">Aplicar paquete (' + nuevos + ' nuevos)</button>' : '') + '<button class="btn ghost" data-act="pq-abrir">Volver</button></div>';
    if (PQ.archivo) h += '<div class="block" style="margin-top:12px"><label class="f"><span>Si no corresponde, descártalo (queda marcado en Drive)</span><input class="i" id="pqMotivo" placeholder="Motivo, ej. duplicado o datos equivocados"></label><button class="btn danger" data-act="pq-descartar">Descartar archivo</button></div>';
    abrirHoja('Vista previa', h);
  }).catch(function(){ btn.disabled = false; });
}
function aplicarPaquete(btn){
  if (!PQ.paquete && !PQ.archivo) return;
  btn.disabled = true;
  call('paquete_aplicar', PQ.archivo ? { archivo_id: PQ.archivo.id, op_id: PQ.op, huella: PQ.huella } : { paquete: PQ.paquete, op_id: PQ.op, huella: PQ.huella }).then(function(r){
    toast('Paquete ' + r.data.codigo + ' aplicado: ' + r.data.nuevos + ' registro(s) nuevo(s).');
    PQ = { texto:'', paquete:null, op:null, archivo:null };
    cerrarHoja(); D.refs = {}; if (S.tab === 'datos') { cargarDatos(); contarBandeja(); } return cargar();
  }).catch(function(){ btn.disabled = false; });
}

  else if (a === 'cli-control'){ D.cliente = id; mostrarControl(); }
  else if (a === 'cerrar-hoja') cerrarHoja();
  else if (a === 'iniciar') iniciar(id, el);
  else if (a === 'pausar') pedirPausa();
  else if (a === 'pausa-motivo') cerrarSesion(el.getAttribute('data-m'));
  else if (a === 'terminar') cerrarSesion(null);
  else if (a === 'dictar') dictar();
  else if (a === 'guardar-detalle') guardarDetalle(id, el);
  else if (a === 'guardar-pendiente') guardarPendiente(id, el.getAttribute('data-eq'), el);
  else if (a === 'revisar'){
    el.disabled = true;
    call('aporte_revisar', { tabla: el.getAttribute('data-t'), id: id, version: Number(el.getAttribute('data-v')), decision: el.getAttribute('data-d'), op_id: opId() })
      .then(function(){ toast(el.getAttribute('data-d') === 'Aprobado' ? 'Aporte aprobado.' : 'Aporte rechazado.'); renderRevisar(); }).catch(function(){ el.disabled = false; });
  }
  else if (a === 'dt-nuevo') abrirFormulario(null);
  else if (a === 'dt-editar') abrirFormulario(D.filas.filter(function(x){ return x.id === id; })[0]);
  else if (a === 'dt-guardar') guardarFormulario(el);
  else if (a === 'dt-control') mostrarControl();
  else if (a === 'dt-stock') mostrarStock();
  else if (a === 'dt-integridad') mostrarIntegridad();
  else if (a === 'dt-anular'){
    var motivo = $('fxMotivo') ? $('fxMotivo').value.trim() : '';
    if (!motivo) { toast('Escribe el motivo en el campo "Motivo" antes de anular.', 'err'); if ($('fxMotivo')) $('fxMotivo').focus(); return; }
    call('anular', { tabla: D.tabla, id: id, version: Number(el.getAttribute('data-v')), motivo: motivo, fuente: $('fxFuente') ? $('fxFuente').value.trim() : '', op_id: opId() }).then(function(){ toast('Registro anulado.'); cerrarHoja(); D.refs = {}; cargarDatos(); return cargar(); }).catch(function(){});
  }
  else if (a === 'dt-confirmar'){
    var evid = $('fx_evidencia') ? $('fx_evidencia').value.trim() : '';
    if (!evid) { toast('Indica la evidencia (guía, factura o foto) antes de confirmar.', 'err'); if ($('fx_evidencia')) $('fx_evidencia').focus(); return; }
    call('recepcion_confirmar', { recepcion_id: id, version: Number(el.getAttribute('data-v')), evidencia: evid, op_id: opId() }).then(function(){ toast('Recepción confirmada: entró al inventario.'); cerrarHoja(); cargarDatos(); }).catch(function(){});
  }
  else if (a === 'dt-cobrar-mo'){
    call('listar', { tabla: 'SESIONES', filtro: { trabajo_id: id, estado: 'Cerrada' } }).then(function(r){
      var libres = r.data.filter(function(x){ return !x.concepto_id; });
      if (!libres.length) return toast('No hay sesiones cerradas sin cobrar en este trabajo.', 'err');
      return call('concepto_desde_sesiones', { trabajo_id: id, sesion_ids: libres.map(function(x){ return x.id; }), usar_trabajados: true, op_id: opId() })
        .then(function(c){ toast('Cobro ' + c.data.codigo + ' creado como Cotizado por $' + Number(c.data.monto_cliente).toLocaleString('es-CL') + '. Revísalo y confírmalo.'); cerrarHoja(); });
    }).catch(function(){});
  }
  else if (a === 'pq-abrir') abrirPaquete();
  else if (a === 'pq-limpiar'){ PQ = { texto:'', paquete:null, op:null, archivo:null }; $('pqTexto').value = ''; $('pqTexto').focus(); }
  else if (a === 'pq-archivo') validarPaquete(el, { id: id, nombre: el.getAttribute('data-n') });
  else if (a === 'pq-descartar'){
    var mot = $('pqMotivo') ? $('pqMotivo').value.trim() : '';
    if (!mot) { toast('Escribe el motivo antes de descartar.', 'err'); if ($('pqMotivo')) $('pqMotivo').focus(); return; }
    el.disabled = true;
    call('bandeja_descartar', { archivo_id: PQ.archivo.id, motivo: mot }).then(function(){ toast('Archivo descartado.'); PQ = { texto:'', paquete:null, op:null, archivo:null }; abrirPaquete(); contarBandeja(); }).catch(function(){ el.disabled = false; });
  }
  else if (a === 'pq-validar') validarPaquete(el);
  else if (a === 'pq-aplicar') aplicarPaquete(el);
  else if (a === 'acceso-salir') salir(false, el);
  else if (a === 'acceso-salir-todo') salir(true, el);
  else if (a === 'reintentar') arrancar();
  else if (a === 'demo-user'){ DemoApi.login(el.getAttribute('data-u')); S.tab = 'trabajos'; cargar(); }
});
