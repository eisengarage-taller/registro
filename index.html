    rows_(ctx, table).forEach(function (r) {
      var etiqueta = table + ' ' + (r.codigo || r.id);
      if (ids[r.id]) problemas.push(etiqueta + ': id repetido');
      ids[r.id] = true;
      if (r.codigo && codigos[r.codigo]) problemas.push(etiqueta + ': código repetido');
      codigos[r.codigo] = true;
      if (r.anulado === true) return;
      CONTRACT.tables[table].columns.forEach(function (c) {
        var val = r[c.k];
        if (c.req && !c.calc && isEmpty_(val)) problemas.push(etiqueta + ': falta ' + c.k);
        if (isEmpty_(val)) return;
        if (c.t === 'enum' && CONTRACT.enums[c.e].indexOf(val) < 0) problemas.push(etiqueta + ': ' + c.k + ' "' + val + '" no es válido');
        if (c.t === 'ref') {
          var t = getRow_(ctx, c.ref, val);
          if (!t) problemas.push(etiqueta + ': ' + c.k + ' apunta a un registro inexistente');
          else if (t.anulado === true) problemas.push(etiqueta + ': ' + c.k + ' apunta a un registro anulado');
        }
        if (c.t === 'lista' && !activeRows_(ctx, 'LISTAS').some(function (l) { return l.lista === c.l && l.valor === val; })) problemas.push(etiqueta + ': ' + c.k + ' "' + val + '" no está en LISTAS');
      });
    });
  });
  return problemas;
}

/* ───────────────────────── paquete IA ───────────────────────── */
/*
 * Una IA (Claude o GPT) convierte un dictado o informe en un paquete de operaciones (formato EG-PAQUETE-1).
 * La IA no escribe en la base: la persona pega el paquete en la app, ve la vista previa (paquete_validar)
 * y lo confirma (paquete_aplicar). Todo pasa por las mismas reglas que la pantalla y se guarda junto o nada.
 *
 * { formato: 'EG-PAQUETE-1', fuente, autor_ia, texto_original, dudas: [..], operaciones: [
 *     { ref: 'cliente', tabla: 'CLIENTES', buscar: { nombre: '…' }, datos: { … } },
 *     { ref: 'equipo',  tabla: 'EQUIPOS',  buscar: { patente: 'KFDG29' }, datos: { cliente_id: '@cliente', … } },
 *     { tabla: 'SESIONES', accion: 'sesion_posterior', datos: { trabajo_id: '@trabajo', usuario_id: '@yo', … } } ] }
 *
 * Valores especiales en datos y buscar: '@ref' (id de una operación anterior), '@yo' (quien aplica),
 * '@usuario:correo o nombre' (un usuario activo).
 * buscar: si hay exactamente un registro vigente que calza, se reutiliza (no se crea ni se modifica);
 * si no hay, se crea; si hay varios, se detiene (AMBIGUO). Las ediciones de registros existentes se hacen en la app.
 */

var PAQUETE_FORMATO = 'EG-PAQUETE-1';
var PAQUETE_MAX_OPS = 200;
var PAQUETE_MAX_TEXTO = 40000;
var PAQUETE_TABLAS_PROHIBIDAS = ['USUARIOS', 'TARIFAS', 'VALORES_TRABAJADOR', 'RECTIFICACIONES', 'PAQUETES', 'CUENTAS_COBRO'];
var PAQUETE_ACCIONES = ['crear', 'sesion_posterior', 'editar'];
/** Tablas que un paquete no corrige (tienen su propio flujo en la app). */
var PAQUETE_EDITAR_PROHIBIDAS = ['SESIONES', 'IMPUTACIONES', 'RECEPCIONES', 'MOV_INVENTARIO', 'LISTAS', 'CAPTURAS'];
var PAQUETE_MAX_CAPTURAS = 50;
/** Columnas que una IA nunca carga, aunque la tabla se pueda cargar: la autorización del dueño para publicar su historial la registra una persona en la app. */
function paqueteMotivoProhibida_(tabla) { return tabla === 'EQUIPOS' ? 'la autorización del historial se registra en la app' : tabla === 'CLIENTES' ? 'el portal del cliente se publica en la app' : 'el estado del presupuesto cambia con Publicar o Confirmar en la app'; }
function paqueteColumnaProhibida_(tabla, k) { return (tabla === 'EQUIPOS' && /^historial_/.test(String(k))) || (tabla === 'CLIENTES' && /^portal_/.test(String(k))) || (tabla === 'PRESUPUESTOS' && k === 'estado'); }

/** Revisa la forma del paquete antes de tocar datos. */
function paqueteForma_(pq) {
  if (!pq || typeof pq !== 'object' || Array.isArray(pq)) fail_('PAQUETE', 'El paquete no es un objeto JSON.');
  if (pq.formato !== PAQUETE_FORMATO) fail_('PAQUETE', 'Formato desconocido: se espera "' + PAQUETE_FORMATO + '".');
  if (isEmpty_(pq.fuente)) fail_('PAQUETE', 'Falta "fuente": de dónde viene la información.');
  var ops = pq.operaciones;
  if (!Array.isArray(ops) || !ops.length) fail_('PAQUETE', 'El paquete no trae operaciones.');
  if (pq.capturas !== undefined) {
    if (!Array.isArray(pq.capturas) || pq.capturas.some(function (c) { return typeof c !== 'string' || !/^CP-\d{4,}$/.test(c); })) fail_('PAQUETE', '"capturas" debe ser una lista de códigos (ej. ["CP-0003"]).');
    if (pq.capturas.length > PAQUETE_MAX_CAPTURAS) fail_('PAQUETE', 'Demasiadas capturas en un paquete (máximo ' + PAQUETE_MAX_CAPTURAS + ').');
  }
  if (ops.length > PAQUETE_MAX_OPS) fail_('PAQUETE', 'Demasiadas operaciones (' + ops.length + '). Máximo ' + PAQUETE_MAX_OPS + ': divide el paquete.');
  var refs = {};
  ops.forEach(function (o, i) {
    var n = 'Operación ' + (i + 1);
    if (!o || typeof o !== 'object') fail_('PAQUETE', n + ': no es un objeto.');
    Object.keys(o).forEach(function (k) { if (['ref', 'tabla', 'accion', 'buscar', 'datos', 'nota', 'cambios', 'esperado', 'motivo'].indexOf(k) < 0) fail_('PAQUETE', n + ': clave desconocida "' + k + '".'); });
    if (!CONTRACT.tables[o.tabla]) fail_('PAQUETE', n + ': tabla desconocida "' + o.tabla + '".');
    if (PAQUETE_TABLAS_PROHIBIDAS.indexOf(o.tabla) >= 0) fail_('PAQUETE', n + ': ' + o.tabla + ' no se carga desde un paquete. Se hace en la app.');
    var acc = o.accion || 'crear';
    if (PAQUETE_ACCIONES.indexOf(acc) < 0) fail_('PAQUETE', n + ': acción "' + acc + '" no permitida (crear, sesion_posterior o editar).');
    if (acc === 'editar') {
      // Corrección de un registro existente: se ubica por "buscar" (idealmente por código), se comprueba "esperado" y se cambia solo "cambios".
      if (PAQUETE_EDITAR_PROHIBIDAS.indexOf(o.tabla) >= 0) fail_('PAQUETE', n + ': ' + o.tabla + ' no se corrige desde un paquete. Se hace en la app.');
      if (!o.buscar || typeof o.buscar !== 'object' || Array.isArray(o.buscar) || !Object.keys(o.buscar).length) fail_('PAQUETE', n + ': "editar" necesita "buscar" (por ejemplo {"codigo": "PD-0012"}).');
      if (o.datos !== undefined) fail_('PAQUETE', n + ': "editar" usa "cambios", no "datos".');
      if (!o.cambios || typeof o.cambios !== 'object' || Array.isArray(o.cambios) || !Object.keys(o.cambios).length) fail_('PAQUETE', n + ': "editar" necesita "cambios" con al menos un campo.');
      if (o.esperado !== undefined && (typeof o.esperado !== 'object' || Array.isArray(o.esperado))) fail_('PAQUETE', n + ': "esperado" debe ser un objeto.');
      if (isEmpty_(o.motivo) || String(o.motivo).trim().length < 4) fail_('PAQUETE', n + ': "editar" necesita "motivo" (por qué se corrige).');
      var colsE = colMap_(o.tabla);
      Object.keys(o.cambios).forEach(function (k) {
        if (paqueteColumnaProhibida_(o.tabla, k)) fail_('PAQUETE', n + ': ' + o.tabla + '.' + k + ' no se cambia desde un paquete (' + paqueteMotivoProhibida_(o.tabla) + ').');
        if (!colsE[k]) fail_('PAQUETE', n + ': ' + o.tabla + ' no tiene la columna "' + k + '".');
        if (colsE[k].calc || CONTRACT.technicalColumns.some(function (t) { return t.k === k; })) fail_('PAQUETE', n + ': ' + o.tabla + '.' + k + ' lo llena el sistema; no se cambia desde un paquete.');
      });
    } else if (o.cambios !== undefined || o.esperado !== undefined || o.motivo !== undefined) fail_('PAQUETE', n + ': "cambios", "esperado" y "motivo" son solo para la acción "editar".');
    if (acc === 'sesion_posterior' && o.tabla !== 'SESIONES') fail_('PAQUETE', n + ': sesion_posterior es solo para SESIONES.');
    if (acc === 'crear' && o.tabla === 'SESIONES') fail_('PAQUETE', n + ': las sesiones se cargan con accion "sesion_posterior".');
    if (acc === 'sesion_posterior' && o.buscar) fail_('PAQUETE', n + ': una sesión no lleva "buscar".');
    if (o.buscar !== undefined && (typeof o.buscar !== 'object' || Array.isArray(o.buscar) || !Object.keys(o.buscar).length)) fail_('PAQUETE', n + ': "buscar" debe ser un objeto con al menos un campo.');
    if (o.datos !== undefined && (typeof o.datos !== 'object' || Array.isArray(o.datos))) fail_('PAQUETE', n + ': "datos" debe ser un objeto.');
    if (!o.buscar && !o.datos && acc !== 'editar') fail_('PAQUETE', n + ': falta "datos".');
    [o.datos, o.buscar, o.esperado].forEach(function (obj) {
      Object.keys(obj || {}).forEach(function (k) { if (paqueteColumnaProhibida_(o.tabla, k)) fail_('PAQUETE', n + ': ' + o.tabla + '.' + k + ' no se carga desde un paquete (' + paqueteMotivoProhibida_(o.tabla) + ').'); });
    });
    if (!isEmpty_(o.ref)) {
      if (!/^[A-Za-z][A-Za-z0-9_]{0,40}$/.test(String(o.ref))) fail_('PAQUETE', n + ': ref "' + o.ref + '" no válida (letras, números y _).');
      if (refs[o.ref]) fail_('PAQUETE', n + ': ref "' + o.ref + '" repetida.');
      refs[o.ref] = true;
    }
  });
}

/** Reemplaza '@ref', '@yo' y '@usuario:…' por ids reales. */
function paqueteValor_(ctx, v, ids, n) {
  if (typeof v !== 'string' || v.charAt(0) !== '@') return v;
  if (v === '@yo') return ctx.user.id;
  if (v.indexOf('@usuario:') === 0) {
    var q = normTxt_(v.slice(9));
    var us = activeRows_(ctx, 'USUARIOS').filter(function (u) { return u.activo === true && (normTxt_(u.correo) === q || normTxt_(u.nombre) === q); });
    if (us.length !== 1) fail_('PAQUETE', n + ': ' + (us.length ? 'hay varios usuarios' : 'no hay un usuario activo') + ' que calce con "' + v.slice(9) + '".');
    return us[0].id;
  }
  var ref = v.slice(1);
  if (!ids[ref]) fail_('PAQUETE', n + ': "' + v + '" no corresponde a una operación anterior del paquete.');
  return ids[ref];
}

function paqueteResolver_(ctx, obj, ids, n) {
  var out = {};
  Object.keys(obj || {}).forEach(function (k) { out[k] = paqueteValor_(ctx, obj[k], ids, n); });
  return out;
}

/** Registros vigentes que calzan con buscar. Patente y VIN se comparan normalizados; textos sin tildes ni mayúsculas. */
function paqueteBuscar_(ctx, tabla, buscar, n) {
  var cols = colMap_(tabla);
  Object.keys(buscar).forEach(function (k) { if (!cols[k] && k !== 'codigo') fail_('PAQUETE', n + ': ' + tabla + ' no tiene la columna "' + k + '" para buscar.'); });
  return activeRows_(ctx, tabla).filter(function (r) {
    return Object.keys(buscar).every(function (k) {
      var want = buscar[k], have = r[k];
      if (isEmpty_(want)) return isEmpty_(have);
      if (tabla === 'EQUIPOS' && (k === 'patente' || k === 'vin')) return normPlate_(have) === normPlate_(want) && normPlate_(want) !== '';
      if (k === 'codigo') return String(have).replace(/^EG-/, '') === String(want).replace(/^EG-/, '');
      var c = cols[k];
      if (c && (c.t === 'ref' || c.t === 'enum' || c.t === 'bool' || c.t === 'int' || c.t === 'num' || c.t === 'money')) return String(have) === String(want);
      return normTxt_(have) === normTxt_(want);
    });
  });
}

/** Etiqueta corta para la vista previa. */
function paqueteEtiqueta_(tabla, r) {
  var k = ['nombre_corto', 'nombre', 'descripcion', 'titulo', 'articulo', 'componente', 'valor'].filter(function (c) { return !isEmpty_(r[c]); })[0];
  var t = k ? String(r[k]) : '';
  if (tabla === 'SESIONES') t = (r.actividad || 'Sesión') + ' · ' + (r.duracion_min || '') + ' min · ' + r.fecha;
  if (tabla === 'CONCEPTOS' || tabla === 'PAGOS' || tabla === 'IMPUTACIONES') t = (t ? t + ' · ' : '') + '$' + String(r.monto_cliente !== undefined && r.monto_cliente !== '' ? r.monto_cliente : r.monto).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return t.length > 90 ? t.slice(0, 87) + '…' : t;
}

/** Igualdad para comparar "esperado" con la base: números por valor, textos sin tildes ni mayúsculas, patentes normalizadas. */
function paqueteMismoValor_(tabla, c, k, a, b) {
  if (isEmpty_(a) && isEmpty_(b)) return true;
  if (isEmpty_(a) !== isEmpty_(b)) return false;
  if (tabla === 'EQUIPOS' && (k === 'patente' || k === 'vin')) return normPlate_(a) === normPlate_(b);
  if (c && (c.t === 'int' || c.t === 'num' || c.t === 'money')) return Number(a) === Number(b);
  if (c && c.t === 'bool') return String(a) === String(b);
  // P-9: un campo con hora se compara por el instante completo; uno solo de fecha, por el día.
  if (c && c.t === 'datetime') { var ma = toMs_(a), mb = toMs_(b); return ma === null || mb === null ? String(a) === String(b) : ma === mb; }
  if (c && c.t === 'date') return String(a).slice(0, 10) === String(b).slice(0, 10);
  return normTxt_(a) === normTxt_(b);
}

/** IA4 (1.7): corrige un registro existente. Queda en RECTIFICACIONES con el motivo y la fuente del paquete. */
function paqueteEditar_(ctx, pq, o, ids, n, opId) {
  var buscar = paqueteResolver_(ctx, o.buscar, ids, n);
  var hall = paqueteBuscar_(ctx, o.tabla, buscar, n);
  if (!hall.length) fail_('NO_EXISTE', n + ': no hay un registro de ' + o.tabla + ' que calce con ' + JSON.stringify(o.buscar) + '.');
  if (hall.length > 1) fail_('AMBIGUO', n + ': hay ' + hall.length + ' registros que calzan (' + hall.map(function (r) { return r.codigo; }).join(', ') + '). Usa el código.');
  var ex = hall[0], cols = colMap_(o.tabla);
  // Ya aplicada en un reintento con la misma operación: no se repite.
  if (opId && ex.ultima_op === opId) return { tabla: o.tabla, accion: 'editar', resultado: 'Ya aplicado', row: ex, avisos: [] };
  var esperado = paqueteResolver_(ctx, o.esperado || {}, ids, n), dif = [];
  Object.keys(esperado).forEach(function (k) {
    if (!cols[k] && k !== 'codigo') fail_('PAQUETE', n + ': ' + o.tabla + ' no tiene la columna "' + k + '" en "esperado".');
    if (!paqueteMismoValor_(o.tabla, cols[k], k, ex[k], esperado[k])) dif.push(k + ': la IA esperaba "' + esperado[k] + '" y en la base hay "' + (isEmpty_(ex[k]) ? '' : ex[k]) + '"');
  });
  if (dif.length) fail_('CAMBIO_PREVIO', n + ': ' + ex.codigo + ' cambió desde que se armó el paquete (' + dif.join('; ') + '). Actualiza el contexto y vuelve a pedir el paquete.');
  var cambios = paqueteResolver_(ctx, o.cambios, ids, n), efectivos = {}, lista = [];
  Object.keys(cambios).forEach(function (k) {
    if (paqueteMismoValor_(o.tabla, cols[k], k, ex[k], cambios[k])) return;
    efectivos[k] = cambios[k];
    lista.push(k + ': "' + (isEmpty_(ex[k]) ? '' : ex[k]) + '" → "' + (isEmpty_(cambios[k]) ? '' : cambios[k]) + '"');
  });
  if (!lista.length) return { tabla: o.tabla, accion: 'editar', resultado: 'Sin cambios', row: ex, avisos: [{ code: 'SIN_CAMBIOS', message: ex.codigo + ' ya tenía esos valores; no se modifica.' }] };
  var fuente = ('Paquete IA · ' + String(pq.fuente)).slice(0, 300);
  var r = updateRow_(ctx, o.tabla, ex.id, null, efectivos, { opId: opId, motivo: String(o.motivo).slice(0, 500), fuente: fuente, skipVersion: true });
  return { tabla: o.tabla, accion: 'editar', resultado: 'Modificado', row: r.row, avisos: [{ code: 'CAMBIO', message: 'Corrige ' + ex.codigo + ': ' + lista.join('; ') + '. Motivo: ' + o.motivo }].concat(r.warnings || []) };
}

/* ───────── 1.8: posibles duplicados y decisiones de la vista previa ─────────
 * Un cliente, contacto o vehículo NUEVO que se parece a uno existente no se crea a ciegas: la vista previa lo muestra
 * con sus parecidos y hay que decidir ("es otro, crear nuevo" o "es este código"). Las correcciones ("editar") y las
 * opciones nuevas de lista también se confirman una por una. Sin esas decisiones, el paquete no se aplica.
 */
var PARECIDO_IGNORAR = ['de', 'del', 'la', 'las', 'los', 'el', 'y', 'e', 'da', 'do', 'spa', 'ltda', 'limitada', 'sa', 'eirl', 'cia', 'compania', 'sociedad', 'soc', 'comercial', 'servicios', 'empresa', 'empresas', 'hijo', 'hijos', 'hnos', 'hermanos', 'repuestos', 'repuesto', 'automotriz', 'automotora', 'autopartes', 'accesorios', 'lubricantes', 'distribuidora', 'importadora'];
var PAQUETE_DECISION_TABLAS = ['CLIENTES', 'CONTACTOS', 'EQUIPOS', 'PROVEEDORES'];
function tokensNombre_(s) {
  return normTxt_(s).replace(/[^a-z0-9 ]/g, ' ').split(' ').filter(function (t) { return t.length >= 2 && PARECIDO_IGNORAR.indexOf(t) < 0; });
}
/** Distancia de edición (solo importa si es 0, 1 o más). */
function distancia_(a, b) {
  if (a === b) return 0;
  if (Math.abs(a.length - b.length) > 1) return 2;
  var prev = [], i, j;
  for (j = 0; j <= b.length; j++) prev[j] = j;
  for (i = 1; i <= a.length; i++) {
    var cur = [i];
    for (j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
function tokenParecido_(a, b) { return a === b || (Math.min(a.length, b.length) >= 5 && distancia_(a, b) <= 1); }
/** Dos nombres se parecen si comparten dos palabras (ej. "Álvaro Núñez" y "Álvaro Antonio Núñez Cornejo"), o la única palabra de uno. */
function nombreParecido_(a, b) {
  if (isEmpty_(a) || isEmpty_(b)) return false;
  if (normTxt_(a) === normTxt_(b)) return true;
  var ta = tokensNombre_(a), tb = tokensNombre_(b);
  var comunes = ta.filter(function (x) { return tb.some(function (y) { return tokenParecido_(x, y); }); });
  if (comunes.length >= 2) return true;
  return comunes.length === 1 && comunes[0].length >= 4 && (ta.length === 1 || tb.length === 1);
}
function rutNorm_(r) { var x = String(r == null ? '' : r).toUpperCase().replace(/[^0-9K]/g, ''); return x.length >= 7 ? x : ''; }

/** Registros existentes parecidos a uno nuevo. elegible = se puede usar en su lugar (misma tabla y, si aplica, mismo cliente). */
function paqueteParecidos_(ctx, tabla, datos, excluir) {
  var out = [], vistos = {}, nomCli = {};
  rows_(ctx, 'CLIENTES').forEach(function (c) { nomCli[c.id] = c.nombre; });
  var add = function (t, r, motivo, elegible, etiqueta) {
    if (excluir[r.id] || vistos[r.id]) return;
    vistos[r.id] = true;
    out.push({ tabla: t, id: r.id, codigo: r.codigo, etiqueta: etiqueta, motivo: motivo, elegible: !!elegible });
  };
  if (tabla === 'CLIENTES' || tabla === 'CONTACTOS') {
    var nom = datos.nombre, rut = rutNorm_(datos.rut);
    activeRows_(ctx, 'CLIENTES').forEach(function (c) { if (nombreParecido_(nom, c.nombre)) add('CLIENTES', c, 'nombre parecido', tabla === 'CLIENTES', 'Cliente ' + c.nombre); });
    activeRows_(ctx, 'CONTACTOS').forEach(function (k) {
      var porRut = rut && rutNorm_(k.rut) === rut;
      if (porRut || nombreParecido_(nom, k.nombre)) add('CONTACTOS', k, porRut ? 'mismo RUT' : 'nombre parecido', tabla === 'CONTACTOS' && k.cliente_id === datos.cliente_id, 'Contacto ' + k.nombre + ' (de ' + (nomCli[k.cliente_id] || 'otro cliente') + ')');
    });
  }
  if (tabla === 'PROVEEDORES') {
    activeRows_(ctx, 'PROVEEDORES').forEach(function (x) { if (nombreParecido_(datos.nombre, x.nombre)) add('PROVEEDORES', x, 'nombre parecido', true, 'Proveedor ' + x.nombre + (x.sucursal ? ' (' + x.sucursal + ')' : '')); });
  }
  if (tabla === 'EQUIPOS') {
    var p = normPlate_(datos.patente), v = normPlate_(datos.vin);
    activeRows_(ctx, 'EQUIPOS').forEach(function (e) {
      var ep = e.patente_busqueda || normPlate_(e.patente), m = '';
      if (p && ep === p) m = 'misma patente';
      else if (v && normPlate_(e.vin) === v) m = 'mismo VIN';
      else if (p.length >= 5 && ep.length >= 5 && distancia_(p, ep) <= 1) m = 'patente parecida';
      if (m) add('EQUIPOS', e, m, e.cliente_id === datos.cliente_id, e.nombre_corto + (e.patente ? ' · ' + e.patente : '') + ' (de ' + (nomCli[e.cliente_id] || 'otro cliente') + ')');
    });
  }
  return out;
}

/**
 * Decisiones de la vista previa: { "3": "nuevo" | "ok" | "C-0004" }. Un código cambia esa operación por "usar el existente"
 * (buscar por código); "nuevo" confirma que es otro; "ok" confirma una corrección u opción de lista. Devuelve el paquete ajustado.
 */
function paqueteDecisiones_(pq, dec) {
  if (dec === undefined || dec === null) return { pq: pq, dec: {} };
  if (typeof dec !== 'object' || Array.isArray(dec)) fail_('PAQUETE', '"decisiones" debe ser un objeto.');
  var copia = clone_(pq), limpio = {}, cambia = false;
  Object.keys(dec).forEach(function (k) {
    var i = Number(k), v = String(dec[k] == null ? '' : dec[k]).trim(), o = copia.operaciones[i - 1];
    if (!(i >= 1) || Math.floor(i) !== i || !o) fail_('PAQUETE', 'Hay una decisión para una operación que no existe (' + k + ').');
    if (v === 'nuevo' || v === 'ok') { limpio[String(i)] = v; return; }
    if (!/^(EG-)?[A-Z]{1,3}-\d{1,6}$/i.test(v)) fail_('PAQUETE', 'Operación ' + i + ': decisión no válida "' + v + '" (usa nuevo, ok o un código).');
    if ((o.accion || 'crear') !== 'crear' || PAQUETE_DECISION_TABLAS.indexOf(o.tabla) < 0) fail_('PAQUETE', 'Operación ' + i + ': solo un cliente, contacto, vehículo o proveedor nuevo se puede cambiar por uno existente.');
    o.buscar = { codigo: v.toUpperCase() };
    limpio[String(i)] = v.toUpperCase();
    cambia = true;
  });
  return { pq: cambia ? copia : pq, dec: limpio };
}

/** Lo que falta decidir en la vista previa: [{ n, requiere }]. */
function paqueteFaltan_(resultados) {
  return resultados.filter(function (x) { return x.requiere && !x.decidido; }).map(function (x) { return { n: x.n, requiere: x.requiere }; });
}

/**
 * Ejecuta las operaciones sobre ctx.store (una TxStore: nada se guarda hasta el commit).
 * Devuelve { resultados: [{ n, tabla, accion, resultado: 'Nuevo'|'Existente', codigo, id, etiqueta, avisos }], avisos }.
 */
function paqueteEjecutar_(ctx, pq, baseOp, parcial, decisiones) {
  var ids = {}, resultados = parcial || [], avisosGlobales = [], creados = {}, dec = decisiones || {};
  pq.operaciones.forEach(function (o, i) {
    var n = 'Operación ' + (i + 1) + ' (' + o.tabla + (o.ref ? ' ' + o.ref : '') + ')';
    var acc = o.accion || 'crear';
    var opId = baseOp ? baseOp + '#' + (i + 1) : '';
    var res;
    try {
      var datos = paqueteResolver_(ctx, o.datos, ids, n);
      var previo = opId && acc !== 'editar' ? findByOp_(ctx, o.tabla, opId) : null;
      if (acc === 'editar') {
        res = paqueteEditar_(ctx, pq, o, ids, n, opId);
      } else if (previo) {
        res = { tabla: o.tabla, accion: acc, resultado: 'Ya aplicado', row: previo, avisos: [] };
      } else if (o.buscar) {
        var buscar = paqueteResolver_(ctx, o.buscar, ids, n);
        var hall = paqueteBuscar_(ctx, o.tabla, buscar, n);
        if (hall.length > 1) fail_('AMBIGUO', n + ': hay ' + hall.length + ' registros que calzan (' + hall.map(function (r) { return r.codigo; }).join(', ') + '). Precisa la búsqueda o usa el código.');
        // Buscar por código es "usar ese registro": si no existe, no se crea otro con ese nombre.
        if (!hall.length && !isEmpty_(buscar.codigo)) fail_('NO_EXISTE', n + ': no hay un registro vigente de ' + o.tabla + ' con el código ' + buscar.codigo + '. Revisa el código.');
        if (hall.length === 1) {
          var ex = hall[0], dif = [];
          Object.keys(datos).forEach(function (k) {
            if (isEmpty_(datos[k]) || isEmpty_(ex[k])) return;
            var a = String(ex[k]), b = String(datos[k]);
            if (a !== b && normTxt_(a) !== normTxt_(b) && !(o.tabla === 'EQUIPOS' && (k === 'patente' || k === 'vin') && normPlate_(a) === normPlate_(b))) dif.push(k + ': en la base "' + a + '", en el paquete "' + b + '"');
          });
          res = { tabla: o.tabla, accion: 'reutilizar', resultado: 'Existente', row: ex, avisos: dif.length ? [{ code: 'DIFERENCIA', message: 'Ya existía ' + ex.codigo + '. No se modificó. Diferencias: ' + dif.join('; ') + '. Si corresponde, corrígelo en la app.' }] : [] };
        }
        if (!res) Object.keys(buscar).forEach(function (k) { if (k !== 'codigo' && isEmpty_(datos[k])) datos[k] = buscar[k]; });
      }
      if (!res && acc === 'crear') {
        var parecidos = PAQUETE_DECISION_TABLAS.indexOf(o.tabla) >= 0 ? paqueteParecidos_(ctx, o.tabla, datos, creados) : [];
        // 1.11: cobro en un trabajo con fecha aproximada: se permite solo si Víctor lo autoriza en la vista previa.
        var trAprox = o.tabla === 'CONCEPTOS' && !isEmpty_(datos.trabajo_id) ? getRow_(ctx, 'TRABAJOS', datos.trabajo_id) : null;
        var esAprox = !!(trAprox && trAprox.fecha_aproximada === true && datos.etapa !== 'Anulado');
        if (esAprox) ctx._autorizaAproximado = true;
        var c;
        try { c = insertRow_(ctx, o.tabla, datos, { opId: opId }); } finally { if (esAprox) ctx._autorizaAproximado = false; }
        var avisosC = c.warnings || [];
        if (parecidos.length) avisosC = avisosC.filter(function (w) { return w.code !== 'DUPLICADO_POSIBLE'; }).concat([{ code: 'POSIBLE_DUPLICADO', message: 'Se parece a: ' + parecidos.map(function (x) { return x.codigo + ' ' + x.etiqueta + ' (' + x.motivo + ')'; }).join('; ') + '. Decide si es otro o el mismo.' }]);
        res = { tabla: o.tabla, accion: acc, resultado: 'Nuevo', row: c.row, avisos: avisosC };
        if (parecidos.length) { res.requiere = 'duplicado'; res.candidatos = parecidos; res.decidido = dec[String(i + 1)] === 'nuevo'; }
        if (o.tabla === 'LISTAS') { res.requiere = 'lista'; res.decidido = dec[String(i + 1)] === 'ok'; }
        if (esAprox) { res.requiere = 'aproximado'; res.decidido = dec[String(i + 1)] === 'ok'; res.avisos = (res.avisos || []).concat([{ code: 'TRABAJO_APROXIMADO', message: 'Cobro en un trabajo del historial con fecha aproximada (' + trAprox.codigo + '): confírmalo solo si corresponde.' }]); }
        creados[c.row.id] = true;
      }
      if (!res && acc === 'sesion_posterior') {
        var sp = sesionPosterior_(ctx, Object.assign({}, datos, { op_id: opId }));
        res = { tabla: o.tabla, accion: acc, resultado: 'Nuevo', row: sp.data, avisos: sp.warnings };
      }
    } catch (e) {
      if (e && e.name === 'AppError') {
        var msg = e.message.indexOf('Operación ') === 0 ? e.message : n + ': ' + e.message;
        fail_(e.code, msg, Object.assign({ operacion: i + 1, tabla: o.tabla, ref: o.ref || '' }, e.details || {}));
      }
      throw e;
    }
    if (!isEmpty_(o.ref)) ids[o.ref] = res.row.id;
    if (res.resultado === 'Modificado') { res.requiere = 'correccion'; res.decidido = dec[String(i + 1)] === 'ok'; }
    var item = { n: i + 1, ref: o.ref || '', tabla: o.tabla, accion: res.accion, resultado: res.resultado, id: res.row.id, codigo: res.row.codigo, etiqueta: paqueteEtiqueta_(o.tabla, res.row), avisos: res.avisos || [] };
    if (res.requiere) { item.requiere = res.requiere; item.decidido = !!res.decidido; }
    if (res.candidatos) item.candidatos = res.candidatos;
    if (dec[String(i + 1)]) item.decision = dec[String(i + 1)];
    resultados.push(item);
  });
  return { resultados: resultados, avisos: avisosGlobales };
}

function paqueteTexto_(pq) {
  var t = isEmpty_(pq.texto_original) ? '' : String(pq.texto_original);
  return t.length > PAQUETE_MAX_TEXTO ? { texto: t.slice(0, PAQUETE_MAX_TEXTO), cortado: true } : { texto: t, cortado: false };
}

/** Huella del contenido del paquete (SHA-256 en Apps Script; en el modo demo del navegador, huella no criptográfica). */
function paqueteHuella_(pq) {
  var t = stableJson_(pq);
  try { return 'sha256:' + sha256hex_(t); } catch (e) { return 'h:' + hashTxt_(t); }
}

/** Vista previa: corre todo en una transacción que se descarta. No escribe nada. */
function paqueteValidar_(ctx, p) {
  requireAdmin_(ctx);
  paqueteForma_(p.paquete);
  var D = paqueteDecisiones_(p.paquete, p.decisiones), pq = D.pq;
  var tx = new TxStore(ctx.store);
  var c = {};
  Object.keys(ctx).forEach(function (k) { if (k !== '_assigned') c[k] = ctx[k]; });
  c.store = tx; c._tx = tx;
  var out = { valido: true, fuente: pq.fuente, autor_ia: pq.autor_ia || '', dudas: [].concat(pq.dudas || []), resultados: [], error: null, huella: paqueteHuella_(pq), decisiones: D.dec, faltan: [] };
  try {
    out.capturas = paqueteCapturas_(c, pq).map(function (x) { return { codigo: x.codigo, tipo: x.tipo, titulo: x.titulo || x.archivo_nombre || '', destino: x.destino || '' }; });
    paqueteEjecutar_(c, pq, '', out.resultados, D.dec);
    out.faltan = paqueteFaltan_(out.resultados);
  } catch (e) {
    if (!(e && e.name === 'AppError')) throw e;
    out.valido = false;
    out.error = { code: e.code, message: e.message, details: e.details };
  }
  var tt = paqueteTexto_(pq);
  var avisos = [];
  if (tt.cortado) avisos.push({ code: 'TEXTO_LARGO', message: 'El texto original supera ' + PAQUETE_MAX_TEXTO + ' caracteres: se guardará cortado.' });
  if (isEmpty_(pq.texto_original)) avisos.push({ code: 'SIN_TEXTO', message: 'El paquete no trae el texto original: quedará solo la fuente.' });
  return { data: out, warnings: avisos };
}

/** Aplica el paquete: todo junto o nada (la transacción la abre handle_). */
function paqueteAplicar_(ctx, p) {
  requireAdmin_(ctx);
  paqueteForma_(p.paquete);
  var D = paqueteDecisiones_(p.paquete, p.decisiones), pq = D.pq;
  // Lo que se aplica es exactamente lo que se revisó: la vista previa entrega la huella y aquí se exige igual.
  var huella = paqueteHuella_(pq);
  if (!isEmpty_(p.archivo_id) && isEmpty_(p.huella)) fail_('REQUERIDO', 'Falta la huella de la vista previa: revisa el paquete antes de aplicarlo.');
  if (!isEmpty_(p.huella) && String(p.huella) !== huella) fail_('PAQUETE_CAMBIO', 'El paquete cambió después de la vista previa. Revísalo de nuevo antes de aplicar.');
  var opPq = p.op_id + '#paquete';
  // Un archivo (o un mismo contenido) se aplica una sola vez, aunque no se haya podido marcar en Drive. Un reintento con el mismo op_id sí pasa.
  var previo = activeRows_(ctx, 'PAQUETES').filter(function (x) {
    return x.op_id !== opPq && ((!isEmpty_(p.archivo_id) && x.archivo_id === String(p.archivo_id)) || x.huella === huella);
  })[0];
  if (previo) fail_('YA_PROCESADO', (previo.archivo_id && previo.archivo_id === String(p.archivo_id) ? 'Este archivo' : 'Este mismo paquete') + ' ya se aplicó como ' + previo.codigo + '.', { codigo: previo.codigo, archivo_id: previo.archivo_id || '' });
  var capturas = paqueteCapturas_(ctx, pq);
  var r = paqueteEjecutar_(ctx, pq, p.op_id, null, D.dec);
  var faltan = paqueteFaltan_(r.resultados);
  if (faltan.length) {
    var txt = { duplicado: 'posible duplicado', correccion: 'corrección', lista: 'opción nueva de lista', aproximado: 'cobro en trabajo con fecha aproximada' };
    fail_('DECISION_REQUERIDA', 'Falta confirmar en la vista previa: ' + faltan.map(function (x) { return 'operación ' + x.n + ' (' + txt[x.requiere] + ')'; }).join(', ') + '.', { faltan: faltan });
  }
  var decTxt = Object.keys(D.dec).map(function (k) { return k + ' → ' + D.dec[k]; }).join('; ');
  var nuevos = r.resultados.filter(function (x) { return x.resultado === 'Nuevo'; }).length;
  var modificados = r.resultados.filter(function (x) { return x.resultado === 'Modificado'; }).length;
  var resumen = r.resultados.map(function (x) { return x.n + '. ' + x.tabla + ' ' + x.codigo + ' ' + x.resultado + (x.etiqueta ? ' · ' + x.etiqueta : ''); }).join('\n');
  var tt = paqueteTexto_(pq);
  var reg = findByOp_(ctx, 'PAQUETES', opPq) || insertSystem_(ctx, 'PAQUETES', {
    archivo_id: isEmpty_(p.archivo_id) ? '' : String(p.archivo_id), huella: huella,
    fuente: String(pq.fuente).slice(0, 500), autor_ia: String(pq.autor_ia || '').slice(0, 100), operaciones: pq.operaciones.length,
    resumen: resumen, dudas: [].concat(pq.dudas || []).join('\n'), texto_original: tt.texto,
    notas: 'Aplicado por ' + ctx.user.correo + '. ' + nuevos + ' registro(s) nuevo(s)' + (modificados ? ', ' + modificados + ' corregido(s)' : '') + '.' + (decTxt ? ' Decisiones: ' + decTxt + '.' : '') + (tt.cortado ? ' Texto original cortado.' : '') + (p.archivo_id ? ' Archivo de la Bandeja EG: ' + p.archivo_id + '.' : '')
  }, { opId: opPq });
  var avisos = [];
  r.resultados.forEach(function (x) { (x.avisos || []).forEach(function (w) { avisos.push({ code: w.code, message: 'Op. ' + x.n + ' ' + x.tabla + ': ' + w.message }); }); });
  // 1.13: las capturas de las que salió el paquete quedan Procesadas y ligadas a él.
  capturas.forEach(function (cp) { if (cp.estado !== 'Procesada' || cp.paquete_id !== reg.id) sysUpdate_(ctx, 'CAPTURAS', cp.id, { estado: 'Procesada', paquete_id: reg.id }, 'Procesada con el paquete ' + reg.codigo); });
  return { data: { id: reg.id, codigo: reg.codigo, resultados: r.resultados, nuevos: nuevos, modificados: modificados, capturas: capturas.map(function (x) { return x.codigo; }) }, warnings: avisos };
}

/**
 * 1.11: anular un cobro que ya tiene pagos imputados y dejar ese dinero a favor del cliente.
 * Lo pueden hacer Víctor y Victoria (administración), con motivo. Si el cobro está en una boleta o factura EMITIDA,
 * no se anula (primero nota de crédito). Si está en un documento "Por emitir", se saca de ese documento.
 * Se anulan solo las imputaciones de este cobro: el resto de cada pago no se toca. Lo liberado queda como pago sin imputar.
 */
function conceptoAnularPagado_(ctx, p) {
  requireAdmin_(ctx);
  if (isEmpty_(p.motivo)) fail_('REQUERIDO', 'Indica por qué se anula el cobro.');
  var con = mustGet_(ctx, 'CONCEPTOS', p.concepto_id, 'Cobro');
  var imps = activeRows_(ctx, 'IMPUTACIONES').filter(function (i) { return i.concepto_id === con.id; });
  if (con.etapa === 'Anulado' || con.anulado === true) {
    if (ctx._opRepetida) return { data: { concepto: con, liberado: 0, imputaciones: 0, documentos: [] }, warnings: [], duplicate: true };
    fail_('ANULADO', 'El cobro ' + con.codigo + ' ya está anulado.');
  }
  var dcs = activeRows_(ctx, 'DOC_CONCEPTOS').filter(function (d) { return d.concepto_id === con.id; });
  var emitidos = [], porEmitir = [];
  dcs.forEach(function (d) {
    var doc = getRow_(ctx, 'DOC_VENTA', d.documento_id);
    if (!doc || doc.anulado === true || doc.estado === 'Anulado') return;
    if (doc.estado === 'Emitido') emitidos.push(doc); else porEmitir.push({ dc: d, doc: doc });
  });
  if (emitidos.length) fail_('DOCUMENTO_EMITIDO', 'El cobro ' + con.codigo + ' está en ' + emitidos.map(function (x) { return x.tipo + (x.folio ? ' ' + x.folio : ''); }).join(', ') + ' ya emitida. Primero emite una nota de crédito (consúltalo con el contador) y regístrala; después anula el cobro.');
  var motivo = 'Cobro ' + con.codigo + ' anulado: ' + p.motivo, fuente = 'App · Anular cobro y dejar a favor';
  var liberado = 0, w = [];
  imps.forEach(function (i, n) {
    liberado += Number(i.monto) || 0;
    anularRow_(ctx, 'IMPUTACIONES', i.id, i.version, motivo, p.op_id + '#i' + n, fuente);
  });
  porEmitir.forEach(function (x, n) {
    anularRow_(ctx, 'DOC_CONCEPTOS', x.dc.id, x.dc.version, motivo, p.op_id + '#d' + n, fuente);
    w.push({ code: 'DOCUMENTO_AJUSTADO', message: 'Se sacó del documento por emitir ' + x.doc.codigo + ' (' + x.doc.tipo + '). Revisa sus montos antes de emitirlo.' });
  });
  var actual = getRow_(ctx, 'CONCEPTOS', con.id);
  var u = updateRow_(ctx, 'CONCEPTOS', con.id, actual.version, { etapa: 'Anulado' }, { opId: p.op_id, motivo: motivo, fuente: fuente });
  if (activeRows_(ctx, 'SESIONES').some(function (s) { return s.concepto_id === con.id; })) w.push({ code: 'SESIONES_LIGADAS', message: 'Hay sesiones de tiempo ligadas a este cobro: si corresponde, desvincúlalas.' });
  if (liberado > 0) w.push({ code: 'SALDO_A_FAVOR', message: '$' + liberado + ' quedan a favor del cliente (pago sin imputar). Puedes imputarlos a otro cobro o registrar la devolución.' });
  return { data: { concepto: u.row, liberado: liberado, imputaciones: imps.length, documentos: porEmitir.map(function (x) { return x.doc.codigo; }) }, warnings: w };
}

/* ───────── EG Captura (1.12): lo capturado en terreno, para ordenarlo después ───────── */
var CAPTURA_MAX_BYTES = 300 * 1024 * 1024;
var CAPTURA_DIAS_CONSERVAR = 90;

/** Crea la fila de una captura. archivo (opcional) = datos del archivo ya subido a Capturas EG (los pone Api.gs). */
function capturaCrear_(ctx, p, archivo) {
  requireAdmin_(ctx);
  var c = p.captura || {};
  if (TIPOS_CAPTURA_().indexOf(c.tipo) < 0) fail_('VALOR_INVALIDO', 'Tipo de captura no válido.');
  if (!archivo && isEmpty_(c.texto) && isEmpty_(c.url)) fail_('REQUERIDO', 'La captura está vacía: escribe una nota, un enlace o adjunta un archivo.');
  var datos = { fecha: isEmpty_(c.fecha) ? now_(ctx) : c.fecha, tipo: c.tipo, titulo: c.titulo || '', texto: c.texto || '', url: c.url || '', origen: c.origen || '', estado: 'Nueva', notas: c.notas || '' };
  // 1.13: para qué es (Taller, Cliente, Personal) y montos.
  ['destino', 'monto', 'monto_tipo', 'pago_por', 'monto_mio', 'monto_mama', 'cliente_id'].forEach(function (k) { if (!isEmpty_(c[k])) datos[k] = c[k]; });
  if (datos.cliente_id && !getRow_(ctx, 'CLIENTES', datos.cliente_id)) fail_('NO_EXISTE', 'El cliente elegido no existe.');
  if (datos.cliente_id && !datos.destino) datos.destino = 'Cliente';
  if (!isEmpty_(datos.cliente_id) && datos.estado === 'Nueva') datos.estado = 'Asignada';
  if (archivo) { datos.archivo_id = archivo.id; datos.archivo_nombre = archivo.nombre; datos.archivo_url = archivo.url; datos.mime = archivo.mime; datos.bytes = archivo.bytes; }
  var r = insertRow_(ctx, 'CAPTURAS', datos, { opId: p.op_id, allowCalc: true });
  return { data: { captura: project_(ctx, 'CAPTURAS', r.row) }, warnings: r.warnings || [], duplicate: r.duplicate };
}
function TIPOS_CAPTURA_() { return CONTRACT.enums.tipo_captura; }

/**
 * Opción C (Víctor, 28-10-2026): el archivo de una captura se puede borrar 90 días después de que su cuenta esté consolidada:
 * captura Procesada (o Descartada) y, si tiene trabajo, el trabajo Pagado y Revisado. Los 90 días corren desde el último cambio
 * de la captura o del trabajo (lo más reciente). Devuelve las capturas con archivo que ya cumplen.
 */
function capturasBorrables_(ctx, hoyIso) {
  requireAdmin_(ctx);
  var hoy = toMs_(hoyIso || now_(ctx)), lim = CAPTURA_DIAS_CONSERVAR * 86400000;
  return activeRows_(ctx, 'CAPTURAS').filter(function (c) {
    if (isEmpty_(c.archivo_id) || c.archivo_borrado === true) return false;
    if (c.estado !== 'Procesada' && c.estado !== 'Descartada') return false;
    // Personal (cuentas con mamá): consolidada = incluida en un corte de cuentas.
    if (c.destino === 'Personal' && c.corte !== true && c.estado === 'Procesada' && isEmpty_(c.familia_corte)) return false;
    var desde = toMs_(c.editado_en || c.creado_en);
    if (!isEmpty_(c.trabajo_id) && c.estado === 'Procesada') {
      var t = getRow_(ctx, 'TRABAJOS', c.trabajo_id);
      if (!t || t.estado_pago !== 'Pagado' || t.estado_revision !== 'Revisado') return false;
      desde = Math.max(desde || 0, toMs_(t.editado_en || t.creado_en) || 0);
    }
    return desde !== null && hoy - desde >= lim;
  }).map(function (c) { return { id: c.id, codigo: c.codigo, tipo: c.tipo, titulo: c.titulo, archivo_id: c.archivo_id, archivo_nombre: c.archivo_nombre, bytes: c.bytes, estado: c.estado, trabajo_id: c.trabajo_id }; });
}

/** Texto del recordatorio de 45 días. */
function avisoCapturasCorreo_(lista, total) {
  var mb = function (b) { return (Number(b) / 1048576).toFixed(1) + ' MB'; };
  var L = ['Recordatorio EG Captura (cada 45 días).', '', 'Capturas con archivo en Drive: ' + total + '.'];
  if (!lista.length) L.push('Ninguna se puede borrar todavía (opción C: cuenta consolidada + ' + CAPTURA_DIAS_CONSERVAR + ' días).');
  else {
    L.push('Se pueden borrar (' + lista.length + '): cuenta consolidada hace más de ' + CAPTURA_DIAS_CONSERVAR + ' días.', '');
    lista.forEach(function (c) { L.push('• ' + c.codigo + ' · ' + c.tipo + ' · ' + (c.titulo || c.archivo_nombre || '') + (c.bytes ? ' · ' + mb(c.bytes) : '') + ' · ' + c.estado); });
    L.push('', 'Para borrarlas: app EG Registro → Datos → Capturas → abrir la captura → "Enviar archivo a la papelera" (Drive lo guarda 30 días más).');
  }
  return { asunto: 'EG Captura: ' + (lista.length ? lista.length + ' captura(s) para borrar' : 'nada para borrar'), cuerpo: L.join('\n') };
}

/** 1.13: capturas que nombra un paquete ("capturas": ["CP-…"]). Tienen que existir y estar pendientes (Nueva o Asignada). */
function paqueteCapturas_(ctx, pq) {
  var vistos = {};
  return (pq.capturas || []).map(function (cod) {
    if (vistos[cod]) fail_('PAQUETE', 'La captura ' + cod + ' está repetida en "capturas".');
    vistos[cod] = true;
    var cp = activeRows_(ctx, 'CAPTURAS').filter(function (x) { return x.codigo === cod; })[0];
    if (!cp) fail_('PAQUETE', 'La captura ' + cod + ' no existe.');
    if (cp.estado === 'Procesada' || cp.estado === 'Descartada') fail_('PAQUETE', 'La captura ' + cod + ' ya está ' + cp.estado.toLowerCase() + '.');
    return cp;
  });
}

/* ───────── 1.13 Cuentas con mamá (Personal): lo de cada uno es de cada uno ─────────
 * Si pagó Víctor, la parte de mamá suma a "mamá me debe". Si pagó mamá (o desde su cuenta), la parte de Víctor suma a "le debo".
 * Saldo > 0 = mamá le debe a Víctor; < 0 = Víctor le debe a mamá. Un corte cierra los movimientos abiertos con su saldo.
 */
function familiaCompleto_(c) { return !isEmpty_(c.pago_por) && (Number(c.monto_mio) > 0 || Number(c.monto_mama) > 0); }
function familiaEfecto_(c) { return c.pago_por === 'Yo' ? Number(c.monto_mama) || 0 : -(Number(c.monto_mio) || 0); }
function familiaResumen_(ctx) {
  requireAdmin_(ctx);
  var todas = activeRows_(ctx, 'CAPTURAS').filter(function (c) { return c.destino === 'Personal' && c.estado !== 'Descartada'; });
  var mov = function (c) { return { id: c.id, codigo: c.codigo, fecha: c.fecha, titulo: c.titulo || c.texto || c.archivo_nombre || '', pago_por: c.pago_por, monto_mio: Number(c.monto_mio) || 0, monto_mama: Number(c.monto_mama) || 0, efecto: familiaEfecto_(c), archivo_url: c.archivo_url || '', corte: c.familia_corte || '' }; };

  var cortes = todas.filter(function (c) { return c.corte === true; }).map(function (c) { return { codigo: c.codigo, fecha: c.fecha, saldo: (c.pago_por === 'Mamá' ? -1 : 1) * (Number(c.monto) || 0), notas: c.notas || '' }; });
  var saldo = abiertos.reduce(function (s, m) { return s + m.efecto; }, 0);
  var orden = function (a, b) { return String(a.fecha) < String(b.fecha) ? -1 : 1; };
  abiertos.sort(orden); incompletos.sort(orden); cortes.sort(orden);
  return { saldo: saldo, texto: familiaSaldoTexto_(saldo), abiertos: abiertos, incompletos: incompletos, cortes: cortes, cerrados: todas.filter(function (c) { return c.corte !== true && !isEmpty_(c.familia_corte); }).map(mov) };

function familiaSaldoTexto_(s) { var f = function (n) { return '$' + Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }; return s > 0 ? 'Mamá te debe ' + f(s) : s < 0 ? 'Le debes a mamá ' + f(s) : 'Cuentas al día ($0)'; }

  var corte = insertRow_(ctx, 'CAPTURAS', { fecha: now_(ctx), tipo: 'Otro', titulo: 'Corte de cuentas con mamá', texto: r.texto + ' (' + r.abiertos.length + ' movimientos).', destino: 'Personal', estado: 'Procesada', corte: true, monto: Math.abs(r.saldo), pago_por: r.saldo < 0 ? 'Mamá' : 'Yo', notas: p.notas || '' }, { opId: p.op_id, allowCalc: true }).row;

  r.abiertos.forEach(function (m) { sysUpdate_(ctx, 'CAPTURAS', m.id, { familia_corte: corte.codigo }, 'Incluido en el corte ' + corte.codigo); });

/** 1.13 Resumen mensual de gastos del taller (para el contador). mes = 'AAAA-MM'. */

/** 1.13: archivo "capturas-pendientes.md" para la IA (Proyectos IA EG / Contextos): lo nuevo por revisar y armar en paquetes. */
var CONTEXTO_CAPTURAS = '__capturas';
var CAPTURAS_ARCHIVO = 'capturas-pendientes.md';
function capturasPendientesTexto_(ctx) {
  var pesos = function (n) { return isEmpty_(n) ? '' : '$' + Math.round(Number(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); };

    .sort(function (a, b) { return String(a.fecha) < String(b.fecha) ? -1 : 1; });
  var L = ['# Capturas pendientes — Eisen Garage', '', 'Formato EG-CAPTURAS-1 · actualizado ' + localDate_(now_(ctx)) + ' por la app EG Registro. SOLO LECTURA.',
    'Para cada captura: revisa la nota y el archivo (foto o PDF; los audios no se pueden escuchar: pide a Víctor un resumen), pregunta lo que falte y arma el paquete con "capturas": ["CP-…"] (regla 31). Lo que no sirva para el registro, ponlo en dudas como "descartar CP-…".', ''];

var ACCIONES_ESCRITURA = ['crear', 'editar', 'anular', 'sesion_iniciar', 'sesion_pausar', 'sesion_terminar', 'sesion_posterior', 'concepto_desde_sesiones', 'aporte_revisar', 'aporte_revisar_lote', 'presupuesto_guardar', 'presupuesto_publicar', 'presupuesto_cerrar', 'presupuesto_retirar', 'portal_publicar', 'portal_revocar', 'solicitud_estado', 'respuesta_estado', 'ajustes_guardar', 'concepto_anular_pagado', 'captura_crear', 'captura_borrar_archivo', 'familia_corte', 'recepcion_confirmar', 'paquete_aplicar', 'historial_publicar', 'historial_revocar'];

var TABLA_DE_ACCION = {
  sesion_iniciar: 'SESIONES', sesion_pausar: 'SESIONES', sesion_terminar: 'SESIONES', sesion_posterior: 'SESIONES',
  concepto_desde_sesiones: 'CONCEPTOS', recepcion_confirmar: 'RECEPCIONES'
};

/**
 * Transacción de una solicitud: las escrituras se acumulan en memoria y se aplican al almacenamiento
 * solo si toda la operación terminó sin error. Si algo falla a mitad de camino, no queda nada a medias.
 * Varias escrituras a la misma fila se aplican como una sola (la versión final).
 */
function TxStore(base) { this.base = base; this.t = {}; this.log = []; }
TxStore.prototype.t_ = function (table) { return this.t[table] || (this.t[table] = this.base.list(table).slice()); };
TxStore.prototype.list = function (table) { return this.t_(table); };
TxStore.prototype.get = function (table, id) {
  var rs = this.t_(table);
  for (var i = 0; i < rs.length; i++) if (rs[i].id === id) return rs[i];
  return null;
};
TxStore.prototype.insert = function (table, row) {
  this.t_(table).push(clone_(row));
  this.log.push({ op: 'insert', table: table, id: row.id });
  return row;
};
TxStore.prototype.update = function (table, id, row) {
  var rs = this.t_(table);
  for (var i = 0; i < rs.length; i++) if (rs[i].id === id) { rs[i] = clone_(row); this.log.push({ op: 'update', table: table, id: id }); return row; }
  fail_('NO_EXISTE', 'No se encontró el registro ' + id + ' en ' + table);
};
/**
 * Aplica los cambios al almacenamiento real. Devuelve lo escrito: [{ tabla, id, version }].
 * meta = { op_id, huella, usuario, accion }: si el almacenamiento tiene DIARIO, primero se anota la operación
 * completa (una sola fila) y recién después se escribe en las hojas. Si el guardado se corta a mitad de camino,
 * la próxima escritura la termina desde el diario (recuperarDiario_). Sin meta (importaciones) no se usa diario.
 */
TxStore.prototype.commit = function (meta) {
  var orden = [], vistos = {}, nuevos = {};
  this.log.forEach(function (e) {
    var k = e.table + '|' + e.id;
    if (e.op === 'insert') nuevos[k] = true;
    if (!vistos[k]) { vistos[k] = true; orden.push(e); }
  });
  var self = this;
  var cambios = orden.map(function (e) { return { tabla: e.table, id: e.id, nuevo: !!nuevos[e.table + '|' + e.id], fila: self.get(e.table, e.id) }; });
  this.log = [];
  var pub = meta && meta.publico;
  if (!cambios.length) {
    // Solo PUBLICO (estado de una solicitud o respuesta): no hay nada en la BASE que proteger.
    if (pub) publicoAplicar_(pub.real, pub.ops);
    return [];
  }
  var asiento = (meta && this.base.journalBegin) ? this.base.journalBegin({ op_id: meta.op_id, huella: meta.huella, usuario: meta.usuario, accion: meta.accion, cambios: cambios, publico: pub ? pub.ops : null }) : null;
  try {
    aplicarCambios_(this.base, cambios, false);
  } catch (err) {
    if (!asiento) throw err;
    fail_('GUARDADO_INTERRUMPIDO', 'El guardado se cortó a mitad de camino. Quedó anotado y se completa automáticamente en la próxima solicitud (la pantalla recarga sola). Revisa antes de repetir.', { causa: String(err && err.message || err) });
  }
  // La BASE ya quedó guardada. Recién ahora se escribe lo publicado para clientes (P-3).
  if (pub && asiento) {
    try {
      if (pub.bloqueado) throw new Error('hay publicaciones anteriores pendientes');
      publicoAplicar_(pub.real, pub.ops);
      this.base.journalEnd(asiento);
    } catch (e2) {
      this.base.journalPublicoPendiente(asiento);
      this.publicoAviso = { code: 'PUBLICO_PENDIENTE', message: 'El cambio se guardó, pero no se pudo actualizar lo publicado para clientes (' + (e2 && e2.message) + '). Se reintenta solo en el próximo cambio.' };
    }
  } else {
    if (pub) publicoAplicar_(pub.real, pub.ops);
    if (asiento) this.base.journalEnd(asiento);
  }
  return cambios.map(function (c) { return { tabla: c.tabla, id: c.id, version: c.fila.version }; });

/**
 * Escribe una lista de cambios. Filas nuevas primero (en bloque por hoja), luego las ediciones.
 * reanudar = true (recuperación desde el diario): solo escribe lo que falta o quedó en una versión anterior.
 */
function aplicarCambios_(base, cambios, reanudar) {
  var lotes = {}, tablasLote = [], ediciones = [];
  cambios.forEach(function (c) {
    var actual = reanudar ? base.get(c.tabla, c.id) : null;
    if (reanudar && actual && Number(actual.version) >= Number(c.fila.version)) return; // ya estaba escrito
    if (c.nuevo && !actual) {
      if (base.insertMany) { if (!lotes[c.tabla]) { lotes[c.tabla] = []; tablasLote.push(c.tabla); } lotes[c.tabla].push(c.fila); }
      else base.insert(c.tabla, c.fila);
    } else if (actual || !reanudar) ediciones.push(c);
  });
  tablasLote.forEach(function (t) { base.insertMany(t, lotes[t]); });
  ediciones.forEach(function (c) { base.update(c.tabla, c.id, c.fila); });

/** Termina las operaciones que quedaron a medias (guardado interrumpido). Se llama antes de cada escritura. */
function recuperarDiario_(base, publico) {
  if (!base.journalPending) return 0;
  var pendientes = base.journalPending();
  pendientes.forEach(function (a) {
    aplicarCambios_(base, a.cambios, true);
    // Lo publicado para clientes va después de la BASE: si no se puede escribir ahora, queda pendiente aparte.
    if (a.publico && a.publico.length) {
      if (!publico) { base.journalPublicoPendiente(a); return; }
      try { publicoAplicar_(publico, a.publico); } catch (e) { base.journalPublicoPendiente(a); return; }
    }
    base.journalEnd(a);
  });
  return pendientes.length;
}

/**
 * Usuario vigente según el almacenamiento (después de recuperar el diario): rol y estado actuales.
 * Si ya no está activo, se rechaza. El usuario 'sistema' no se relee.
 */
function usuarioVigente_(ctx) {
  if (isSystem_(ctx) || !ctx.user || !ctx.user.id) return ctx.user;
  var u = ctx.store.get('USUARIOS', ctx.user.id);
  if (!u || u.anulado === true || u.activo !== true || String(u.correo).toLowerCase() !== String(ctx.user.correo).toLowerCase()) {
    fail_('NO_AUTORIZADO', 'La cuenta ' + ctx.user.correo + ' ya no está habilitada en el registro.');
  }
  return u;
}

/**
 * 1.10.1 (P-3): la planilla PUBLICO se escribe DESPUÉS de guardar la BASE. Durante la operación, las lecturas van a
 * PUBLICO y las escrituras se anotan (con sus efectos visibles para las lecturas siguientes de la misma operación).
 * Al guardar, se anotan en el mismo asiento del DIARIO que los cambios de la BASE; recién después se escriben.
 */
function PublicoDiferido(real) { this.real = real; this.ops = []; }

PublicoDiferido.prototype.enlacesActivos = function (recursoId, tipo) {
  var l = this.real.enlacesActivos(recursoId, tipo);
  this.ops.forEach(function (o) {
    if (o.m === 'enlaceRevocar') l = l.filter(function (x) { return x.huella !== o.a[0]; });
    if (o.m === 'enlaceCrear' && o.a[0].recurso_id === recursoId && o.a[0].tipo === tipo) l.push(clone_(o.a[0]));
  });
  return l;
};
PublicoDiferido.prototype.enlaceActivo = function (huella) {
  var x = this.real.enlaceActivo(huella);
  this.ops.forEach(function (o) {
    if (o.m === 'enlaceRevocar' && o.a[0] === huella) x = null;
    if (o.m === 'enlaceCrear' && o.a[0].huella === huella) x = clone_(o.a[0]);
  });
  return x;
};
PublicoDiferido.prototype.publicacionUltima = function (recursoId, tipo) {
  var x = this.real.publicacionUltima(recursoId, tipo);
  this.ops.forEach(function (o) {
    if (o.m === 'publicacionAgregar' && o.a[0].recurso_id === recursoId && o.a[0].tipo === tipo) x = Object.assign({ retirada: false }, clone_(o.a[0]));
    if (o.m === 'publicacionesRetirar' && o.a[0] === recursoId && o.a[1] === tipo && x) { x = clone_(x); x.contenido = ''; x.huella_contenido = ''; x.retirada = true; }
  });
  return x;

['enlaceCrear', 'enlaceRevocar', 'publicacionAgregar', 'publicacionesRetirar', 'solicitudGuardar', 'respuestaGuardar'].forEach(function (m) {
  PublicoDiferido.prototype[m] = function () { this.anotar_(m, Array.prototype.slice.call(arguments)); };
});

/** Escribe en PUBLICO lo anotado. Se puede repetir sin duplicar (recuperación): cada paso revisa si ya está hecho. */
function publicoAplicar_(pub, ops) {
  (ops || []).forEach(function (o) {
    var a = o.a;
    if (o.m === 'enlaceCrear') { if (!pub.enlaceActivo(a[0].huella)) pub.enlaceCrear(a[0]); }
    else if (o.m === 'publicacionAgregar') {
      var u = pub.publicacionUltima(a[0].recurso_id, a[0].tipo);
      if (!(u && Number(u.revision) >= Number(a[0].revision))) pub.publicacionAgregar(a[0]);
    }
    else pub[o.m].apply(pub, a);
  });

/** Publicaciones que quedaron sin escribir (PUBLICO no respondió): se reintentan antes de cada escritura. */
function publicoReintentar_(ctx) {
  if (!ctx.publico || !ctx.store.journalPublicoPendientes) return [];
  var pend = ctx.store.journalPublicoPendientes();
  for (var i = 0; i < pend.length; i++) {
    try { publicoAplicar_(ctx.publico, pend[i].publico); ctx.store.journalEnd(pend[i]); }
    catch (e) { return [{ code: 'PUBLICO_PENDIENTE', message: 'Sigue pendiente actualizar lo publicado para clientes (' + (e && e.message) + '). Se reintenta en el próximo cambio.' }]; }
  }
  return [];
}

function handle_(ctx, action, p) {

  // 1. Si una operación anterior quedó a medias, se termina antes de leer o escribir.
  //    En Apps Script lo hace la API bajo bloqueo (recuperacionEnApi); aquí, en escrituras (que van bajo bloqueo) y en memoria.
  if (escritura || !ctx.recuperacionEnApi) recuperarDiario_(ctx.store, ctx.publico);
  var avisosPublico = escritura ? publicoReintentar_(ctx) : [];
  // 2. Permisos con el usuario vigente: un cambio de rol o una desactivación recuperados rigen desde ya.
  var vigente = usuarioVigente_(ctx);
  if (vigente !== ctx.user) {
    var c0 = {};
    Object.keys(ctx).forEach(function (k) { if (k !== '_assigned') c0[k] = ctx[k]; });
    c0.user = vigente;
    ctx = c0;
  }

  var previo = ctx.store.journalFind ? ctx.store.journalFind(p.op_id) : null;
  if (previo && previo.huella && previo.huella !== huella) {
    fail_('REINTENTO_DISTINTO', 'La operación ' + p.op_id + ' ya se aplicó con otro contenido. Si es un registro nuevo, la pantalla debe usar otro identificador.');
  }
  var tx = new TxStore(ctx.store);
  var c = {};
  Object.keys(ctx).forEach(function (k) { if (k !== '_assigned') c[k] = ctx[k]; });
  c.store = tx;
  c._tx = tx;
  c._opHash = huella;
  // P-15: el mismo op_id con el mismo contenido ya se aplicó (se perdió la respuesta): las acciones de flujo lo reconocen.
  c._opRepetida = !!(previo && previo.huella === huella);
  var diferido = ctx.publico ? new PublicoDiferido(ctx.publico) : null;
  if (diferido) c.publico = diferido;
  c._clientesPortal = {};
  var res = handleInner_(c, action, p);
  // P-7: un cambio en cobros, pagos, imputaciones o documentos refresca el portal del cliente (estado de cuenta).
  if (ctx.publico) {
    var porTabla = { CONCEPTOS: 1, PAGOS: 1, IMPUTACIONES: 1, DOC_VENTA: 1 };
    tx.log.forEach(function (e) {
      if (!porTabla[e.table]) return;
      var f = tx.get(e.table, e.id);
      var cid = f && (f.cliente_id || (e.table === 'IMPUTACIONES' && f.pago_id && (tx.get('PAGOS', f.pago_id) || {}).cliente_id));
      if (cid) c._clientesPortal[cid] = true;
    });
    Object.keys(c._clientesPortal).forEach(function (cid) { (res.warnings = res.warnings || []).push.apply(res.warnings, portalRefrescar_(c, cid)); });
  }
  // Se devuelve la fila tal como queda guardada (versión final), y solo si quien pregunta puede verla.
  var tabla = TABLA_DE_ACCION[action] || p.tabla;
  if (res && res.data && res.data.id && tabla && CONTRACT.tables[tabla]) {
    var fin = tx.get(tabla, res.data.id);
    if (fin) res.data = rowVisible_(c, tabla, fin) ? project_(c, tabla, fin) : { id: fin.id };
  }
  res.escritos = tx.commit({ op_id: p.op_id, huella: huella, usuario: ctx.user && ctx.user.correo, accion: action,
    publico: diferido && diferido.ops.length ? { real: ctx.publico, ops: diferido.ops, bloqueado: avisosPublico.length > 0 } : null });
  var w = avisosPublico.concat(tx.publicoAviso ? [tx.publicoAviso] : []);
  if (w.length) res.warnings = (res.warnings || []).concat(w);
  return res;
}

function handleInner_(ctx, action, p) {
  switch (action) {
    case 'yo':
      return { data: { usuario: project_(ctx, 'USUARIOS', ctx.user), rol: rol_(ctx), ve_pago_trabajadores: canSeeTable_(ctx, 'VALORES_TRABAJADOR') }, warnings: [] };
    case 'inicio':
      var abierta = openSessionOf_(ctx, ctx.user.id);
      return {
        data: {
          usuario: project_(ctx, 'USUARIOS', ctx.user), rol: rol_(ctx), version: CONTRACT.version,
          listas: listasActivas_(ctx), enums: CONTRACT.enums,
          sesion_abierta: abierta ? project_(ctx, 'SESIONES', abierta) : null,
          trabajos: vistaMisTrabajos_(ctx, {}).data,
          resumen: vistaResumen_(ctx, {}).data
        }, warnings: []
      };
    case 'listas': return { data: listasActivas_(ctx), warnings: [] };
    case 'listar':
      if (!canSeeTable_(ctx, p.tabla)) fail_('NO_PERMITIDO', 'No tienes acceso a ' + p.tabla + '.');
      var rs = visibleRows_(ctx, p.tabla, p.incluir_anulados === true && isAdmin_(ctx));
      if (p.filtro) rs = rs.filter(function (r) { return Object.keys(p.filtro).every(function (k) { return String(r[k]) === String(p.filtro[k]); }); });
      return { data: rs, warnings: [] };
    case 'obtener':
      var r = mustGet_(ctx, p.tabla, p.id);
      if (!rowVisible_(ctx, p.tabla, r)) fail_('NO_EXISTE', p.tabla + ' no existe: ' + p.id);
      return { data: project_(ctx, p.tabla, r), warnings: [] };
    case 'crear':
      var c = insertRow_(ctx, p.tabla, p.datos, { opId: p.op_id });
      return { data: project_(ctx, p.tabla, c.row), warnings: c.warnings, duplicate: c.duplicate };
    case 'editar':
      var u = updateRow_(ctx, p.tabla, p.id, p.version, p.cambios, { opId: p.op_id, motivo: p.motivo, fuente: p.fuente });
      return { data: project_(ctx, p.tabla, u.row), warnings: u.warnings, duplicate: u.duplicate };
    case 'anular':
      var a = anularRow_(ctx, p.tabla, p.id, p.version, p.motivo, p.op_id, p.fuente);
      return { data: project_(ctx, p.tabla, a.row), warnings: a.warnings, duplicate: a.duplicate };
    case 'sesion_iniciar': return sesionIniciar_(ctx, p);
    case 'sesion_pausar': return sesionCerrar_(ctx, p, true);
    case 'sesion_terminar': return sesionCerrar_(ctx, p, false);
    case 'sesion_posterior': return sesionPosterior_(ctx, p);

    case 'presupuestos': return vistaPresupuestos_(ctx, p);
    case 'presupuesto_guardar': return presupuestoGuardar_(ctx, p);
    case 'presupuesto_publicar': return presupuestoPublicar_(ctx, p);
    case 'presupuesto_cerrar': return presupuestoCerrar_(ctx, p);
    case 'presupuesto_retirar': return presupuestoRetirar_(ctx, p);
    case 'portal_vista_previa': return portalVistaPrevia_(ctx, p);
    case 'portal_publicar': return portalPublicar_(ctx, p);
    case 'portal_revocar': return portalRevocar_(ctx, p);
    case 'web': return vistaWeb_(ctx, p);
    case 'solicitud_estado': return solicitudEstado_(ctx, p);
    case 'respuesta_estado': return respuestaEstado_(ctx, p);
    case 'ajustes_guardar': return ajustesGuardar_(ctx, p);
    case 'concepto_anular_pagado': return conceptoAnularPagado_(ctx, p);
    case 'captura_crear': return capturaCrear_(ctx, p, ctx._capturaArchivo || null);
    case 'capturas_borrables': return { data: { capturas: capturasBorrables_(ctx) }, warnings: [] };
    case 'captura_borrar_archivo': return capturaMarcarBorrado_(ctx, p);
    case 'familia_resumen': return { data: familiaResumen_(ctx), warnings: [] };
    case 'familia_corte': return familiaCorte_(ctx, p);
    case 'gastos_resumen': return gastosResumen_(ctx, p);
    case 'capturas_pendientes': requireAdmin_(ctx); return { data: { texto: capturasPendientesTexto_(ctx) }, warnings: [] };
    case 'recepcion_confirmar':
      requireAdmin_(ctx);
      var cambiosRc = { estado: 'Confirmada' };
      if (!isEmpty_(p.evidencia)) cambiosRc.evidencia = p.evidencia;
      var rc = updateRow_(ctx, 'RECEPCIONES', p.recepcion_id, p.version, cambiosRc, { opId: p.op_id, noRect: true });
      return { data: getRow_(ctx, 'RECEPCIONES', p.recepcion_id), warnings: rc.warnings, duplicate: rc.duplicate };
    case 'resumen': return vistaResumen_(ctx, p);
    case 'ficha': return vistaFicha_(ctx, p);
    case 'mis_trabajos': return vistaMisTrabajos_(ctx, p);
    case 'control_economico': return vistaControlEconomico_(ctx, p);
    case 'cierre': return vistaCierre_(ctx, p);
    case 'contexto_ia': return vistaContextoIA_(ctx, p);
    case 'catalogo': return vistaCatalogo_(ctx, p);
    case 'historial_vista_previa': return historialVistaPrevia_(ctx, p);
    case 'historial_publicar': return historialPublicar_(ctx, p);
    case 'historial_revocar': return historialRevocar_(ctx, p);
    case 'clientes': return vistaClientes_(ctx, p);
    case 'stock': return vistaStock_(ctx, p);
    case 'horas': return vistaHoras_(ctx, p);
    case 'integridad': requireAdmin_(ctx); return { data: revisarIntegridad_(ctx), warnings: [] };
    case 'pago_trabajadores': return vistaPagoTrabajadores_(ctx, p);
    case 'contrato': return vistaContrato_(ctx, p);
    case 'paquete_validar': return paqueteValidar_(ctx, p);
    case 'paquete_aplicar': return paqueteAplicar_(ctx, p);
  }
  fail_('ACCION', 'Acción desconocida: ' + action);
}

// Almacenamiento en memoria con la misma interfaz que SheetStore. Se usa en pruebas y en el modo demo.
function MemoryStore(seed) {
  this.tables = {};
  if (seed) for (var k in seed) this.tables[k] = seed[k].map(function (r) { return JSON.parse(JSON.stringify(r)); });
}
MemoryStore.prototype.t_ = function (table) { return this.tables[table] || (this.tables[table] = []); };
MemoryStore.prototype.list = function (table) { return this.t_(table); };
MemoryStore.prototype.get = function (table, id) {
  var rs = this.t_(table);
  for (var i = 0; i < rs.length; i++) if (rs[i].id === id) return rs[i];
  return null;
};
MemoryStore.prototype.insert = function (table, row) { this.t_(table).push(JSON.parse(JSON.stringify(row))); return row; };
MemoryStore.prototype.update = function (table, id, row) {
  var rs = this.t_(table);
  for (var i = 0; i < rs.length; i++) if (rs[i].id === id) { rs[i] = JSON.parse(JSON.stringify(row)); return row; }
  throw new Error('No existe ' + id + ' en ' + table);
};
MemoryStore.prototype.verify = function (table, id, version) { var r = this.get(table, id); return !!r && Number(r.version) === Number(version); };
MemoryStore.prototype.dump = function () { return JSON.parse(JSON.stringify(this.tables)); };
// Diario de operaciones (ver TxStore.commit): una entrada por escritura confirmada; Pendiente mientras se aplica.
MemoryStore.prototype.diario_ = function () { return this.diario || (this.diario = []); };
MemoryStore.prototype.journalBegin = function (a) {
  var e = { op_id: a.op_id, huella: a.huella, usuario: a.usuario, accion: a.accion, fecha: new Date().toISOString(), estado: 'Pendiente', cambios: JSON.parse(JSON.stringify(a.cambios)), publico: a.publico ? JSON.parse(JSON.stringify(a.publico)) : null };
  if (this.fallarDiario) throw new Error(this.fallarDiario);
  this.diario_().push(e);
  return e;
};
MemoryStore.prototype.journalEnd = function (e) { e.estado = 'Completa'; e.cambios = null; e.publico = null; };
MemoryStore.prototype.journalPending = function () { return this.diario_().filter(function (e) { return e.estado === 'Pendiente'; }); };
// 1.10.1: la BASE quedó guardada pero falta escribir lo publicado para clientes.
MemoryStore.prototype.journalPublicoPendiente = function (e) { e.estado = 'Publico'; e.cambios = null; };
MemoryStore.prototype.journalPublicoPendientes = function () { return this.diario_().filter(function (e) { return e.estado === 'Publico'; }); };
MemoryStore.prototype.journalFind = function (opId) {
  var d = this.diario_();
  for (var i = d.length - 1; i >= 0; i--) if (d[i].op_id === opId) return d[i];
  return null;
};

// Planilla PUBLICO en memoria (pruebas y modo demo). Misma interfaz que PublicoSheet (Store.gs).
function PublicoMemory() { this.ENLACES = []; this.PUBLICACIONES = []; this.SOLICITUDES = []; this.RESPUESTAS = []; }
PublicoMemory.prototype.solicitudes = function () { return JSON.parse(JSON.stringify(this.SOLICITUDES)); };
PublicoMemory.prototype.respuestas = function () { return JSON.parse(JSON.stringify(this.RESPUESTAS)); };
PublicoMemory.prototype.solicitudGuardar = function (id, cambios) { var x = this.SOLICITUDES.filter(function (r) { return r.id === id; })[0]; if (!x) fail_('NO_EXISTE', 'No existe ' + id); Object.assign(x, cambios); };
PublicoMemory.prototype.respuestaGuardar = function (id, cambios) { var x = this.RESPUESTAS.filter(function (r) { return r.id === id; })[0]; if (!x) fail_('NO_EXISTE', 'No existe ' + id); Object.assign(x, cambios); };
PublicoMemory.prototype.enlacesActivos = function (recursoId, tipo) {
  return this.ENLACES.filter(function (x) { return x.recurso_id === recursoId && x.tipo === tipo && !x.revocado_en; }).map(function (x) { return JSON.parse(JSON.stringify(x)); });
};
PublicoMemory.prototype.enlaceActivo = function (huella) {
  var x = this.ENLACES.filter(function (y) { return y.huella === huella && !y.revocado_en; })[0];
  return x ? JSON.parse(JSON.stringify(x)) : null;
};
PublicoMemory.prototype.enlaceCrear = function (r) { this.ENLACES.push({ huella: r.huella, tipo: r.tipo, recurso_id: r.recurso_id, creado_en: r.creado_en, vence_en: r.vence_en || '', revocado_en: '', ultimo_uso: '', usos: 0 }); };
PublicoMemory.prototype.enlaceRevocar = function (huella, ahora) { this.ENLACES.forEach(function (x) { if (x.huella === huella && !x.revocado_en) x.revocado_en = ahora; }); };
PublicoMemory.prototype.publicacionUltima = function (recursoId, tipo) {
  var l = this.PUBLICACIONES.filter(function (x) { return x.recurso_id === recursoId && x.tipo === tipo; });
  l.sort(function (a, b) { return Number(b.revision) - Number(a.revision); });
  return l[0] ? JSON.parse(JSON.stringify(l[0])) : null;
};
PublicoMemory.prototype.publicacionAgregar = function (r) { this.PUBLICACIONES.push(Object.assign({ retirada: false }, JSON.parse(JSON.stringify(r)))); };
PublicoMemory.prototype.publicacionesRetirar = function (recursoId, tipo) {
  this.PUBLICACIONES.forEach(function (x) { if (x.recurso_id === recursoId && x.tipo === tipo) { x.contenido = ''; x.huella_contenido = ''; x.retirada = true; } });
};

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var DEMO = !APP_CONFIG.API_URL || /[?&]demo=1/.test(location.search);
var S = { token:null, acceso:null, inicio:null, tab:'trabajos', tickTimer:null, demoUser:null };
/* Llave de acceso de este equipo (1.5.3): se entra con Google una vez y la llave dura 30 días sin uso. */
var ACCESO_KEY = 'eg_registro_acceso';
function leerAcceso(){ try { var v = localStorage.getItem(ACCESO_KEY); return /^[0-9a-f]{64}$/.test(v || '') ? v : null; } catch (e) { return null; } }
function guardarAcceso(v){ S.acceso = v; try { localStorage.setItem(ACCESO_KEY, v); } catch (e) {} }
function borrarAcceso(){ S.acceso = null; try { localStorage.removeItem(ACCESO_KEY); } catch (e) {} }
function nombreEquipo(){ var u = navigator.userAgent || ''; return /iPhone|iPad/.test(u) ? 'iPhone/iPad' : /Android/.test(u) ? 'Android' : /Windows/.test(u) ? 'Windows' : /Mac/.test(u) ? 'Mac' : 'Navegador'; }
if (!DEMO) S.acceso = leerAcceso();

/* ───── utilidades de pantalla ───── */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function opId(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2); }
var toastTimer;
function toast(msg, kind){
  var t = $('toast'); t.textContent = msg; t.className = 'toast on' + (kind ? ' ' + kind : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.className = 'toast'; }, kind === 'err' ? 6000 : 3500);
}
function showWarnings(ws){ if (ws && ws.length) toast(ws.map(function(w){ return w.message; }).join(' · '), 'warn'); }
function plate(p, big){
  var txt = String(p || '').toUpperCase().replace(/\s+/g,'').replace(/-/g,'·');
  if (!txt) return '<span class="plate' + (big ? ' big' : '') + '"><small>SIN PATENTE</small><b>—</b></span>';
  return '<span class="plate' + (big ? ' big' : '') + '"><small>CHILE</small><b>' + esc(txt) + '</b></span>';
}
function fmtFecha(iso){
  if (!iso) return '';
  var d = /^\d{4}-\d{2}-\d{2}$/.test(iso) ? new Date(iso + 'T12:00:00') : new Date(iso);
  return d.toLocaleDateString('es-CL', { day:'2-digit', month:'short', year:'numeric' });
}
function fmtMin(m){ m = Number(m) || 0; var h = Math.floor(m / 60), r = m % 60; return h ? h + ' h ' + (r < 10 ? '0' : '') + r + ' min' : r + ' min'; }
function fmtHM(m){ m = Number(m) || 0; var h = Math.floor(m / 60), r = m % 60; return h + ':' + (r < 10 ? '0' : '') + r; }
function fmtKm(n){ return (n === '' || n == null) ? '' : Number(n).toLocaleString('es-CL') + ' km'; }
function dispositivo(){ var w = Math.min(screen.width, screen.height); return w < 600 ? 'Celular' : (w < 1000 ? 'Tablet' : 'PC'); }
function isAdmin(){ return S.inicio && S.inicio.rol !== 'Tecnico'; }
function options(list, sel, empty){
  var h = empty ? '<option value="">' + esc(empty) + '</option>' : '';
  (list || []).forEach(function(v){ h += '<option' + (v === sel ? ' selected' : '') + '>' + esc(v) + '</option>'; });
  return h;
}

/* ───── API (producción) o lógica local (demo) ───── */
function api(action, payload){
  payload = payload || {};
  if (DEMO) return Promise.resolve(DemoApi.call(action, payload));
  // Con llave de acceso no se manda el token de Google (salvo para sacar la llave).
  var usarLlave = S.acceso && action !== 'acceso_abrir';
  var body = JSON.stringify({ action: action, payload: payload, id_token: usarLlave ? null : S.token, sesion: usarLlave ? S.acceso : null });
  function intento(n){
    return fetch(APP_CONFIG.API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: body, redirect:'follow' })
      .then(function(r){ return r.json(); })
      .catch(function(e){
        // Reintento con el mismo op_id: el servidor no lo aplica dos veces.
        if (n < 2) return new Promise(function(res){ setTimeout(res, 1200); }).then(function(){ return intento(n + 1); });
        return { ok:false, error:{ code:'RED', message:'Sin conexión con el servidor. Revisa la señal y reintenta.' } };
      });
  }
  return intento(1);
}
function call(action, payload){
  return api(action, payload).then(function(r){
    if (!r.ok){
      var e = r.error || {};
      if (e.code === 'NO_AUTENTICADO') { S.token = null; borrarAcceso(); S.inicio = null; cerrarHoja(); renderLogin(); }
      toast(e.message || 'Error', 'err');
      // Guardado cortado o no verificado: se recarga para no repetir sobre datos viejos.
      if (e.code === 'GUARDADO_INTERRUMPIDO' || e.code === 'NO_VERIFICADO') { cerrarHoja(); setTimeout(function(){ cargar(); }, 1500); }
      var err = new Error(e.message); err.code = e.code; err.details = e.details; throw err;
    }
    showWarnings(r.warnings);
    return r;
  });
}

/* ───── inicio de sesión ───── */
function renderLogin(){
  $('tabs').hidden = true; $('run').className = 'run';
  $('who').textContent = '';
  if (DEMO){
    $('demoNote').hidden = false;
    $('main').innerHTML = '<div class="login"><h2>¿Quién entra?</h2><p>Elige un usuario de prueba para ver lo que ve cada rol.</p><div class="roles">' +
      '<button class="btn big" data-act="demo-user" data-u="victor@demo.cl">Víctor · administrador</button>' +
      '<button class="btn big ghost" data-act="demo-user" data-u="victoria@demo.cl">Victoria · administración</button>' +
      '<button class="btn big ghost" data-act="demo-user" data-u="juan@demo.cl">Juan · técnico</button></div></div>';
    return;
  }
  $('main').innerHTML = '<div class="login"><h2>Registro del taller</h2><p>Entra con tu cuenta Google habilitada.</p><div id="gbtn" style="display:inline-block;margin-top:16px"></div></div>';
  function initGsi(){
    if (!window.google || !google.accounts){ return setTimeout(initGsi, 300); }
    google.accounts.id.initialize({ client_id: APP_CONFIG.CLIENT_ID, callback: entrarConGoogle, auto_select: true });
    google.accounts.id.renderButton($('gbtn'), { theme:'filled_black', size:'large', text:'signin_with', locale:'es' });
    google.accounts.id.prompt();
  }
  initGsi();
}

/* Google entrega un token de 1 hora: se cambia por la llave de acceso de este equipo y se carga. */
function entrarConGoogle(resp){
  S.token = resp.credential;
  $('main').innerHTML = '<div class="empty">Entrando…</div>';
  api('acceso_abrir', { equipo: nombreEquipo() }).then(function(r){
    if (r.ok && r.data && r.data.sesion) { guardarAcceso(r.data.sesion); S.token = null; }
  }).then(function(){ return cargar(); }).catch(function(){});
}
function arrancar(){
  if (DEMO || !S.acceso) return renderLogin();
  $('main').innerHTML = '<div class="empty">Cargando…</div>';
  cargar().catch(function(e){
    if (e && e.code === 'NO_AUTENTICADO') return; // ya volvió a la pantalla de inicio de sesión
    $('main').innerHTML = '<div class="login"><h2>No se pudo cargar</h2><p>' + esc(e && e.message || 'Error') + '</p><button class="btn big" type="button" data-act="reintentar">Reintentar</button></div>';
  });
}
function abrirCuenta(){
  if (!S.inicio) return;
  var u = S.inicio.usuario || {};
  var h = '<p>' + esc(u.nombre || '') + (u.correo ? ' · ' + esc(u.correo) : '') + '</p>' +
    '<p class="s">Este equipo queda con la sesión abierta y se renueva sola cada vez que usas la app. Si pasan 30 días sin usarla, pide entrar de nuevo con Google.</p>' +
    '<div class="roles" style="margin-top:14px"><button class="btn big" type="button" data-act="acceso-salir">Cerrar sesión en este equipo</button>' +
    '<button class="btn big ghost" type="button" data-act="acceso-salir-todo">Cerrar sesión en todos mis equipos</button></div>' +
    '<p class="s" style="margin-top:12px">Si se pierde un celular: usa "todos mis equipos" desde otro equipo, o desactiva al usuario en Usuarios.</p>';
  abrirHoja('Mi sesión', h);
}
function salir(todas, el){
  if (el) el.disabled = true;
  var fin = function(){
    borrarAcceso(); S.token = null; S.inicio = null; cerrarHoja();
    try { google.accounts.id.disableAutoSelect(); } catch (e) {}
    renderLogin(); toast(todas ? 'Sesión cerrada en todos tus equipos.' : 'Sesión cerrada en este equipo.');
  };
  api('acceso_cerrar', { todas: !!todas }).then(fin, fin);
}

/* ───── carga principal ───── */
function cargar(){
  return call('inicio', {}).then(function(r){
    S.inicio = r.data;
    $('who').textContent = r.data.usuario.nombre;
    $('who').title = r.data.rol === 'Tecnico' ? 'Técnico' : r.data.rol === 'Administracion' ? 'Administración' : 'Administrador';
    renderTabs(); renderRun(); render();
  });
}

function renderTabs(){
  var tabs = [['trabajos','Trabajos'],['vehiculos','Vehículos'],['horas','Horas']];
  if (isAdmin()) { tabs.splice(2, 0, ['clientes','Clientes']); tabs.push(['cierre','Cierre']); tabs.push(['revisar','Revisar']); tabs.push(['web','Web']); tabs.push(['datos','Datos']); }
  $('tabsIn').innerHTML = tabs.map(function(t){ return '<button type="button" data-act="tab" data-tab="' + t[0] + '"' + (S.tab === t[0] ? ' aria-current="page"' : '') + '>' + t[1] + '</button>'; }).join('');
  $('tabs').hidden = false;
  var act = document.querySelector('#tabsIn [aria-current="page"]'); if (act && act.scrollIntoView) try { act.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (e) {}
}

function render(){
  if (S.tab === 'trabajos') return renderTrabajos();

/* Foto comprimida a 900 px, JPEG 72 % (idea de Taller Pro v10). */
var fotoActual = null;
function comprimirFoto(e){
  var file = e.target.files[0]; if (!file) return;
  var rd = new FileReader();
  rd.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      var MAX = 900, w = img.width, h = img.height;
      if (w > MAX){ h = Math.round(h * MAX / w); w = MAX; } if (h > MAX){ w = Math.round(w * MAX / h); h = MAX; }
      var c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
      fotoActual = c.toDataURL('image/jpeg', 0.72);
      $('dPrev').src = fotoActual; $('dPrev').style.display = 'block';
    };
    img.src = ev.target.result;
  };
  rd.readAsDataURL(file);
}

function dictar(){
  var R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!R) return toast('El dictado no está disponible en este navegador.', 'err');
  var rec = new R(); rec.lang = 'es-CL'; rec.interimResults = false;
  rec.onresult = function(e){ var t = e.results[0][0].transcript.trim(); var d = $('dDesc'); d.value = d.value ? d.value + ' ' + t : t; };
  rec.onerror = function(){ toast('No se pudo dictar. Reintenta.', 'err'); };
  rec.start(); toast('Habla ahora…');
}

/** Km escrito a mano: '' si viene vacío, número si es 12345 o 12.345 (puntos de miles), null si no es válido. */
function leerKm(txt){
  var v = String(txt || '').trim().replace(/\s/g, '');
  if (!v) return '';
  if (/^\d+$/.test(v) || /^\d{1,3}(\.\d{3})+$/.test(v)) return Number(v.replace(/\./g, ''));
  return null;
}
function crearNuevoTrabajo(btn){

  var km = leerKm($('ntKm').value), prog = $('ntProg').value, asig = $('ntAsig').value;
  if (km === null) { toast('Km sin decimales: 12345 o 12.345.', 'err'); $('ntKm').focus(); return; }
  var datos = { cliente_id: n.eq.cliente_id, equipo_id: n.eq.id, descripcion: desc, estado_comercial: $('ntCom').value };

    return asignar.then(function(){
      toast('Trabajo ' + tr.codigo + ' creado.');

      S.nt = null; cerrarHoja(); S.tab = 'trabajos';
      return cargar().then(function(){ abrirTrabajo(tr.id); });
    });
  }).catch(function(){ btn.disabled = false; });
}

/* P-4 (1.10.1): números en el editor. Se muestran con coma decimal y sin separador de miles; al leer se acepta

function numEditor(v){ return v == null || v === '' ? '' : String(v).replace('.', ','); }
function leerNumEditor(v){
  v = String(v == null ? '' : v).trim().replace(/\s/g, '');
  if (v === '') return '';
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(v)) return Number(v.replace(/\./g, '').replace(',', '.'));
  if (v.indexOf(',') >= 0) return Number(v.replace(/\./g, '').replace(',', '.'));
  return Number(v);
}

}

function leerItemsPs(){
  Array.prototype.forEach.call(document.querySelectorAll('.psItem'), function(el){

    var num = function(sel){ return leerNumEditor(el.querySelector(sel).value); };
    it.tipo = el.querySelector('.piTipo').value; it.descripcion = el.querySelector('.piDesc').value.trim();

function calcItemPs(it){

  if (costo === '' && it.catalogo_id) { var c = (PSU.cat || []).filter(function(z){ return z.id === it.catalogo_id; })[0]; if (c && c.ultimo) costo = c.ultimo.costo_neto; }
  var precio = it.precio_unitario !== '' ? it.precio_unitario : (costo !== '' && it.margen_pct !== '' && it.margen_pct < 100 ? Math.round(costo / (1 - it.margen_pct / 100)) : null);
  var cant = it.cantidad === '' ? 1 : it.cantidad;

function guardarCierreDias(v){ try { localStorage.setItem(CIERRE_KEY, String(v)); } catch (e) {} }
function pesos(n){ return n === null || n === undefined ? 'Desconocido' : '$' + Number(n).toLocaleString('es-CL'); }

  var dias = cierreDias();

function decisionPendiente(){
